name: db-compat

# 新增数据库真库测试（T1 轻量级）。
# 与 test.yml 解耦：主测试任务只保留 MySQL / PostgreSQL / SQLServer 全量，
# 本工作流按数据库并行拉起容器，只跑对应提供者的测试组。
#
# 首期为 advisory（continue-on-error: true）：任一数据库失败只告警，不阻断发布。
# 稳定后把对应项改为必备：删除 job 级 continue-on-error，或拆成独立 job。
#
# 环境变量约定：XCode_<key> 注入连接串，测试侧由 [LiveDatabaseFact] 识别，无需探测。
# Presto 与 TDengine 驱动已在测试项目直接引用 NuGet 包（NewLife.Presto / NewLife.TDengine），不再运行时下载。

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compat:
    name: db-compat (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # 官方镜像，启动快。连接串与初始化脚本首次运行若与实际镜像不符，按容器日志校正。
          - name: firebird
            image: firebirdsql/firebird:5.0.3
            args: '-e FIREBIRD_ROOT_PASSWORD=masterkey -e FIREBIRD_DATABASE=test.fdb -p 3050:3050'
            probe: 'docker exec db bash -c "</dev/tcp/127.0.0.1/3050"'
            setup: ''
            conn: 'Database=/firebird/data/test.fdb;DataSource=127.0.0.1;Port=3050;User=SYSDBA;Password=masterkey;Dialect=3'
            filter: 'FullyQualifiedName~FirebirdTests'

          - name: clickhouse
            image: clickhouse/clickhouse-server:24.8
            args: '-e CLICKHOUSE_USER=default -e CLICKHOUSE_PASSWORD=clickhouse -p 8123:8123 -p 9000:9000'
            probe: 'docker exec db clickhouse-client --user default --password clickhouse --query "SELECT 1"'
            setup: ''
            conn: 'Host=127.0.0.1;Port=8123;Database=default;Username=default;Password=clickhouse'
            filter: 'FullyQualifiedName~ClickHouseTests'

          - name: mongodb
            image: mongo:7
            args: '-p 27017:27017'
            probe: 'docker exec db mongosh --quiet --eval "db.runCommand({ping:1}).ok"'
            setup: ''
            conn: 'mongodb://127.0.0.1:27017/test'
            filter: 'FullyQualifiedName~MongoDBTests'

          - name: tdengine
            image: tdengine/tdengine:3.3.6.13
            args: '-p 6041:6041'
            # taos CLI 查询失败时仍可能返回 0，用输出内容判断真正就绪
            probe: 'docker exec db taos -s "show databases;" | grep -q information_schema'
            # 容器刚启动时可能报 Out of dnodes，创建测试库需要重试到成功
            setup: |
              set -euo pipefail
              for i in $(seq 1 60); do
                docker exec db taos -s "create database if not exists db;" >/dev/null 2>&1 || true
                if docker exec db taos -s "show databases;" 2>/dev/null | grep -qE '^[[:space:]]*db[[:space:]]*\|'; then
                  exit 0
                fi
                sleep 2
              done
              docker exec db taos -s "create database if not exists db;"
              exit 1
            conn: 'Server=127.0.0.1;Port=6041;Database=db;user=root;password=taosdata'
            filter: 'FullyQualifiedName~TDengineTests'

          - name: influxdb
            image: influxdb:2.7
            args: '-p 8086:8086'
            probe: 'docker exec db influx ping'
            setup: 'docker exec db influx setup --force --username admin --password password123 --org newlife --bucket test --token newlife-compat-token-0123456789-abcdefghijklmnopqrstuvwxyz'
            conn: 'Server=http://127.0.0.1:8086;Token=newlife-compat-token-0123456789-abcdefghijklmnopqrstuvwxyz;Organization=newlife;Bucket=test'
            filter: 'FullyQualifiedName~InfluxDBTests'

          - name: influxdb1
            image: influxdb:1.8
            args: '-e INFLUXDB_DB=test -p 8086:8086'
            probe: 'docker exec db curl -sf http://127.0.0.1:8086/ping'
            setup: 'docker exec db influx -execute "CREATE DATABASE test" || true'
            conn: 'Server=http://127.0.0.1:8086;Database=test;User=root;Password=root;Version=1'
            filter: 'FullyQualifiedName~InfluxDBVersionLiveTests'

          - name: monetdb
            image: monetdb/monetdb:Dec2025-SP3
            args: '-p 50000:50000'
            probe: 'docker exec db bash -c "</dev/tcp/127.0.0.1/50000"'
            setup: ''
            conn: 'Host=127.0.0.1;Port=50000;Database=demo;User=monetdb;Password=monetdb'
            filter: 'FullyQualifiedName~MonetDBTests'

          - name: trino
            image: trinodb/trino:466
            args: '-p 8080:8080'
            probe: 'docker exec db trino --execute "SELECT 1"'
            setup: ''
            conn: 'Host=127.0.0.1;Port=8080;Catalog=tpch;Schema=tiny;User=test'
            filter: 'FullyQualifiedName~PrestoTests'

          # PrestoDB 官方镜像自带 tpch/tpcds 连接器，与 Trino 分开验证新驱动
          - name: presto
            image: prestodb/presto:0.300
            args: '-p 8081:8080'
            probe: 'curl -sf http://127.0.0.1:8081/v1/info'
            setup: ''
            conn: 'Host=127.0.0.1;Port=8081;Catalog=tpch;Schema=tiny;User=test'
            filter: 'FullyQualifiedName~PrestoTests'

          - name: questdb
            image: questdb/questdb:10.2.0
            args: '-p 8812:8812 -p 9000:9000'
            probe: 'bash -c "</dev/tcp/127.0.0.1/8812"'
            setup: ''
            conn: 'Server=127.0.0.1;Port=8812;Database=qdb;Uid=admin;Pwd=quest'
            filter: 'FullyQualifiedName~QuestDbLiveTest'

          - name: cratedb
            image: crate:5.10.4
            args: '-p 15432:5432 -p 4200:4200'
            probe: 'bash -c "</dev/tcp/127.0.0.1/15432"'
            setup: ''
            conn: 'Server=127.0.0.1;Port=15432;Database=doc;Uid=crate;Pwd='
            filter: 'FullyQualifiedName~CrateDbLiveTest'

          - name: cockroach
            image: cockroachdb/cockroach:v25.4.21
            # 单节点只允许监听 localhost，使用 host 网络让宿主机测试进程直接访问
            args: '--network host'
            cmd: 'start-single-node --insecure --listen-addr=localhost:26257 --http-addr=localhost:8089'
            probe: 'docker exec db cockroach sql --insecure --host=127.0.0.1:26257 -e "SELECT 1"'
            setup: 'docker exec db cockroach sql --insecure --host=127.0.0.1:26257 -e "CREATE DATABASE IF NOT EXISTS test"'
            conn: 'Server=127.0.0.1;Port=26257;Database=test;Uid=root;Pwd='
            filter: 'FullyQualifiedName~CockroachDbLiveTest'

          - name: greptimedb
            image: greptime/greptimedb:v1.3.1
            args: '-p 4000:4000 -p 4003:4003'
            cmd: 'standalone start --http-addr 0.0.0.0:4000 --grpc-bind-addr 0.0.0.0:4001 --mysql-addr 0.0.0.0:4002 --postgres-addr 0.0.0.0:4003'
            probe: 'curl -sf http://127.0.0.1:4000/health'
            setup: ''
            conn: 'Server=127.0.0.1;Port=4003;Database=public;Uid=greptime;Pwd='
            filter: 'FullyQualifiedName~GreptimeDbLiveTest'

          - name: victoriametrics
            image: victoriametrics/victoria-metrics:v1.156.0
            args: '-p 8428:8428'
            probe: 'curl -sf http://127.0.0.1:8428/health'
            setup: ''
            conn: 'Server=http://127.0.0.1:8428'
            filter: 'FullyQualifiedName~VictoriaMetricsLiveTest'

          - name: prometheus
            image: prom/prometheus:v3.16.0
            args: '-p 9090:9090'
            probe: 'curl -sf http://127.0.0.1:9090/-/healthy'
            setup: ''
            conn: 'Server=http://127.0.0.1:9090'
            filter: 'FullyQualifiedName~PrometheusTests'

          - name: iotdb
            image: apache/iotdb:2.0.11-standalone
            args: '-p 6667:6667 -p 18080:18080 -e cn_internal_address=127.0.0.1 -e cn_internal_port=10710 -e cn_consensus_port=10720 -e cn_seed_config_node=127.0.0.1:10710 -e dn_rpc_address=127.0.0.1 -e dn_internal_address=127.0.0.1 -e dn_rpc_port=6667 -e dn_mpp_data_exchange_port=10740 -e dn_schema_region_consensus_port=10750 -e dn_data_region_consensus_port=10760 -e dn_seed_config_node=127.0.0.1:10710 -e enable_rest_service=true -e rest_service_port=18080 -e "IOTDB_JMX_OPTS=-Xms1G -Xmx1G"'
            probe: 'bash -c "</dev/tcp/127.0.0.1/18080"'
            setup: ''
            conn: 'Server=http://127.0.0.1:18080;User=root;Password=root'
            filter: 'FullyQualifiedName~IoTDBTests'

          # InfluxDB 3 Core 默认开启鉴权，/health 未带令牌返回 401，只能用端口判断就绪；
          # 令牌与测试库在 setup 阶段创建后写入 GITHUB_ENV
          - name: influxdb3
            image: influxdb:3-core
            args: '-p 8181:8181'
            cmd: 'influxdb3 serve --node-id=node0 --object-store=file --data-dir=/var/lib/influxdb3'
            probe: 'bash -c "</dev/tcp/127.0.0.1/8181"'
            setup: |
              set -euo pipefail
              output=$(docker exec db influxdb3 create token --admin --host http://127.0.0.1:8181 2>&1)
              token=$(printf '%s' "$output" | grep -oE 'apiv3_[A-Za-z0-9_-]+' | head -n1)
              if [ -z "$token" ]; then
                echo "::error::未能从 influxdb3 输出解析管理员令牌"
                printf '%s\n' "$output"
                exit 1
              fi
              docker exec db influxdb3 create database test --host http://127.0.0.1:8181 --token "$token"
              echo "XCode_influxdb3=Server=http://127.0.0.1:8181;Database=test;Token=$token;Version=3" >> "$GITHUB_ENV"
            conn: ''
            filter: 'FullyQualifiedName~InfluxDBVersionLiveTests'

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotNET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Start ${{ matrix.name }}
      shell: bash
      run: |
        set -euo pipefail
        docker run -d --name db ${{ matrix.args }} ${{ matrix.image }} ${{ matrix.cmd }}
        docker ps --filter name=db --format '{{.Image}} {{.Status}}'

    - name: Wait for ${{ matrix.name }}
      shell: bash
      # 逐库探测，上限 6 分钟；失败时输出容器日志便于校正镜像参数
      run: |
        set -euo pipefail
        for i in $(seq 1 72); do
          if ${{ matrix.probe }} >/dev/null 2>&1; then
            echo "${{ matrix.name }} ready after $i probe(s)"
            exit 0
          fi
          sleep 5
        done
        echo "::error::${{ matrix.name }} 未在 6 分钟内就绪"
        docker logs db 2>&1 | tail -200
        exit 1

    - name: Setup data ${{ matrix.name }}
      if: matrix.setup != ''
      shell: bash
      env:
        SETUP: ${{ matrix.setup }}
      run: printf '%s\n' "$SETUP" | bash

    - name: Test ${{ matrix.name }}
      shell: bash
      env:
        DB_KEY: ${{ matrix.name }}
        DB_CONN: ${{ matrix.conn }}
        DB_FILTER: ${{ matrix.filter }}
      # XCode 自动把 XCode_<name> 环境变量注册为数据连接；conn 为空时使用 setup 写入的变量
      run: |
        set -o pipefail
        if [ -n "${DB_CONN:-}" ]; then export "XCode_${DB_KEY}=${DB_CONN}"; fi
        dotnet test XUnitTest.XCode/XUnitTest.XCode.csproj -c Release \
          --filter "$DB_FILTER" \
          --blame-hang-timeout 10m --blame-hang-dump-type mini \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=db-${DB_KEY}.trx" \
          --results-directory TestResults

    - name: Dump container logs
      if: failure()
      shell: bash
      run: docker logs db 2>&1 | tail -300 || true

    - name: Summarize Failures
      if: always()
      shell: pwsh
      run: pwsh -NoProfile -File Tools/Scripts/summarize-test-failures.ps1 -Path TestResults

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: db-compat-${{ matrix.name }}
        path: TestResults/**
        if-no-files-found: ignore

    - name: Stop container
      if: always()
      run: docker stop db || true
