# العربية 词表（ar）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "لم يتم تعيين مفتاح العلاقة."
"No master field is set.": "لم يتم تعيين حقل رئيسي."
"Entity class [{0}] must implement [{1}].": "يجب أن تنفّذ فئة الكيان [{0}] الواجهة [{1}]."
"No model file was found.": "لم يتم العثور على ملف النموذج."
"The specified model file does not exist.": "ملف النموذج المحدد غير موجود."
"[{0}] no connection string is specified!": "[{0}] لم يتم تحديد سلسلة اتصال!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "تعذّر تحميل برنامج التشغيل [{0}]؛ أضف حزمة برنامج تشغيل قاعدة البيانات من NuGet."
"Detected secondary cache version change {0} => {1}; expiring local cache": "تم اكتشاف تغيير في إصدار ذاكرة التخزين المؤقت الثانوية {0} => {1}؛ سيتم انتهاء صلاحية ذاكرة التخزين المؤقت المحلية"
"Updating (#{0}), reason: {1}": "جارٍ التحديث (#{0})، السبب: {1}"
"Completed [{0}] (#{1})": "اكتمل [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "تم مسح ذاكرة التخزين المؤقت قسرًا؛ سيمنع الوصول التالي وينتظر تحديثًا متزامنًا"
"Cache cleared without force; the next access updates asynchronously without blocking": "تم مسح ذاكرة التخزين المؤقت دون قسر؛ سيتم التحديث عند الوصول التالي بشكل غير متزامن دون حظر"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "ذاكرة التخزين المؤقت للكائنات <{0}> ممتلئة، {1:n0}>{2:n0}، تمت إزالة [{3:n0}]"
"Clearing single-object cache, reason: {0}, Using = false": "جارٍ مسح ذاكرة التخزين المؤقت للكائن المفرد، السبب: {0}، Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: زيادة إصدار ذاكرة التخزين المؤقت لـ [{0}]، {1} => {2}، السبب={3}"
"No string primary key is defined for [{0}].": "لم يتم تعريف مفتاح أساسي من نوع السلسلة لـ [{0}]."
"Table [{0}] has no unique primary key and cannot be used for caching.": "لا يحتوي الجدول [{0}] على مفتاح أساسي فريد ولا يمكن استخدامه للتخزين المؤقت."
