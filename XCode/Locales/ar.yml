"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "يتطلب الحذف المجمّع المحدود في SonnetDB حاليًا مفتاحًا أساسيًا بعمود واحد؛ لا يمكن للجداول ذات المفتاح الأساسي المركب أو بدون مفتاح أساسي الرجوع إلى الحذف غير المحدود. راجع SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "لا يوفر SonnetDB بعد الدلالات الكاملة لمستوى عزل المعاملة هذا؛ استخدم ReadCommitted. راجع SonnetDB issue #225."
