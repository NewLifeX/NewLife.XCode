"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "سيؤدي SonnetDB 4.0.0 DECIMAL ADD/ALTER إلى فقدان الدقة الصريحة وتم رفضه للحفاظ على دلالات النموذج. راجع SonnetDB issue #241؛ لا يزال بحاجة إلى الإصلاح والإصدار."
