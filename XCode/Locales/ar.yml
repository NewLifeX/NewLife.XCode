# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "إعدادات XCode"
"Debug": "التصحيح"
"Output SQL. Whether to output SQL statements, enabled by default": "إخراج SQL. هل يتم إخراج عبارات SQL، ممكّن افتراضيًا"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "دليل SQL. دليل منفصل لإخراج SQL؛ فارغ افتراضيًا لذا يُكتب SQL في السجل الحالي. في بيئة الإنتاج، استخدم دليل SqlLog مخصصًا خارج الموقع"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "وقت تنفيذ SQL. يتم تسجيل SQL الأبطأ من هذا الحد بالمللي ثانية، الافتراضي 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "الحد الأقصى لطول SQL. يتم اقتطاع SQL الأطول في السجلات، الافتراضي 4096؛ استخدم 0 لتعطيل الاقتطاع"
"Parameterized CRUD. Disabled by default": "CRUD ذو معاملات. معطّل افتراضيًا"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "حجم الدفعة. عدد الصفوف لكل دفعة للاستخراج والحذف والنسخ الاحتياطي والاستعادة، الافتراضي 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "الفاصل بين الدفعات. توقف بين الدفعات بالمللي ثانية، الافتراضي 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "مهلة الأمر. مهلة الاستعلام بالثواني، الافتراضي 0 (غير محدودة)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "إعادة المحاولة عند الفشل. عدد المحاولات بعد انتهاء مهلة الأمر، الافتراضي 0 (بدون إعادة محاولة)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "الترحيل. Off: معطّل؛ ReadOnly: فحص فقط؛ On: إنشاء فقط؛ Full: تعديل وحذف أيضًا"
"Check comments. Table and column comments for migrations, enabled by default": "فحص التعليقات. تعليقات الجداول والأعمدة للترحيلات، ممكّن افتراضيًا"
"Check for dropped indexes. Migration check, enabled by default": "فحص الفهارس المحذوفة. فحص الترحيل، ممكّن افتراضيًا"
"Check for new indexes. Migration check, enabled by default": "فحص الفهارس الجديدة. فحص الترحيل، ممكّن افتراضيًا"
"Check for duplicate indexes. Enabled by default": "فحص الفهارس المكررة. ممكّن افتراضيًا"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "حالة أحرف أسماء الجداول والأعمدة. Default: قاعدة البيانات تقرر؛ None: الاحتفاظ بحالة النموذج؛ Upper: أحرف كبيرة؛ Lower: أحرف صغيرة؛ Underline: شرطة سفلية"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "حد العد الكامل. يتم تقدير عدد الصفوف أولًا من إحصاءات الفهارس؛ تُستخدم التقديرات الأعلى من هذه القيمة كما هي، وإلا يُنفَّذ count(*) للحصول على قيمة دقيقة. اخفضه لتجنب بطء الزيارة الأولى للجداول الكبيرة، وارفعه للعد الدقيق. الافتراضي 10 ملايين"
"Cache": "ذاكرة التخزين المؤقت"
"Data cache. Caches by SQL, default 0 seconds": "ذاكرة تخزين البيانات المؤقتة. تخزّن حسب SQL، الافتراضي 0 ثانية"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "انتهاء ذاكرة تخزين الكيانات. تخزّن قائمة الكيانات كاملة، الافتراضي 10 ثوانٍ"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "انتهاء ذاكرة تخزين الكائن الواحد. تخزّن الكيانات حسب المفتاح الأساسي، الافتراضي 10 ثوانٍ"
"Extended property expiration. Caches the Extends property, default 10 seconds": "انتهاء الخصائص الموسعة. تخزّن الخاصية Extends، الافتراضي 10 ثوانٍ"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "انتهاء ذاكرة تخزين الحقول. تخزّن القيم المجمّعة لحقول الفئات، الافتراضي 3600 ثانية"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "فترة إحصاءات ذاكرة التخزين المؤقت. الفاصل بالثواني لتسجيل إحصاءات ذاكرة التخزين المؤقت، 0 يعطّل، الافتراضي 3600"

