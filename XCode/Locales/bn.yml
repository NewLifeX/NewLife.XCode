"Upsert encountered an identity field with mixed zero and non-zero values and cannot support both Insert and Update.": "Upsert শূন্য ও অশূন্য মান মিশ্রিত একটি পরিচয় ফিল্ড পেয়েছে এবং একই সাথে Insert ও Update সমর্থন করতে পারে না।"
