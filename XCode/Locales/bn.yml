# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "XCode সেটিংস"
"Debug": "ডিবাগিং"
"Output SQL. Whether to output SQL statements, enabled by default": "SQL আউটপুট। SQL বিবৃতি আউটপুট হবে কি না, ডিফল্টভাবে সক্ষম"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL ডিরেক্টরি। SQL আউটপুটের জন্য আলাদা ডিরেক্টরি; ডিফল্টভাবে খালি, তাই SQL বর্তমান লগে যায়। প্রোডাকশনে সাইটের বাইরে পৃথক SqlLog ডিরেক্টরি ব্যবহার করুন"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL সম্পাদন সময়। এই সীমার (মিলিসেকেন্ড) চেয়ে ধীর SQL লগ করা হয়, ডিফল্ট 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "সর্বোচ্চ SQL দৈর্ঘ্য। এর চেয়ে দীর্ঘ SQL লগে কাটা হয়, ডিফল্ট 4096; কাটা বন্ধ করতে 0 ব্যবহার করুন"
"Parameterized CRUD. Disabled by default": "প্যারামিটারযুক্ত CRUD। ডিফল্টভাবে নিষ্ক্রিয়"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "ব্যাচ আকার। এক্সট্র্যাক্ট, মুছে ফেলা, ব্যাকআপ ও পুনরুদ্ধারের জন্য প্রতি ব্যাচে সারি, ডিফল্ট 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "ব্যাচ বিরতি। ব্যাচগুলির মধ্যে মিলিসেকেন্ডে বিরতি, ডিফল্ট 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "কমান্ড টাইমআউট। সেকেন্ডে ক্যোয়ারি টাইমআউট, ডিফল্ট 0 (সীমাহীন)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "ব্যর্থতায় পুনরায় চেষ্টা। কমান্ড টাইমআউটের পরে পুনরায় চেষ্টা, ডিফল্ট 0 (কোনো পুনরায় চেষ্টা নয়)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "মাইগ্রেশন। Off: নিষ্ক্রিয়; ReadOnly: শুধু যাচাই; On: শুধু তৈরি; Full: পরিবর্তন ও মুছে ফেলাও"
"Check comments. Table and column comments for migrations, enabled by default": "মন্তব্য যাচাই করুন। মাইগ্রেশনের জন্য টেবিল ও কলাম মন্তব্য, ডিফল্টভাবে সক্ষম"
"Check for dropped indexes. Migration check, enabled by default": "মুছে ফেলা ইনডেক্স যাচাই করুন। মাইগ্রেশন যাচাই, ডিফল্টভাবে সক্ষম"
"Check for new indexes. Migration check, enabled by default": "নতুন ইনডেক্স যাচাই করুন। মাইগ্রেশন যাচাই, ডিফল্টভাবে সক্ষম"
"Check for duplicate indexes. Enabled by default": "ডুপ্লিকেট ইনডেক্স যাচাই করুন। ডিফল্টভাবে সক্ষম"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "টেবিল ও কলাম নামের হাতের অক্ষর। Default: ডেটাবেস সিদ্ধান্ত নেয়; None: মডেলের হাতের অক্ষর রাখুন; Upper: বড় হাতের; Lower: ছোট হাতের; Underline: আন্ডারস্কোর"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "সম্পূর্ণ গণনার সীমা। সারি সংখ্যা প্রথমে ইনডেক্স পরিসংখ্যান থেকে অনুমান করা হয়; এই মানের উপরের অনুমান যেমন আছে তেমন ব্যবহার হয়, অন্যথায় count(*) সঠিক মান দেয়। বড় টেবিলে ধীর প্রথম অ্যাক্সেস এড়াতে এটি কমান, সঠিক গণনার জন্য বাড়ান। ডিফল্ট ১ কোটি"
"Cache": "ক্যাশ"
"Data cache. Caches by SQL, default 0 seconds": "ডেটা ক্যাশ। SQL অনুযায়ী ক্যাশ করে, ডিফল্ট 0 সেকেন্ড"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "সত্তা ক্যাশের মেয়াদ। সম্পূর্ণ সত্তা তালিকা ক্যাশ করে, ডিফল্ট 10 সেকেন্ড"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "একক অবজেক্ট ক্যাশের মেয়াদ। সত্তাগুলো প্রাথমিক কী অনুযায়ী ক্যাশ করে, ডিফল্ট 10 সেকেন্ড"
"Extended property expiration. Caches the Extends property, default 10 seconds": "বর্ধিত বৈশিষ্ট্যের মেয়াদ। Extends বৈশিষ্ট্য ক্যাশ করে, ডিফল্ট 10 সেকেন্ড"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "ফিল্ড ক্যাশের মেয়াদ। বিভাগ ফিল্ডের গোষ্ঠীবদ্ধ মান ক্যাশ করে, ডিফল্ট 3600 সেকেন্ড"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "ক্যাশ পরিসংখ্যানের সময়কাল। ক্যাশ পরিসংখ্যান লগ করার সেকেন্ডে ব্যবধান, 0 নিষ্ক্রিয় করে, ডিফল্ট 3600"

