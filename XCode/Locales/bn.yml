"The database does not support array types.": "ডেটাবেস অ্যারে প্রকার সমর্থন করে না।"
"The TopNotIn paging algorithm requires a single primary key column! {0}": "TopNotIn পেজিং অ্যালগরিদমের জন্য একটি প্রাথমিক কী কলাম প্রয়োজন! {0}"
