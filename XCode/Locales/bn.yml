"Field [{0}] in expression [{1}] was not recognized; entity class [{2}] does not contain this field.": "অভিব্যক্তি [{1}]-এর ফিল্ড [{0}] চেনা যায়নি; এন্টিটি ক্লাস [{2}]-এ এই ফিল্ড নেই।"
