"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 এই Decimal মানটি সঠিকভাবে সংরক্ষণ করতে পারে না এবং লেখা প্রত্যাখ্যান করেছে। SonnetDB issue #235 দেখুন; সঠিক decimal প্যারামিটার সমর্থন এখনও বাস্তবায়ন ও প্রকাশ করতে হবে।"
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT স্বাক্ষরিত Int64 ব্যবহার করে এবং শুধুমাত্র Int64.MaxValue পর্যন্ত UInt64 মান সমর্থন করে।"
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME শুধুমাত্র মিলিসেকেন্ড নির্ভুলতা সংরক্ষণ করতে পারে এবং এক মিলিসেকেন্ডের কম সময় প্রত্যাখ্যান করেছে। SonnetDB issue #236 দেখুন; সম্পূর্ণ সময় নির্ভুলতা সমর্থন এখনও বাস্তবায়ন ও প্রকাশ করতে হবে।"
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "SonnetDB-এ সীমিত বাল্ক মুছে ফেলার জন্য বর্তমানে একক-কলাম প্রাথমিক কী প্রয়োজন; যৌগিক প্রাথমিক কী বা প্রাথমিক কী ছাড়া টেবিল সীমাহীন মুছে ফেলায় ফিরে যেতে পারে না। SonnetDB issue #243 দেখুন।"
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB এখনও এই লেনদেন বিচ্ছিন্নতা স্তরের সম্পূর্ণ অর্থ প্রদান করে না; ReadCommitted ব্যবহার করুন। SonnetDB issue #225 দেখুন।"
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "SonnetDB ফলাফল পরিচয় কলাম সনাক্ত করে না, তাই তৈরি করা নম্বর নিরাপদে পাওয়া যায় না। RETURNING কলাম মেটাডেটা সহ SonnetDB সংস্করণে আপগ্রেড করুন।"
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB এখনও Replace অর্থ সমর্থন করে না যেখানে বিরোধপূর্ণ সারি মুছে নতুন সারি সন্নিবেশ করা হয়। SonnetDB issue #242 দেখুন।"
"Bulk write must contain at least one field.": "বাল্ক লেখায় অন্তত একটি ফিল্ড থাকতে হবে।"
"SonnetDB Upsert requires a primary key or a complete unique-index conflict target.": "SonnetDB Upsert-এর জন্য প্রাথমিক কী বা সম্পূর্ণ অনন্য-সূচক দ্বন্দ্ব লক্ষ্য প্রয়োজন।"
