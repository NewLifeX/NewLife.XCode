"SonnetDB view [{0}] field [{1}] did not provide a mappable declared type. See SonnetDB issue #261; view declaration metadata still needs to be completed and released.": "SonnetDB ভিউ [{0}]-এর ফিল্ড [{1}] ম্যাপযোগ্য ঘোষিত প্রকার প্রদান করেনি। SonnetDB issue #261 দেখুন; ভিউ ঘোষণা মেটাডেটা এখনও সম্পূর্ণ ও প্রকাশ করতে হবে।"
"SonnetDB does not support field type {0}.": "SonnetDB ফিল্ড প্রকার {0} সমর্থন করে না।"
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING এখনও দৈর্ঘ্য সীমাবদ্ধতা পরিবর্তন সমর্থন করে না। SonnetDB issue #240 দেখুন; ক্ষমতাটি এখনও বাস্তবায়ন ও প্রকাশ করতে হবে।"
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "বিদ্যমান SonnetDB কলামে পরিচয় বা প্রাথমিক কী পরিবর্তনের জন্য আলাদা মাইগ্রেশন প্রয়োজন এবং ALTER COLUMN-এর মাধ্যমে করা যায় না।"
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER স্পষ্ট নির্ভুলতা হারাবে এবং মডেলের অর্থ সংরক্ষণের জন্য প্রত্যাখ্যান করা হয়েছে। SonnetDB issue #241 দেখুন; এটি এখনও সংশোধন ও প্রকাশ করতে হবে।"
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "এমবেডেড SonnetDB Data Source ডিরেক্টরির মাধ্যমে ডেটাবেস তৈরি করে; লক্ষ্য ডিরেক্টরির জন্য আলাদা সংযোগ কনফিগার করুন।"
"Embedded SonnetDB does not support deleting the database directory via SQL.": "এমবেডেড SonnetDB SQL-এর মাধ্যমে ডেটাবেস ডিরেক্টরি মুছে ফেলা সমর্থন করে না।"
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB এখনও টেবিল ও কলাম মন্তব্য স্থায়ীভাবে সংরক্ষণ সমর্থন করে না। SonnetDB issue #237 দেখুন; ক্ষমতাটি বাস্তবায়ন ও প্রকাশ করতে হবে।"
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] ফিল্ড {0}.{1} দৈর্ঘ্য {2} ঘোষণা করে, কিন্তু STRING বর্তমানে দৈর্ঘ্য সীমাবদ্ধতা সমর্থন করে না; মুলতুবি, SonnetDB issue #240 দেখুন।"
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] অসম্পূর্ণ {0}: টেবিল ও কলাম মন্তব্য স্থায়ী সংরক্ষণ এখনও সমর্থিত নয়; SonnetDB-কে এটি বাস্তবায়ন ও প্রকাশ করতে হবে, issue #237 দেখুন।"
"The current SQLite driver does not support BackupDatabase: {0}": "বর্তমান SQLite ড্রাইভার BackupDatabase সমর্থন করে না: {0}"
"The paging algorithm requires a sort column! {0}": "পেজিং অ্যালগরিদমের জন্য একটি সাজানোর কলাম প্রয়োজন! {0}"
"[{0}]VastBase Search Path(Schema): {1}": "[{0}]VastBase অনুসন্ধান পথ (Schema): {1}"
