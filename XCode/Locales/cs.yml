# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Nastavení XCode"
"Debug": "Ladění"
"Output SQL. Whether to output SQL statements, enabled by default": "Výstup SQL. Zda vypisovat příkazy SQL, ve výchozím nastavení zapnuto"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Adresář SQL. Samostatný adresář pro výstup SQL; ve výchozím nastavení prázdný, takže SQL jde do aktuálního protokolu. V produkci použijte vyhrazený adresář SqlLog mimo web"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Doba provádění SQL. SQL pomalejší než tento limit v milisekundách se zaznamenává, výchozí 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Maximální délka SQL. Delší SQL se v protokolech zkracuje, výchozí 4096; hodnota 0 zkracování vypne"
"Parameterized CRUD. Disabled by default": "Parametrizované CRUD. Ve výchozím nastavení vypnuto"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Velikost dávky. Řádky na dávku pro extrakci, mazání, zálohování a obnovu, výchozí 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Interval dávek. Pauza mezi dávkami v milisekundách, výchozí 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Časový limit příkazu. Časový limit dotazu v sekundách, výchozí 0 (neomezeno)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Opakovat při chybě. Počet opakování po časovém limitu, výchozí 0 (bez opakování)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migrace. Off: vypnuto; ReadOnly: pouze kontrola; On: pouze vytváření; Full: také úpravy a mazání"
"Check comments. Table and column comments for migrations, enabled by default": "Kontrolovat komentáře. Komentáře tabulek a sloupců pro migrace, ve výchozím nastavení zapnuto"
"Check for dropped indexes. Migration check, enabled by default": "Kontrolovat odstraněné indexy. Kontrola migrace, ve výchozím nastavení zapnuto"
"Check for new indexes. Migration check, enabled by default": "Kontrolovat nové indexy. Kontrola migrace, ve výchozím nastavení zapnuto"
"Check for duplicate indexes. Enabled by default": "Kontrolovat duplicitní indexy. Ve výchozím nastavení zapnuto"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Velikost písmen názvů tabulek a sloupců. Default: rozhoduje databáze; None: zachovat zápis modelu; Upper: velká písmena; Lower: malá písmena; Underline: podtržítko"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Práh úplného počítání. Počty řádků se nejprve odhadují ze statistik indexů; odhady nad touto hodnotou se použijí tak, jak jsou, jinak count(*) vrátí přesnou hodnotu. Snižte ji, abyste zabránili pomalým prvním návštěvám velkých tabulek, zvyšte ji pro přesné počty. Výchozí 10 milionů"
"Cache": "Mezipaměť"
"Data cache. Caches by SQL, default 0 seconds": "Mezipaměť dat. Ukládá do mezipaměti podle SQL, výchozí 0 sekund"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Vypršení mezipaměti entit. Ukládá do mezipaměti celý seznam entit, výchozí 10 sekund"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Vypršení mezipaměti jednoho objektu. Ukládá entity do mezipaměti podle primárního klíče, výchozí 10 sekund"
