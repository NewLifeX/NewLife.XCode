# 程序集标题与描述（英文源文 → 捷克语）
"XCode Super ORM Middleware": "Middleware ORM XCode"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "Vysoce výkonné datové middleware pro .NET (super ORM) zaměřené na CRUD a masivní data, s víceúrovňovou mezipamětí, automatickou migrací, shardováním, silně typovanými dotazy a migrací mezi databázemi."
"XCode Entity Generator": "Generátor entit XCode"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "Oficiální nástroj příkazového řádku XCode, který z Model.xml generuje datové třídy entit a obchodní třídy a podporuje rychlé modelování i průběžné iterace."

