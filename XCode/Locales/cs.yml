"SonnetDB does not support field type {0}.": "SonnetDB nepodporuje typ pole {0}."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING zatím nepodporuje změnu omezení délky. Viz SonnetDB issue #240; funkce stále musí být implementována a vydána."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "Změna identity nebo primárního klíče stávajících sloupců SonnetDB vyžaduje samostatnou migraci a nelze ji provést přes ALTER COLUMN."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER by ztratil explicitní přesnost a byl odmítnut, aby se zachovala sémantika modelu. Viz SonnetDB issue #241; stále musí být opraven a vydán."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "Vestavěný SonnetDB vytváří databáze prostřednictvím adresáře Data Source; nakonfigurujte samostatné připojení pro cílový adresář."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "Vestavěný SonnetDB nepodporuje mazání adresáře databáze přes SQL."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB zatím nepodporuje trvalé ukládání komentářů tabulek a sloupců. Viz SonnetDB issue #237; funkce musí být implementována a vydána."
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] Pole {0}.{1} deklaruje délku {2}, ale STRING v současnosti nepodporuje omezení délky; čeká na vyřízení, viz SonnetDB issue #240."
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] Nedokončeno {0}: trvalé ukládání komentářů tabulek a sloupců zatím není podporováno; SonnetDB to musí implementovat a vydat, viz issue #237."
