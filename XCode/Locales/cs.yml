"SonnetDB LIMIT/OFFSET currently cannot exceed Int32.MaxValue. See SonnetDB issue #256.": "SonnetDB LIMIT/OFFSET v současnosti nemůže překročit Int32.MaxValue. Viz SonnetDB issue #256."
"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 nemůže tuto hodnotu Decimal přesně zachovat a zápis odmítl. Viz SonnetDB issue #235; podpora přesných parametrů decimal stále musí být implementována a vydána."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT používá znaménkový Int64 a podporuje pouze hodnoty UInt64 do Int64.MaxValue."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME může zachovat pouze přesnost na milisekundy a odmítl časy pod jednu milisekundu. Viz SonnetDB issue #236; plná podpora přesnosti času stále musí být implementována a vydána."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "Omezené hromadné mazání v SonnetDB v současnosti vyžaduje jednosloupcový primární klíč; tabulky se složeným primárním klíčem nebo bez primárního klíče nemohou přejít na neomezené mazání. Viz SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB zatím neposkytuje úplnou sémantiku této úrovně izolace transakcí; použijte ReadCommitted. Viz SonnetDB issue #225."
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "Výsledek SonnetDB neidentifikuje sloupce identity, takže vygenerované číslo nelze bezpečně získat. Upgradujte na verzi SonnetDB, která obsahuje metadata sloupců RETURNING."
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB zatím nepodporuje sémantiku Replace spočívající v odstranění konfliktních řádků a vložení nových. Viz SonnetDB issue #242."
"Bulk write must contain at least one field.": "Hromadný zápis musí obsahovat alespoň jedno pole."
