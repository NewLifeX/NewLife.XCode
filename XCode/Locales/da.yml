# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "XCode-indstillinger"
"Debug": "Fejlfinding"
"Output SQL. Whether to output SQL statements, enabled by default": "SQL-output. Om SQL-sætninger udskrives, aktiveret som standard"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL-mappe. Separat mappe til SQL-output; tom som standard, så SQL går til den aktuelle log. Brug i produktion en dedikeret SqlLog-mappe uden for webstedet"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL-køretid. SQL, der er langsommere end denne grænse i millisekunder, logges, standard 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Maksimal SQL-længde. Længere SQL afkortes i logge, standard 4096; brug 0 for at deaktivere afkortning"
"Parameterized CRUD. Disabled by default": "Parametriseret CRUD. Deaktiveret som standard"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Batchstørrelse. Rækker pr. batch til udtræk, sletning, sikkerhedskopiering og gendannelse, standard 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Batchinterval. Pause mellem batches i millisekunder, standard 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Kommandotimeout. Forespørgselstimeout i sekunder, standard 0 (ubegrænset)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Forsøg igen ved fejl. Nye forsøg efter et kommandotimeout, standard 0 (ingen gentagelse)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migrering. Off: deaktiveret; ReadOnly: kun kontrol; On: kun opret; Full: også ændr og slet"
"Check comments. Table and column comments for migrations, enabled by default": "Kontroller kommentarer. Tabel- og kolonnekommentarer til migreringer, aktiveret som standard"
"Check for dropped indexes. Migration check, enabled by default": "Kontroller slettede indeks. Migreringskontrol, aktiveret som standard"
"Check for new indexes. Migration check, enabled by default": "Kontroller nye indeks. Migreringskontrol, aktiveret som standard"
"Check for duplicate indexes. Enabled by default": "Kontroller dublerede indeks. Aktiveret som standard"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Store/små bogstaver i tabel- og kolonnenavne. Default: databasen bestemmer; None: behold modellens skrivemåde; Upper: store bogstaver; Lower: små bogstaver; Underline: understreg"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Tærskel for fuld optælling. Rækkeantal estimeres først via indeksstatistik; estimater over denne værdi bruges som de er, ellers kører count(*) for en nøjagtig værdi. Sænk den for at undgå langsomme første besøg på store tabeller, hæv den for nøjagtige optællinger. Standard 10 millioner"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Datacache. Cacher efter SQL, standard 0 sekunder"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Udløb af entitetscache. Cacher hele entitetslisten, standard 10 sekunder"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Udløb af enkeltobjektcache. Cacher entiteter efter primærnøgle, standard 10 sekunder"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Udløb af udvidede egenskaber. Cacher egenskaben Extends, standard 10 sekunder"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Udløb af feltcache. Cacher grupperede værdier af kategorifelter, standard 3600 sekunder"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Periode for cachestatistik. Interval i sekunder for logning af cachestatistik, 0 deaktiverer, standard 3600"

