# Deutsch 词表（de）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "Es ist kein Beziehungsschlüssel festgelegt."
"No master field is set.": "Es ist kein Hauptfeld festgelegt."
"Entity class [{0}] must implement [{1}].": "Die Entitätsklasse [{0}] muss [{1}] implementieren."
"No model file was found.": "Es wurde keine Modelldatei gefunden."
"The specified model file does not exist.": "Die angegebene Modelldatei existiert nicht."
"[{0}] no connection string is specified!": "[{0}] Es ist keine Verbindungszeichenfolge angegeben!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "Treiber [{0}] konnte nicht geladen werden; fügen Sie das Datenbanktreiber-Paket aus NuGet hinzu."
"Detected secondary cache version change {0} => {1}; expiring local cache": "Änderung der Sekundärcache-Version erkannt: {0} => {1}; lokaler Cache wird ungültig"
"Updating (#{0}), reason: {1}": "Aktualisierung (#{0}), Grund: {1}"
"Completed [{0}] (#{1})": "Abgeschlossen [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "Cache wurde erzwungen geleert; der nächste Zugriff blockiert und wartet auf eine synchrone Aktualisierung"
"Cache cleared without force; the next access updates asynchronously without blocking": "Cache wurde ohne Zwang geleert; der nächste Zugriff aktualisiert asynchron, ohne zu blockieren"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "Objekte-Cache <{0}> ist voll, {1:n0}>{2:n0}, [{3:n0}] entfernt"
"Clearing single-object cache, reason: {0}, Using = false": "Einzelobjekt-Cache wird geleert, Grund: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: Cache-Version von [{0}] wird erhöht, {1} => {2}, Grund={3}"
"No string primary key is defined for [{0}].": "Für [{0}] ist kein Zeichenfolgen-Primärschlüssel definiert."
"Table [{0}] has no unique primary key and cannot be used for caching.": "Tabelle [{0}] hat keinen eindeutigen Primärschlüssel und kann nicht für das Caching verwendet werden."
"Entity queue [{0}/{1}] saving {2:n0}, estimated {3:n0}ms": "Entitätswarteschlange [{0}/{1}] speichert {2:n0}, geschätzt {3:n0}ms"
