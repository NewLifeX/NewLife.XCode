"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB bietet noch nicht die vollständige Semantik dieser Transaktionsisolationsstufe; verwenden Sie ReadCommitted. Siehe SonnetDB issue #225."
