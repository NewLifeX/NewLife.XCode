"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER würde die explizite Genauigkeit verlieren und wurde abgelehnt, um die Modelsemantik zu erhalten. Siehe SonnetDB issue #241; es muss noch behoben und veröffentlicht werden."
