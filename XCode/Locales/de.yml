"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME kann nur Millisekundengenauigkeit speichern und hat Zeiten unter einer Millisekunde abgelehnt. Siehe SonnetDB issue #236; die vollständige Zeitpräzision muss noch implementiert und veröffentlicht werden."
