# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Ρυθμίσεις XCode"
"Debug": "Εντοπισμός σφαλμάτων"
"Output SQL. Whether to output SQL statements, enabled by default": "Έξοδος SQL. Αν θα εκτελούνται οι εντολές SQL, ενεργό από προεπιλογή"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Κατάλογος SQL. Ξεχωριστός κατάλογος για την έξοδο SQL· κενός από προεπιλογή, ώστε το SQL να γράφεται στο τρέχον αρχείο καταγραφής. Στην παραγωγή, χρησιμοποιήστε ξεχωριστό κατάλογο SqlLog εκτός του ιστότοπου"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Χρόνος εκτέλεσης SQL. SQL πιο αργό από αυτό το όριο σε χιλιοστά του δευτερολέπτου καταγράφεται, προεπιλογή 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Μέγιστο μήκος SQL. Το μεγαλύτερο SQL περικόπτεται στα αρχεία καταγραφής, προεπιλογή 4096· χρησιμοποιήστε 0 για απενεργοποίηση της περικοπής"
"Parameterized CRUD. Disabled by default": "Παραμετροποιημένο CRUD. Απενεργοποιημένο από προεπιλογή"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Μέγεθος παρτίδας. Γραμμές ανά παρτίδα για εξαγωγή, διαγραφή, αντίγραφο ασφαλείας και επαναφορά, προεπιλογή 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Διάστημα παρτίδας. Παύση μεταξύ παρτίδων σε χιλιοστά του δευτερολέπτου, προεπιλογή 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Χρονικό όριο εντολής. Χρονικό όριο ερωτήματος σε δευτερόλεπτα, προεπιλογή 0 (χωρίς όριο)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Επανάληψη σε αποτυχία. Επαναλήψεις μετά από χρονικό όριο εντολής, προεπιλογή 0 (χωρίς επανάληψη)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Μετεγκατάσταση. Off: απενεργοποιημένη· ReadOnly: μόνο έλεγχος· On: μόνο δημιουργία· Full: και τροποποίηση και διαγραφή"
"Check comments. Table and column comments for migrations, enabled by default": "Έλεγχος σχολίων. Σχόλια πινάκων και στηλών για μετεγκαταστάσεις, ενεργό από προεπιλογή"
"Check for dropped indexes. Migration check, enabled by default": "Έλεγχος διαγραμμένων ευρετηρίων. Έλεγχος μετεγκατάστασης, ενεργός από προεπιλογή"
"Check for new indexes. Migration check, enabled by default": "Έλεγχος νέων ευρετηρίων. Έλεγχος μετεγκατάστασης, ενεργός από προεπιλογή"
"Check for duplicate indexes. Enabled by default": "Έλεγχος διπλότυπων ευρετηρίων. Ενεργό από προεπιλογή"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Πεζά/κεφαλαία ονομάτων πινάκων και στηλών. Default: αποφασίζει η βάση δεδομένων· None: διατήρηση γραφής μοντέλου· Upper: κεφαλαία· Lower: πεζά· Underline: υπογράμμιση"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Όριο πλήρους μέτρησης. Οι αριθμοί γραμμών εκτιμώνται πρώτα από στατιστικά ευρετηρίων· εκτιμήσεις πάνω από αυτή την τιμή χρησιμοποιούνται ως έχουν, διαφορετικά το count(*) δίνει ακριβή τιμή. Μειώστε το για να αποφύγετε αργές πρώτες επισκέψεις σε μεγάλους πίνακες, αυξήστε το για ακριβείς μετρήσεις. Προεπιλογή 10 εκατομμύρια"
"Cache": "Προσωρινή μνήμη"
"Data cache. Caches by SQL, default 0 seconds": "Προσωρινή μνήμη δεδομένων. Αποθηκεύει κατά SQL, προεπιλογή 0 δευτερόλεπτα"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Λήξη προσωρινής μνήμης οντοτήτων. Αποθηκεύει ολόκληρη τη λίστα οντοτήτων, προεπιλογή 10 δευτερόλεπτα"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Λήξη προσωρινής μνήμης μεμονωμένου αντικειμένου. Αποθηκεύει οντότητες κατά πρωτεύον κλειδί, προεπιλογή 10 δευτερόλεπτα"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Λήξη εκτεταμένων ιδιοτήτων. Αποθηκεύει την ιδιότητα Extends, προεπιλογή 10 δευτερόλεπτα"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Λήξη προσωρινής μνήμης πεδίων. Αποθηκεύει ομαδοποιημένες τιμές πεδίων κατηγορίας, προεπιλογή 3600 δευτερόλεπτα"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Περίοδος στατιστικών προσωρινής μνήμης. Διάστημα σε δευτερόλεπτα για καταγραφή στατιστικών προσωρινής μνήμης, 0 απενεργοποιεί, προεπιλογή 3600"

