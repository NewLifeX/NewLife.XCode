"The TopNotIn paging algorithm requires a single primary key column! {0}": "Ο αλγόριθμος σελιδοποίησης TopNotIn απαιτεί μία στήλη πρωτεύοντος κλειδιού! {0}"
"The DoubleTop paging algorithm requires a sort column! {0}": "Ο αλγόριθμος σελιδοποίησης DoubleTop απαιτεί στήλη ταξινόμησης! {0}"
"Upsert encountered an identity field with mixed zero and non-zero values and cannot support both Insert and Update.": "Το Upsert συνάντησε πεδίο ταυτότητας με μικτές μηδενικές και μη μηδενικές τιμές και δεν μπορεί να υποστηρίξει ταυτόχρονα Insert και Update."
