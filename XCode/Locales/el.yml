"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "Το SonnetDB δεν παρέχει ακόμη την πλήρη σημασιολογία αυτού του επιπέδου απομόνωσης συναλλαγών; χρησιμοποιήστε ReadCommitted. Δείτε SonnetDB issue #225."
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "Το αποτέλεσμα SonnetDB δεν αναγνωρίζει στήλες ταυτότητας, επομένως ο παραγόμενος αριθμός δεν μπορεί να ληφθεί με ασφάλεια. Αναβαθμίστε σε έκδοση SonnetDB που περιλαμβάνει μεταδεδομένα στηλών RETURNING."
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "Το SonnetDB δεν υποστηρίζει ακόμη τη σημασιολογία Replace της διαγραφής διενεξιών και εισαγωγής νέων γραμμών. Δείτε SonnetDB issue #242."
"Bulk write must contain at least one field.": "Η μαζική εγγραφή πρέπει να περιέχει τουλάχιστον ένα πεδίο."
"SonnetDB Upsert requires a primary key or a complete unique-index conflict target.": "Το SonnetDB Upsert απαιτεί πρωτεύον κλειδί ή πλήρη στόχο σύγκρουσης μοναδικού ευρετηρίου."
"SonnetDB field type has not been mapped: {0}": "Ο τύπος πεδίου SonnetDB δεν έχει αντιστοιχιστεί: {0}"
"SonnetDB view [{0}] did not provide field metadata.": "Η προβολή SonnetDB [{0}] δεν παρείχε μεταδεδομένα πεδίων."
"SonnetDB view [{0}] field [{1}] did not provide a mappable declared type. See SonnetDB issue #261; view declaration metadata still needs to be completed and released.": "Το πεδίο [{1}] της προβολής SonnetDB [{0}] δεν παρείχε αντιστοιχίσιμο δηλωμένο τύπο. Δείτε SonnetDB issue #261; τα μεταδεδομένα δήλωσης προβολής πρέπει ακόμη να ολοκληρωθούν και να κυκλοφορήσουν."
"SonnetDB does not support field type {0}.": "Το SonnetDB δεν υποστηρίζει τον τύπο πεδίου {0}."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "Το SonnetDB STRING δεν υποστηρίζει ακόμη την αλλαγή περιορισμών μήκους. Δείτε SonnetDB issue #240; η δυνατότητα πρέπει ακόμη να υλοποιηθεί και να κυκλοφορήσει."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "Η αλλαγή ταυτότητας ή πρωτεύοντος κλειδιού σε υπάρχουσες στήλες SonnetDB απαιτεί ξεχωριστή μετανάστευση και δεν μπορεί να γίνει μέσω ALTER COLUMN."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "Το SonnetDB 4.0.0 DECIMAL ADD/ALTER θα έχανε ρητή ακρίβεια και απορρίφθηκε για να διατηρηθεί η σημασιολογία του μοντέλου. Δείτε SonnetDB issue #241; πρέπει ακόμη να διορθωθεί και να κυκλοφορήσει."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "Το ενσωματωμένο SonnetDB δημιουργεί βάσεις δεδομένων μέσω του καταλόγου Data Source; διαμορφώστε ξεχωριστή σύνδεση για τον κατάλογο προορισμού."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "Το ενσωματωμένο SonnetDB δεν υποστηρίζει τη διαγραφή του καταλόγου βάσης δεδομένων μέσω SQL."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "Το SonnetDB δεν υποστηρίζει ακόμη τη μόνιμη αποθήκευση σχολίων πίνακα και στηλών. Δείτε SonnetDB issue #237; η δυνατότητα πρέπει να υλοποιηθεί και να κυκλοφορήσει."
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] Το πεδίο {0}.{1} δηλώνει μήκος {2}, αλλά το STRING επί του παρόντος δεν υποστηρίζει περιορισμούς μήκους; εκκρεμεί, δείτε SonnetDB issue #240."
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] Ημιτελές {0}: η μόνιμη αποθήκευση σχολίων πίνακα και στηλών δεν υποστηρίζεται ακόμη; το SonnetDB πρέπει να το υλοποιήσει και να το κυκλοφορήσει, δείτε issue #237."
"The current SQLite driver does not support BackupDatabase: {0}": "Το τρέχον πρόγραμμα οδήγησης SQLite δεν υποστηρίζει BackupDatabase: {0}"
