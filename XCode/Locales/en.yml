# XCode 内置实体/字段的描述原文 → 英文
"必要。必要的菜单，必须至少有角色拥有这些权限，如果没有则自动授权给系统角色": "Necessary. A necessary menu must be granted to at least one role; if none, it is automatically granted to the system role"
"编码。唯一编码": "Code. Unique code"
"编码。行政区划编码": "Code. Administrative division code"
"部门。用户在该租户所属的部门": "Department. Department the user belongs to in this tenant"
"部门。组织机构": "Department. Organization"
"部门。组织机构，多级树状结构，支持多租户": "Department. Organization in a multi-level tree, supports multiple tenants"
"菜单。功能权限，大多数时候也是可见页面": "Menu. Function permission, usually also a visible page"
"层级。树状结构的层级": "Level. Level in the tree structure"
"存储上限。该租户最大允许存储字节数，0表示不限制": "Storage Limit. Maximum storage bytes allowed for the tenant, 0 means unlimited"
"代码。身份证、员工编码等，支持登录": "Code. ID card, employee number, etc., supports login"
"地区。省市区": "Area. Province, city and district"
"地区。行政区划数据，最高支持四级地址，9位数字": "Area. Administrative division data, up to four levels, 9 digits"
"地址编码。字符串前缀相同越多，地理距离越近，8位精度19米，6位610米": "Address Code. The more identical string prefix, the closer the geographic distance; 8 digits is accurate to 19 meters, 6 digits to 610 meters"
"等级。租户级别或套餐版本，数字越大功能越多": "Level. Tenant level or plan version, larger numbers have more features"
"过期时间。达到该时间后，自动禁用租户，空表示永不过期": "Expire Time. The tenant is automatically disabled after this time, empty means never expires"
"角色。业务场景中的岗位，功能权限的集合。不管是用户还是租户，都以角色来管理权限": "Role. Position in business scenarios, a set of function permissions. Both users and tenants manage permissions by role"
"角色。用户在该租户所对应的主要角色，替换用户自身的角色组": "Role. Main role of the user in this tenant, replaces the user's own role group"
"角色。主要角色": "Role. Main role"
"角色组。次要角色集合": "Role Group. Set of secondary roles"
"角色组。租户可选的角色集合，不同级别的租户所拥有的角色不一样，高级功能也会不同": "Role Group. Roles available to the tenant; tenants of different levels have different roles and advanced features"
"类型。1公司/2部门/3小组/4虚拟": "Type. 1 company/2 department/3 group/4 virtual"
"类型。1免费/2个人/3企业/4旗舰": "Type. 1 free/2 personal/3 enterprise/4 flagship"
"类型。1目录/2菜单/3功能": "Type. 1 directory/2 menu/3 function"
"类型。1系统/2普通/3租户": "Type. 1 system/2 normal/3 tenant"
"类型。省市县，自治州等": "Type. Province, city, county, autonomous prefecture, etc."
"敏感字段。是否可以查看其他人的敏感字段数据": "Sensitive Field. Whether the sensitive fields of other users can be viewed"
"名称。登录用户名": "Name. Login username"
"名称。显示名称": "Name. Display name"
"年龄。周岁": "Age. Full years"
"排序。同级内排序": "Sort. Sort order among siblings"
"区号。电话区号": "Area Code. Telephone area code"
"权限。对不同资源的权限，逗号分隔，每个资源编号与权限值用井号分隔，如 1#3,2#7": "Permission. Permissions on different resources, comma separated; resource id and permission value separated by #, e.g. 1#3,2#7"
"权限子项。逗号分隔，每个权限子项编号与名称用井号分隔": "Permission Items. Comma separated; each item id and name separated by #"
"日志。应用系统审计日志，记录用户的各种操作，禁止修改和删除": "Log. Application audit log, records user operations, modification and deletion are forbidden"
"生日。公历年月日": "Birthday. Gregorian date"
"手机。支持登录": "Mobile. Supports login"
"手机验证。手机是否已通过验证": "Mobile Verified. Whether the mobile has been verified"
"数据表。分表用的数据表前缀": "Table. Table prefix used for sharding"
"数据部门。数据范围为自定义时，选择的部门编号列表": "Data Department. Department ids selected when the data scope is custom"
"数据范围。该菜单的数据权限，-1使用角色默认/0全部/1本部门及下级/2本部门/3仅本人/4自定义": "Data Scope. Data permission of the menu, -1 role default/0 all/1 department and children/2 department/3 self/4 custom"
"数据范围。控制用户可访问的数据范围，0全部/1本部门及下级/2本部门/3仅本人/4自定义": "Data Scope. Controls the data range the user can access, 0 all/1 department and children/2 department/3 self/4 custom"
"数据库。分库用的数据库名": "Database. Database name used for sharding"
"图标。附件路径": "Icon. Attachment path"
"系统。用于业务系统开发使用，不受数据权限约束，禁止修改名称或删除": "System. Used for business system development, not restricted by data permission, modifying the name or deleting is forbidden"
"新窗口。新窗口打开链接": "New Window. Open the link in a new window"
"性别。未知、男、女": "Gender. Unknown, male, female"
"性能追踪。用于APM性能追踪定位，还原该事件的调用链": "Performance Trace. Used for APM tracing to restore the call chain of the event"
"用户。按用户区分参数，用户0表示系统级": "User. Parameters are distinguished by user, user 0 means system level"
"用户。用户帐号信息，以身份验证为中心，拥有多种角色，可加入多个租户": "User. User account information, centered on authentication, has multiple roles and can join multiple tenants"
"用户数上限。该租户最大允许用户数，0表示不限制": "User Limit. Maximum number of users allowed for the tenant, 0 means unlimited"
"邮编。邮政编码": "Zip Code. Postal code"
"邮件。支持登录": "Mail. Supports login"
"邮箱验证。邮箱是否已通过验证": "Mail Verified. Whether the mail has been verified"
"域名。绑定的独立域名": "Domain. Bound independent domain"
"在线时间。累计在线总时间，单位秒": "Online Time. Total online time in seconds"
"种类。0普通，21列表，22名值": "Kind. 0 normal, 21 list, 22 name-value"
"字典参数。管理用户或系统全局的名值对数据，常用于参数配置场合": "Parameter. Manages user or system-wide name-value data, often used for configuration"
"租户。多租户SAAS平台，用于隔离业务数据": "Tenant. Multi-tenant SaaS platform used to isolate business data"
"租户。角色所属组合，0表示全局角色": "Tenant. Group the role belongs to, 0 means global role"
"租户关系。用户选择租户进入系统后，以租户关系角色组替代自有角色组来进行鉴权": "Tenant Relation. After the user enters the system with a tenant, the tenant role group replaces the user's own role group for authorization"

