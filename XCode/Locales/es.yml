"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 no puede conservar exactamente este valor Decimal y rechazó la escritura. Consulte SonnetDB issue #235; aún debe implementarse y publicarse la compatibilidad con parámetros decimales precisos."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT usa Int64 con signo y solo admite valores UInt64 hasta Int64.MaxValue."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME solo puede conservar precisión de milisegundos y rechazó tiempos inferiores a un milisegundo. Consulte SonnetDB issue #236; aún debe implementarse y publicarse la compatibilidad completa con la precisión temporal."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "La eliminación masiva acotada en SonnetDB actualmente requiere una clave principal de una sola columna; las tablas con clave principal compuesta o sin clave principal no pueden recurrir a la eliminación no acotada. Consulte SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB aún no ofrece la semántica completa de este nivel de aislamiento de transacciones; use ReadCommitted. Consulte SonnetDB issue #225."
