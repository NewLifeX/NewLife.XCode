"SonnetDB does not support field type {0}.": "SonnetDB no admite el tipo de campo {0}."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING aún no admite la modificación de restricciones de longitud. Consulte SonnetDB issue #240; aún debe implementarse y publicarse la capacidad."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "Cambiar la identidad o la clave principal en columnas existentes de SonnetDB requiere una migración independiente y no puede hacerse mediante ALTER COLUMN."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER perdería la precisión explícita y se rechazó para preservar la semántica del modelo. Consulte SonnetDB issue #241; aún debe corregirse y publicarse."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "SonnetDB incrustado crea bases de datos a través del directorio Data Source; configure una conexión independiente para el directorio de destino."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "SonnetDB incrustado no admite la eliminación del directorio de la base de datos mediante SQL."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB aún no admite la persistencia de comentarios de tablas y columnas. Consulte SonnetDB issue #237; la capacidad debe implementarse y publicarse."
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] El campo {0}.{1} declara la longitud {2}, pero STRING actualmente no admite restricciones de longitud; pendiente, consulte SonnetDB issue #240."
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] Incompleto {0}: aún no se admite la persistencia de comentarios de tablas y columnas; SonnetDB debe implementarlo y publicarlo, consulte issue #237."
