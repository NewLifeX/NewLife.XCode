# Español 词表（es）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "No se ha establecido ninguna clave de relación."
"No master field is set.": "No se ha establecido ningún campo maestro."
"Entity class [{0}] must implement [{1}].": "La clase de entidad [{0}] debe implementar [{1}]."
"No model file was found.": "No se encontró ningún archivo de modelo."
"The specified model file does not exist.": "El archivo de modelo especificado no existe."
"[{0}] no connection string is specified!": "¡[{0}] no se ha especificado una cadena de conexión!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "No se pudo cargar el controlador [{0}]; agregue el paquete de controlador de base de datos desde NuGet."
"Detected secondary cache version change {0} => {1}; expiring local cache": "Se detectó un cambio de versión de la caché secundaria {0} => {1}; se expira la caché local"
"Updating (#{0}), reason: {1}": "Actualizando (#{0}), motivo: {1}"
"Completed [{0}] (#{1})": "Completado [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "Caché borrada forzosamente; el próximo acceso se bloquea y espera una actualización sincrónica"
"Cache cleared without force; the next access updates asynchronously without blocking": "Caché borrada sin forzar; el próximo acceso se actualiza de forma asíncrona sin bloquear"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "La caché de objetos <{0}> está llena, {1:n0}>{2:n0}, se eliminaron [{3:n0}]"
"Clearing single-object cache, reason: {0}, Using = false": "Borrando la caché de objetos individuales, motivo: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: incrementando la versión de caché de [{0}], {1} => {2}, motivo={3}"
"No string primary key is defined for [{0}].": "No se ha definido una clave principal de cadena para [{0}]."
"Table [{0}] has no unique primary key and cannot be used for caching.": "La tabla [{0}] no tiene una clave principal única y no se puede usar para el almacenamiento en caché."
