# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Configuración de XCode"
"Debug": "Depuración"
"Output SQL. Whether to output SQL statements, enabled by default": "Salida SQL. Indica si se generan las sentencias SQL, activado por defecto"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Directorio SQL. Directorio independiente para la salida SQL; vacío por defecto, el SQL va al registro actual. En producción, use un directorio SqlLog dedicado fuera del sitio"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Tiempo de ejecución SQL. El SQL más lento que este umbral en milisegundos se registra, 1000 por defecto"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Longitud máxima de SQL. El SQL más largo se trunca en los registros, 4096 por defecto; use 0 para desactivar el truncado"
"Parameterized CRUD. Disabled by default": "CRUD parametrizado. Desactivado por defecto"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Tamaño de lote. Filas por lote para extraer, eliminar, respaldar y restaurar, 5000 por defecto"
"Batch interval. Pause between batches in milliseconds, default 100": "Intervalo entre lotes. Pausa entre lotes en milisegundos, 100 por defecto"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Tiempo de espera de comando. Tiempo de espera de consulta en segundos, 0 por defecto (ilimitado)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Reintento en caso de error. Reintentos tras un tiempo de espera, 0 por defecto (sin reintentos)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migración. Off: desactivada; ReadOnly: solo comprobar; On: solo crear; Full: también modificar y eliminar"
"Check comments. Table and column comments for migrations, enabled by default": "Comprobar comentarios. Comentarios de tablas y columnas para migraciones, activado por defecto"
"Check for dropped indexes. Migration check, enabled by default": "Comprobar índices eliminados. Comprobación de migración, activada por defecto"
"Check for new indexes. Migration check, enabled by default": "Comprobar índices nuevos. Comprobación de migración, activada por defecto"
"Check for duplicate indexes. Enabled by default": "Comprobar índices duplicados. Activado por defecto"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Mayúsculas/minúsculas de nombres de tablas y columnas. Default: decide la base de datos; None: mantener el formato del modelo; Upper: mayúsculas; Lower: minúsculas; Underline: guion bajo"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Umbral de recuento completo. Los recuentos se estiman primero con estadísticas de índices; las estimaciones superiores a este valor se usan tal cual, de lo contrario count(*) obtiene el valor exacto. Bájelo para evitar primeras visitas lentas en tablas grandes, súbalo para recuentos exactos. 10 millones por defecto"
"Cache": "Caché"
"Data cache. Caches by SQL, default 0 seconds": "Caché de datos. Almacena en caché por SQL, 0 segundos por defecto"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Caducidad de caché de entidades. Almacena en caché toda la lista de entidades, 10 segundos por defecto"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Caducidad de caché de objeto único. Almacena entidades por clave principal, 10 segundos por defecto"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Caducidad de propiedades extendidas. Almacena en caché la propiedad Extends, 10 segundos por defecto"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Caducidad de caché de campos. Almacena los valores agrupados de los campos de categoría, 3600 segundos por defecto"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Periodo de estadísticas de caché. Intervalo en segundos para registrar estadísticas de caché, 0 lo desactiva, 3600 por defecto"

