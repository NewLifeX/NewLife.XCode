# 程序集标题与描述（英文源文 → 西班牙语）
"XCode Super ORM Middleware": "Middleware ORM de XCode"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "Middleware de datos .NET de alto rendimiento (super ORM) centrado en CRUD y datos masivos, con caché multinivel, migración automática, fragmentación, consultas fuertemente tipadas y migración entre bases de datos."
"XCode Entity Generator": "Generador de entidades de XCode"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "Herramienta oficial de línea de comandos de XCode que genera clases de datos de entidad y clases de negocio a partir de Model.xml, con soporte para modelado rápido e iteración continua."

