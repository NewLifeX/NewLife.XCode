"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB aún no admite la semántica Replace de eliminar filas en conflicto e insertar nuevas filas. Consulte SonnetDB issue #242."
