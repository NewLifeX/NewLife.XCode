"SonnetDB does not support field type {0}.": "SonnetDB از نوع فیلد {0} پشتیبانی نمی‌کند."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING هنوز از تغییر محدودیت‌های طول پشتیبانی نمی‌کند. SonnetDB issue #240 را ببینید؛ این قابلیت هنوز باید پیاده‌سازی و منتشر شود."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "تغییر هویت یا کلید اصلی در ستون‌های موجود SonnetDB نیازمند مهاجرت جداگانه است و نمی‌توان آن را از طریق ALTER COLUMN انجام داد."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER دقت صریح را از دست می‌دهد و برای حفظ معناشناسی مدل رد شد. SonnetDB issue #241 را ببینید؛ هنوز باید اصلاح و منتشر شود."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "SonnetDB جاسازی‌شده پایگاه‌های داده را از طریق پوشه Data Source ایجاد می‌کند؛ یک اتصال جداگانه برای پوشه هدف پیکربندی کنید."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "SonnetDB جاسازی‌شده از حذف پوشه پایگاه داده از طریق SQL پشتیبانی نمی‌کند."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB هنوز از ماندگاری توضیحات جدول و ستون پشتیبانی نمی‌کند. SonnetDB issue #237 را ببینید؛ این قابلیت باید پیاده‌سازی و منتشر شود."
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] فیلد {0}.{1} طول {2} را اعلام می‌کند، اما STRING در حال حاضر از محدودیت طول پشتیبانی نمی‌کند؛ در انتظار، SonnetDB issue #240 را ببینید."
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] ناتمام {0}: ماندگاری توضیحات جدول و ستون هنوز پشتیبانی نمی‌شود؛ SonnetDB باید آن را پیاده‌سازی و منتشر کند، issue #237 را ببینید."
