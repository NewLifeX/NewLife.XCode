"The DoubleTop paging algorithm requires a sort column! {0}": "الگوریتم صفحه‌بندی DoubleTop نیازمند ستون مرتب‌سازی است! {0}"
"Upsert encountered an identity field with mixed zero and non-zero values and cannot support both Insert and Update.": "Upsert با فیلد هویتی مواجه شد که مقادیر صفر و غیرصفر مخلوط دارد و نمی‌تواند هم‌زمان Insert و Update را پشتیبانی کند."
