"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 نمی‌تواند این مقدار Decimal را دقیقاً حفظ کند و نوشتن را رد کرد. SonnetDB issue #235 را ببینید؛ پشتیبانی از پارامترهای decimal دقیق هنوز باید پیاده‌سازی و منتشر شود."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT از Int64 علامت‌دار استفاده می‌کند و فقط مقادیر UInt64 تا Int64.MaxValue را پشتیبانی می‌کند."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME فقط می‌تواند دقت میلی‌ثانیه را حفظ کند و زمان‌های کمتر از یک میلی‌ثانیه را رد کرد. SonnetDB issue #236 را ببینید؛ پشتیبانی کامل از دقت زمان هنوز باید پیاده‌سازی و منتشر شود."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "حذف انبوه محدود در SonnetDB در حال حاضر نیازمند کلید اصلی تک‌ستونی است؛ جدول‌های دارای کلید اصلی مرکب یا بدون کلید اصلی نمی‌توانند به حذف نامحدود بازگردند. SonnetDB issue #243 را ببینید."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB هنوز معناشناسی کامل این سطح جداسازی تراکنش را ارائه نمی‌دهد؛ از ReadCommitted استفاده کنید. SonnetDB issue #225 را ببینید."
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "نتیجه SonnetDB ستون‌های هویت را شناسایی نمی‌کند، بنابراین شماره تولیدشده را نمی‌توان به‌طور ایمن به دست آورد. به نسخه‌ای از SonnetDB که شامل فراداده ستون RETURNING است ارتقا دهید."
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB هنوز معناشناسی Replace یعنی حذف ردیف‌های متضاد و درج ردیف‌های جدید را پشتیبانی نمی‌کند. SonnetDB issue #242 را ببینید."
