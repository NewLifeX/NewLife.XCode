# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "تنظیمات XCode"
"Debug": "اشکال‌زدایی"
"Output SQL. Whether to output SQL statements, enabled by default": "خروجی SQL. آیا دستورهای SQL تولید شوند، به‌طور پیش‌فرض فعال"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "پوشه SQL. پوشه‌ای جداگانه برای خروجی SQL؛ به‌طور پیش‌فرض خالی است تا SQL در گزارش جاری نوشته شود. در محیط تولید از پوشه اختصاصی SqlLog خارج از سایت استفاده کنید"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "زمان اجرای SQL. SQL کندتر از این آستانه بر حسب میلی‌ثانیه ثبت می‌شود، پیش‌فرض 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "حداکثر طول SQL. SQL طولانی‌تر در گزارش‌ها کوتاه می‌شود، پیش‌فرض 4096؛ برای غیرفعال کردن کوتاه‌سازی از 0 استفاده کنید"
"Parameterized CRUD. Disabled by default": "CRUD پارامتری. به‌طور پیش‌فرض غیرفعال"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "اندازه دسته. تعداد سطر در هر دسته برای استخراج، حذف، پشتیبان‌گیری و بازیابی، پیش‌فرض 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "فاصله دسته‌ها. توقف بین دسته‌ها بر حسب میلی‌ثانیه، پیش‌فرض 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "مهلت دستور. مهلت پرس‌وجو بر حسب ثانیه، پیش‌فرض 0 (نامحدود)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "تلاش مجدد در صورت خطا. تعداد تلاش مجدد پس از پایان مهلت دستور، پیش‌فرض 0 (بدون تلاش مجدد)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "مهاجرت. Off: غیرفعال؛ ReadOnly: فقط بررسی؛ On: فقط ایجاد؛ Full: همچنین تغییر و حذف"
"Check comments. Table and column comments for migrations, enabled by default": "بررسی توضیحات. توضیحات جدول و ستون برای مهاجرت‌ها، به‌طور پیش‌فرض فعال"
"Check for dropped indexes. Migration check, enabled by default": "بررسی ایندکس‌های حذف‌شده. بررسی مهاجرت، به‌طور پیش‌فرض فعال"
"Check for new indexes. Migration check, enabled by default": "بررسی ایندکس‌های جدید. بررسی مهاجرت، به‌طور پیش‌فرض فعال"
"Check for duplicate indexes. Enabled by default": "بررسی ایندکس‌های تکراری. به‌طور پیش‌فرض فعال"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "حالت حروف نام جدول و ستون. Default: پایگاه داده تصمیم می‌گیرد؛ None: حفظ حالت مدل؛ Upper: حروف بزرگ؛ Lower: حروف کوچک؛ Underline: زیرخط"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "آستانه شمارش کامل. تعداد سطرها ابتدا از آمار ایندکس تخمین زده می‌شود؛ تخمین‌های بالاتر از این مقدار همان‌طور که هستند استفاده می‌شوند، در غیر این صورت count(*) مقدار دقیق را می‌دهد. برای جلوگیری از کندی اولین بازدید جدول‌های بزرگ آن را کاهش دهید و برای شمارش دقیق افزایش دهید. پیش‌فرض 10 میلیون"
"Cache": "حافظه نهان"
"Data cache. Caches by SQL, default 0 seconds": "حافظه نهان داده. بر اساس SQL ذخیره می‌کند، پیش‌فرض 0 ثانیه"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "انقضای حافظه نهان موجودیت‌ها. کل فهرست موجودیت‌ها را ذخیره می‌کند، پیش‌فرض 10 ثانیه"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "انقضای حافظه نهان شیء تکی. موجودیت‌ها را بر اساس کلید اصلی ذخیره می‌کند، پیش‌فرض 10 ثانیه"
"Extended property expiration. Caches the Extends property, default 10 seconds": "انقضای ویژگی‌های توسعه‌یافته. ویژگی Extends را ذخیره می‌کند، پیش‌فرض 10 ثانیه"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "انقضای حافظه نهان فیلدها. مقادیر گروه‌بندی‌شده فیلدهای دسته را ذخیره می‌کند، پیش‌فرض 3600 ثانیه"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "دوره آمار حافظه نهان. فاصله بر حسب ثانیه برای ثبت آمار حافظه نهان، 0 غیرفعال می‌کند، پیش‌فرض 3600"

