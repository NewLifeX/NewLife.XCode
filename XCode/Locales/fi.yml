"SonnetDB does not support field type {0}.": "SonnetDB ei tue kenttätyyppiä {0}."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING ei vielä tue pituusrajoitusten muuttamista. Katso SonnetDB issue #240; ominaisuus on vielä toteutettava ja julkaistava."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "Olemassa olevien SonnetDB-sarakkeiden identiteetin tai pääavaimen muuttaminen edellyttää erillistä migraatiota, eikä sitä voi tehdä ALTER COLUMNilla."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER menettäisi eksplisiittisen tarkkuuden, ja se hylättiin mallin semantiikan säilyttämiseksi. Katso SonnetDB issue #241; se on vielä korjattava ja julkaistava."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "Upotettu SonnetDB luo tietokannat Data Source -hakemiston kautta; määritä erillinen yhteys kohdehakemistolle."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "Upotettu SonnetDB ei tue tietokantahakemiston poistamista SQL:n kautta."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB ei vielä tue taulujen ja sarakkeiden kommenttien tallentamista. Katso SonnetDB issue #237; ominaisuus on toteutettava ja julkaistava."
