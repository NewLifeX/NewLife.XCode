"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 ei voi säilyttää tätä Decimal-arvoa tarkasti ja hylkäsi kirjoituksen. Katso SonnetDB issue #235; tarkkojen decimal-parametrien tuki on vielä toteutettava ja julkaistava."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT käyttää etumerkillistä Int64:ää ja tukee vain UInt64-arvoja Int64.MaxValueen asti."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME voi säilyttää vain millisekunnin tarkkuuden ja hylkäsi alle millisekunnin ajat. Katso SonnetDB issue #236; täysi aikatarkkuuden tuki on vielä toteutettava ja julkaistava."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "SonnetDB:n rajoitettu massapoisto edellyttää tällä hetkellä yhden sarakkeen pääavainta; taulut, joissa on yhdistetty pääavain tai ei pääavainta, eivät voi siirtyä rajoittamattomaan poistoon. Katso SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB ei vielä tarjoa tämän tapahtuman eristystason täyttä semantiikkaa; käytä ReadCommittedia. Katso SonnetDB issue #225."
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "SonnetDB-tulos ei tunnista identiteettisarakkeita, joten luotua numeroa ei voi hakea turvallisesti. Päivitä SonnetDB-versioon, joka sisältää RETURNING-sarakkeen metatiedot."
