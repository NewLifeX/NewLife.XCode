# 程序集标题与描述（英文源文 → 芬兰语）
"XCode Super ORM Middleware": "XCode super-ORM-väliohjelmisto"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "Suorituskykyinen .NET-tietoväliohjelmisto (super ORM), joka keskittyy CRUD-toimintoihin ja massadataan: monitasoinen välimuisti, automaattinen migraatio, sharding, vahvasti tyypitetyt kyselyt ja tietokantojen välinen migraatio."
"XCode Entity Generator": "XCode-entiteettigeneraattori"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "XCoDen virallinen komentorivityökalu, joka luo Model.xml-tiedostosta entiteettien dataluokat ja liiketoimintaluokat ja tukee nopeaa mallinnusta sekä jatkuvaa iterointia."

