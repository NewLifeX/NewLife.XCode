# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "XCode-asetukset"
"Debug": "Virheenjäljitys"
"Output SQL. Whether to output SQL statements, enabled by default": "SQL-tuloste. Tulostetaanko SQL-lauseet, oletuksena käytössä"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL-hakemisto. Erillinen hakemisto SQL-tulosteelle; oletuksena tyhjä, jolloin SQL kirjoitetaan nykyiseen lokiin. Käytä tuotannossa erillistä SqlLog-hakemistoa sivuston ulkopuolella"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL-suoritusaika. Tätä kynnysarvoa millisekunteina hitaampi SQL kirjataan lokiin, oletus 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "SQL:n enimmäispituus. Pidempi SQL katkaistaan lokeissa, oletus 4096; 0 poistaa katkaisun käytöstä"
"Parameterized CRUD. Disabled by default": "Parametroitu CRUD. Oletuksena pois käytöstä"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Erän koko. Rivit erää kohden poimintaa, poistoa, varmuuskopiointia ja palautusta varten, oletus 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Eräväli. Tauko erien välillä millisekunteina, oletus 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Komennon aikakatkaisu. Kyselyn aikakatkaisu sekunteina, oletus 0 (rajoittamaton)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Yritä uudelleen virheen sattuessa. Uudelleenyritykset komennon aikakatkaisun jälkeen, oletus 0 (ei uudelleenyrityksiä)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migraatio. Off: pois käytöstä; ReadOnly: vain tarkistus; On: vain luonti; Full: myös muokkaus ja poisto"
"Check comments. Table and column comments for migrations, enabled by default": "Tarkista kommentit. Taulujen ja sarakkeiden kommentit migraatioihin, oletuksena käytössä"
"Check for dropped indexes. Migration check, enabled by default": "Tarkista poistetut indeksit. Migraatiotarkistus, oletuksena käytössä"
"Check for new indexes. Migration check, enabled by default": "Tarkista uudet indeksit. Migraatiotarkistus, oletuksena käytössä"
"Check for duplicate indexes. Enabled by default": "Tarkista päällekkäiset indeksit. Oletuksena käytössä"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Taulujen ja sarakkeiden nimien kirjainkoko. Default: tietokanta päättää; None: säilytä mallin kirjoitusasu; Upper: isot kirjaimet; Lower: pienet kirjaimet; Underline: alaviiva"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Täydellisen laskennan kynnys. Rivimäärät arvioidaan ensin indeksitilastojen avulla; tämän arvon ylittävät arviot käytetään sellaisenaan, muuten count(*) antaa tarkan arvon. Laske sitä välttääksesi hitaat ensimmäiset käynnit suurissa tauluissa, nosta sitä tarkkoja laskentoja varten. Oletus 10 miljoonaa"
"Cache": "Välimuisti"
"Data cache. Caches by SQL, default 0 seconds": "Tietovälimuisti. Välimuisti SQL:n mukaan, oletus 0 sekuntia"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Entiteettivälimuistin vanheneminen. Välimuistiin koko entiteettiluettelo, oletus 10 sekuntia"
