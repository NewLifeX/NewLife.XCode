"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME ne peut conserver qu’une précision de milliseconde et a rejeté les temps inférieurs à la milliseconde. Voir SonnetDB issue #236 ; la prise en charge complète de la précision temporelle doit encore être implémentée et publiée."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "La suppression en masse bornée dans SonnetDB nécessite actuellement une clé primaire à une seule colonne ; les tables avec une clé primaire composite ou sans clé primaire ne peuvent pas recourir à une suppression non bornée. Voir SonnetDB issue #243."
