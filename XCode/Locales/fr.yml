# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Paramètres XCode"
"Debug": "Débogage"
"Output SQL. Whether to output SQL statements, enabled by default": "Sortie SQL. Indique s'il faut générer les instructions SQL, activé par défaut"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Répertoire SQL. Répertoire distinct pour la sortie SQL ; vide par défaut, le SQL est alors écrit dans le journal courant. En production, utilisez un répertoire SqlLog dédié hors du site"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Temps d'exécution SQL. Les requêtes SQL plus lentes que ce seuil en millisecondes sont journalisées, 1000 par défaut"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Longueur maximale du SQL. Le SQL plus long est tronqué dans les journaux, 4096 par défaut ; 0 désactive la troncature"
"Parameterized CRUD. Disabled by default": "CRUD paramétré. Désactivé par défaut"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Taille de lot. Lignes par lot pour l'extraction, la suppression, la sauvegarde et la restauration, 5000 par défaut"
"Batch interval. Pause between batches in milliseconds, default 100": "Intervalle entre lots. Pause entre les lots en millisecondes, 100 par défaut"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Délai d'expiration des commandes. Délai d'expiration des requêtes en secondes, 0 par défaut (illimité)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Nouvelle tentative en cas d'échec. Nouvelles tentatives après un délai d'expiration, 0 par défaut (aucune)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migration. Off : désactivée ; ReadOnly : vérification seule ; On : création seule ; Full : modification et suppression également"
"Check comments. Table and column comments for migrations, enabled by default": "Vérifier les commentaires. Commentaires de tables et de colonnes pour les migrations, activé par défaut"
"Check for dropped indexes. Migration check, enabled by default": "Vérifier les index supprimés. Contrôle de migration, activé par défaut"
"Check for new indexes. Migration check, enabled by default": "Vérifier les nouveaux index. Contrôle de migration, activé par défaut"
"Check for duplicate indexes. Enabled by default": "Vérifier les index en double. Activé par défaut"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Casse des noms de tables et de colonnes. Default : décidée par la base ; None : conserver la casse du modèle ; Upper : majuscules ; Lower : minuscules ; Underline : souligné"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Seuil de comptage complet. Les nombres de lignes sont d'abord estimés via les statistiques d'index ; les estimations supérieures à cette valeur sont utilisées telles quelles, sinon count(*) donne une valeur exacte. Abaissez-la pour éviter un premier accès lent sur les grandes tables, augmentez-la pour des comptages exacts. 10 millions par défaut"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Cache de données. Mise en cache par SQL, 0 seconde par défaut"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Expiration du cache d'entités. Met en cache la liste complète des entités, 10 secondes par défaut"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Expiration du cache d'objets uniques. Met en cache les entités par clé primaire, 10 secondes par défaut"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Expiration des propriétés étendues. Met en cache la propriété Extends, 10 secondes par défaut"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Expiration du cache de champs. Met en cache les valeurs groupées des champs de catégorie, 3600 secondes par défaut"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Période des statistiques de cache. Intervalle en secondes pour journaliser les statistiques de cache, 0 désactive, 3600 par défaut"

