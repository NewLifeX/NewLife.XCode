"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING ne prend pas encore en charge la modification des contraintes de longueur. Voir SonnetDB issue #240 ; la fonctionnalité doit encore être implémentée et publiée."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "La modification de l’identité ou de la clé primaire des colonnes SonnetDB existantes nécessite une migration distincte et ne peut pas être effectuée via ALTER COLUMN."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER perdrait la précision explicite et a été rejeté pour préserver la sémantique du modèle. Voir SonnetDB issue #241 ; il doit encore être corrigé et publié."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "SonnetDB intégré crée des bases de données via le répertoire Data Source ; configurez une connexion distincte pour le répertoire cible."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "SonnetDB intégré ne prend pas en charge la suppression du répertoire de base de données via SQL."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB ne prend pas encore en charge la persistance des commentaires de tables et de colonnes. Voir SonnetDB issue #237 ; la fonctionnalité doit être implémentée et publiée."
