# Français 词表（fr）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "Aucune clé de relation n'est définie."
"No master field is set.": "Aucun champ maître n'est défini."
"Entity class [{0}] must implement [{1}].": "La classe d'entité [{0}] doit implémenter [{1}]."
"No model file was found.": "Aucun fichier de modèle n'a été trouvé."
"The specified model file does not exist.": "Le fichier de modèle spécifié n'existe pas."
"[{0}] no connection string is specified!": "[{0}] aucune chaîne de connexion n'est spécifiée !"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "Impossible de charger le pilote [{0}] ; ajoutez le package de pilote de base de données depuis NuGet."
"Detected secondary cache version change {0} => {1}; expiring local cache": "Changement de version du cache secondaire détecté {0} => {1} ; expiration du cache local"
"Updating (#{0}), reason: {1}": "Mise à jour (n°{0}), raison : {1}"
"Completed [{0}] (#{1})": "Terminé [{0}] (n°{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "Cache vidé de force ; le prochain accès se bloque et attend une mise à jour synchrone"
"Cache cleared without force; the next access updates asynchronously without blocking": "Cache vidé sans forçage ; le prochain accès se met à jour de manière asynchrone sans blocage"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "Le cache d'objets <{0}> est plein, {1:n0}>{2:n0}, [{3:n0}] supprimés"
"Clearing single-object cache, reason: {0}, Using = false": "Vidage du cache d'objets uniques, raison : {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator : incrémentation de la version du cache de [{0}], {1} => {2}, raison={3}"
"No string primary key is defined for [{0}].": "Aucune clé primaire de type chaîne n'est définie pour [{0}]."
"Table [{0}] has no unique primary key and cannot be used for caching.": "La table [{0}] n'a pas de clé primaire unique et ne peut pas être utilisée pour la mise en cache."
"Entity queue [{0}/{1}] saving {2:n0}, estimated {3:n0}ms": "File d'attente d'entités [{0}/{1}] enregistrement de {2:n0}, estimé {3:n0}ms"
