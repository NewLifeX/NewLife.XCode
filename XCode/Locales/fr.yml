"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] Incomplet {0} : la persistance des commentaires de tables et de colonnes n’est pas encore prise en charge ; SonnetDB doit l’implémenter et la publier, voir issue #237."
