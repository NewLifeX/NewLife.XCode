"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "שינוי זהות או מפתח ראשי בעמודות SonnetDB קיימות דורש מיגרציה נפרדת ואינו יכול להתבצע באמצעות ALTER COLUMN."
