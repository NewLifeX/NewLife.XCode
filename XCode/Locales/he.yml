# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "הגדרות XCode"
"Debug": "איתור באגים"
"Output SQL. Whether to output SQL statements, enabled by default": "פלט SQL. האם להפיק פקודות SQL, מופעל כברירת מחדל"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "תיקיית SQL. תיקייה נפרדת לפלט SQL; ריקה כברירת מחדל ולכן SQL נכתב ליומן הנוכחי. בסביבת ייצור השתמשו בתיקיית SqlLog ייעודית מחוץ לאתר"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "זמן ביצוע SQL. SQL איטי מסף זה במילישניות נרשם ביומן, ברירת מחדל 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "אורך SQL מרבי. SQL ארוך יותר נחתך ביומנים, ברירת מחדל 4096; השתמשו ב-0 כדי לבטל את החיתוך"
"Parameterized CRUD. Disabled by default": "CRUD עם פרמטרים. מושבת כברירת מחדל"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "גודל אצווה. שורות לאצווה לחילוץ, מחיקה, גיבוי ושחזור, ברירת מחדל 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "מרווח אצוות. השהיה בין אצוות במילישניות, ברירת מחדל 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "פסק זמן לפקודה. פסק זמן לשאילתה בשניות, ברירת מחדל 0 (ללא הגבלה)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "ניסיון חוזר בעת כשל. ניסיונות חוזרים לאחר פסק זמן של פקודה, ברירת מחדל 0 (ללא ניסיון חוזר)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "מיגרציה. Off: מושבת; ReadOnly: בדיקה בלבד; On: יצירה בלבד; Full: גם שינוי ומחיקה"
"Check comments. Table and column comments for migrations, enabled by default": "בדיקת הערות. הערות טבלאות ועמודות למיגרציות, מופעל כברירת מחדל"
"Check for dropped indexes. Migration check, enabled by default": "בדיקת אינדקסים שנמחקו. בדיקת מיגרציה, מופעלת כברירת מחדל"
"Check for new indexes. Migration check, enabled by default": "בדיקת אינדקסים חדשים. בדיקת מיגרציה, מופעלת כברירת מחדל"
"Check for duplicate indexes. Enabled by default": "בדיקת אינדקסים כפולים. מופעל כברירת מחדל"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "אותיות רישיות/קטנות בשמות טבלאות ועמודות. Default: מסד הנתונים מחליט; None: שמירה על רישיות המודל; Upper: אותיות גדולות; Lower: אותיות קטנות; Underline: קו תחתון"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "סף ספירה מלאה. מספרי שורות נאמדים תחילה מנתוני סטטיסטיקה של אינדקסים; אומדנים מעל ערך זה משמשים כפי שהם, אחרת count(*) מחזיר ערך מדויק. הנמיכו אותו כדי למנוע טעינה איטית של ביקור ראשון בטבלאות גדולות, העלו אותו לספירה מדויקת. ברירת מחדל 10 מיליון"
"Cache": "מטמון"
"Data cache. Caches by SQL, default 0 seconds": "מטמון נתונים. שומר במטמון לפי SQL, ברירת מחדל 0 שניות"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "תפוגת מטמון ישויות. שומר במטמון את כל רשימת הישויות, ברירת מחדל 10 שניות"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "תפוגת מטמון אובייקט בודד. שומר ישויות במטמון לפי מפתח ראשי, ברירת מחדל 10 שניות"
"Extended property expiration. Caches the Extends property, default 10 seconds": "תפוגת מאפיינים מורחבים. שומר במטמון את המאפיין Extends, ברירת מחדל 10 שניות"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "תפוגת מטמון שדות. שומר ערכים מקובצים של שדות קטגוריה, ברירת מחדל 3600 שניות"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "תקופת סטטיסטיקת מטמון. מרווח בשניות לתיעוד סטטיסטיקת מטמון, 0 משבית, ברירת מחדל 3600"

