# 程序集标题与描述（英文源文 → 希伯来语）
"XCode Super ORM Middleware": "תוכנת ביניים ORM של XCode"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "תוכנת ביניים לנתונים ב-.NET בביצועים גבוהים (super ORM) המתמקדת ב-CRUD ובנתונים עצומים, עם מטמון רב-שכבתי, העברה אוטומטית, פיצול, שאילתות בעלות טיפוס חזק והעברה בין מסדי נתונים."
"XCode Entity Generator": "מחולל הישויות של XCode"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "כלי שורת פקודה רשמי של XCode שיוצר מחלקות נתונים של ישויות ומחלקות עסקיות מתוך Model.xml, ותומך במידול מהיר ובאיטרציה מתמשכת."

