"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "SonnetDB מוטבע יוצר מסדי נתונים דרך תיקיית Data Source; הגדר חיבור נפרד עבור תיקיית היעד."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "SonnetDB מוטבע אינו תומך במחיקת תיקיית מסד הנתונים באמצעות SQL."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB עדיין אינו תומך בשמירה מתמשכת של הערות טבלה ועמודה. ראה SonnetDB issue #237; יש ליישם ולפרסם את היכולת."
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] השדה {0}.{1} מצהיר על אורך {2}, אך STRING אינו תומך כרגע באילוצי אורך; בהמתנה, ראה SonnetDB issue #240."
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] לא הושלם {0}: שמירה מתמשכת של הערות טבלה ועמודה אינה נתמכת עדיין; SonnetDB חייב ליישם ולפרסם זאת, ראה issue #237."
