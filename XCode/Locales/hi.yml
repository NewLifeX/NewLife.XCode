"SonnetDB LIMIT/OFFSET currently cannot exceed Int32.MaxValue. See SonnetDB issue #256.": "SonnetDB LIMIT/OFFSET वर्तमान में Int32.MaxValue से अधिक नहीं हो सकता। SonnetDB issue #256 देखें।"
"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 इस Decimal मान को सटीक रूप से संरक्षित नहीं कर सकता और इसने लेखन अस्वीकार कर दिया। SonnetDB issue #235 देखें; सटीक decimal पैरामीटर समर्थन अभी भी लागू और जारी किया जाना बाकी है।"
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT हस्ताक्षरित Int64 का उपयोग करता है और केवल Int64.MaxValue तक UInt64 मानों का समर्थन करता है।"
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME केवल मिलीसेकंड परिशुद्धता संरक्षित कर सकता है और इसने एक मिलीसेकंड से कम समय अस्वीकार कर दिया। SonnetDB issue #236 देखें; पूर्ण समय परिशुद्धता समर्थन अभी भी लागू और जारी किया जाना बाकी है।"
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "SonnetDB में सीमित बल्क डिलीट के लिए वर्तमान में एकल-कॉलम प्राथमिक कुंजी आवश्यक है; समग्र प्राथमिक कुंजी वाली या बिना प्राथमिक कुंजी वाली तालिकाएँ असीमित डिलीट पर वापस नहीं जा सकतीं। SonnetDB issue #243 देखें।"
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB अभी तक इस लेन-देन अलगाव स्तर का पूर्ण अर्थ नहीं देता; ReadCommitted का उपयोग करें। SonnetDB issue #225 देखें।"
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "SonnetDB परिणाम पहचान कॉलम की पहचान नहीं करता, इसलिए उत्पन्न संख्या सुरक्षित रूप से प्राप्त नहीं की जा सकती। RETURNING कॉलम मेटाडेटा वाले SonnetDB संस्करण में अपग्रेड करें।"
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB अभी तक Replace अर्थ का समर्थन नहीं करता जिसमें विरोधाभासी पंक्तियों को हटाकर नई पंक्तियाँ डाली जाती हैं। SonnetDB issue #242 देखें।"
"Bulk write must contain at least one field.": "बल्क लेखन में कम से कम एक फ़ील्ड होना चाहिए।"
"SonnetDB Upsert requires a primary key or a complete unique-index conflict target.": "SonnetDB Upsert के लिए प्राथमिक कुंजी या पूर्ण विशिष्ट-इंडेक्स विरोध लक्ष्य आवश्यक है।"
"SonnetDB field type has not been mapped: {0}": "SonnetDB फ़ील्ड प्रकार मैप नहीं किया गया है: {0}"
