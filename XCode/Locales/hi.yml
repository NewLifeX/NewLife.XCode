"SonnetDB view [{0}] field [{1}] did not provide a mappable declared type. See SonnetDB issue #261; view declaration metadata still needs to be completed and released.": "SonnetDB दृश्य [{0}] के फ़ील्ड [{1}] ने मैप करने योग्य घोषित प्रकार प्रदान नहीं किया। SonnetDB issue #261 देखें; दृश्य घोषणा मेटाडेटा अभी भी पूरा और जारी किया जाना बाकी है।"
"SonnetDB does not support field type {0}.": "SonnetDB फ़ील्ड प्रकार {0} का समर्थन नहीं करता।"
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING अभी तक लंबाई बाधाओं को बदलने का समर्थन नहीं करता। SonnetDB issue #240 देखें; क्षमता अभी भी लागू और जारी की जानी बाकी है।"
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "मौजूदा SonnetDB कॉलम पर पहचान या प्राथमिक कुंजी बदलने के लिए अलग माइग्रेशन आवश्यक है और यह ALTER COLUMN के माध्यम से नहीं किया जा सकता।"
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER स्पष्ट परिशुद्धता खो देगा और मॉडल अर्थ को संरक्षित करने के लिए अस्वीकार कर दिया गया। SonnetDB issue #241 देखें; इसे अभी भी ठीक और जारी किया जाना बाकी है।"
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "एम्बेडेड SonnetDB Data Source निर्देशिका के माध्यम से डेटाबेस बनाता है; लक्ष्य निर्देशिका के लिए अलग कनेक्शन कॉन्फ़िगर करें।"
"Embedded SonnetDB does not support deleting the database directory via SQL.": "एम्बेडेड SonnetDB SQL के माध्यम से डेटाबेस निर्देशिका हटाने का समर्थन नहीं करता।"
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB अभी तक तालिका और कॉलम टिप्पणियों को स्थायी रूप से संग्रहीत करने का समर्थन नहीं करता। SonnetDB issue #237 देखें; क्षमता लागू और जारी की जानी चाहिए।"
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] फ़ील्ड {0}.{1} लंबाई {2} घोषित करता है, लेकिन STRING वर्तमान में लंबाई बाधाओं का समर्थन नहीं करता; लंबित, SonnetDB issue #240 देखें।"
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] अपूर्ण {0}: तालिका और कॉलम टिप्पणियों का स्थायी संग्रहण अभी समर्थित नहीं है; SonnetDB को इसे लागू और जारी करना होगा, issue #237 देखें।"
