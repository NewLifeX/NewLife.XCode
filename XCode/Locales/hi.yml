"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "अधिकतम SQL लंबाई। इससे लंबा SQL लॉग में काटा जाता है, डिफ़ॉल्ट 4096; काटना बंद करने के लिए 0 का उपयोग करें"
"Parameterized CRUD. Disabled by default": "पैरामीटरयुक्त CRUD। डिफ़ॉल्ट रूप से अक्षम"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "बैच आकार। निकासी, हटाने, बैकअप और पुनर्स्थापन के लिए प्रति बैच पंक्तियाँ, डिफ़ॉल्ट 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "बैच अंतराल। बैचों के बीच मिलीसेकंड में विराम, डिफ़ॉल्ट 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "कमांड टाइमआउट। सेकंड में क्वेरी टाइमआउट, डिफ़ॉल्ट 0 (असीमित)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "विफलता पर पुनः प्रयास। कमांड टाइमआउट के बाद पुनः प्रयास, डिफ़ॉल्ट 0 (कोई पुनः प्रयास नहीं)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "माइग्रेशन। Off: अक्षम; ReadOnly: केवल जाँच; On: केवल निर्माण; Full: बदलाव और हटाना भी"
"Check comments. Table and column comments for migrations, enabled by default": "टिप्पणियाँ जाँचें। माइग्रेशन के लिए तालिका और स्तंभ टिप्पणियाँ, डिफ़ॉल्ट रूप से सक्षम"
"Check for dropped indexes. Migration check, enabled by default": "हटाए गए इंडेक्स जाँचें। माइग्रेशन जाँच, डिफ़ॉल्ट रूप से सक्षम"
"Check for new indexes. Migration check, enabled by default": "नए इंडेक्स जाँचें। माइग्रेशन जाँच, डिफ़ॉल्ट रूप से सक्षम"
"Check for duplicate indexes. Enabled by default": "डुप्लिकेट इंडेक्स जाँचें। डिफ़ॉल्ट रूप से सक्षम"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "तालिका और स्तंभ नाम का केस। Default: डेटाबेस तय करता है; None: मॉडल का केस बनाए रखें; Upper: अपरकेस; Lower: लोअरकेस; Underline: अंडरस्कोर"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "पूर्ण गणना सीमा। पंक्ति संख्याएँ पहले इंडेक्स आँकड़ों से अनुमानित की जाती हैं; इस मान से अधिक अनुमान जैसे हैं वैसे उपयोग होते हैं, अन्यथा count(*) सटीक मान देता है। बड़ी तालिकाओं में धीमी पहली पहुँच से बचने के लिए इसे घटाएँ, सटीक गणना के लिए बढ़ाएँ। डिफ़ॉल्ट 1 करोड़"
"Cache": "कैश"
"Data cache. Caches by SQL, default 0 seconds": "डेटा कैश। SQL के अनुसार कैश करता है, डिफ़ॉल्ट 0 सेकंड"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "इकाई कैश की समाप्ति। पूरी इकाई सूची कैश करता है, डिफ़ॉल्ट 10 सेकंड"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "एकल ऑब्जेक्ट कैश की समाप्ति। इकाइयों को प्राथमिक कुंजी के अनुसार कैश करता है, डिफ़ॉल्ट 10 सेकंड"
"Extended property expiration. Caches the Extends property, default 10 seconds": "विस्तारित गुणों की समाप्ति। Extends गुण कैश करता है, डिफ़ॉल्ट 10 सेकंड"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "फ़ील्ड कैश की समाप्ति। श्रेणी फ़ील्ड के समूहित मान कैश करता है, डिफ़ॉल्ट 3600 सेकंड"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "कैश आँकड़ों की अवधि। कैश आँकड़े लॉग करने का सेकंड में अंतराल, 0 अक्षम करता है, डिफ़ॉल्ट 3600"
