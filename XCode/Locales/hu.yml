"XCode settings": "XCode beállítások"
"Debug": "Hibakeresés"
"Output SQL. Whether to output SQL statements, enabled by default": "SQL-kimenet. Kiírja-e az SQL utasításokat, alapértelmezés szerint bekapcsolva"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL-könyvtár. Külön könyvtár az SQL-kimenethez; alapértelmezés szerint üres, így az SQL az aktuális naplóba kerül. Éles környezetben használjon külön SqlLog könyvtárat a webhelyen kívül"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL-végrehajtási idő. Az ennél a milliszekundumban megadott küszöbnél lassabb SQL naplózásra kerül, alapértelmezés 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Maximális SQL-hossz. A hosszabb SQL a naplókban csonkolásra kerül, alapértelmezés 4096; 0 értékkel kikapcsolható a csonkolás"
"Parameterized CRUD. Disabled by default": "Paraméterezett CRUD. Alapértelmezés szerint kikapcsolva"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Kötegméret. Sorok kötegenként a kinyeréshez, törléshez, biztonsági mentéshez és visszaállításhoz, alapértelmezés 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Kötegintervallum. Szünet a kötegek között milliszekundumban, alapértelmezés 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Parancs időtúllépése. Lekérdezés időtúllépése másodpercben, alapértelmezés 0 (korlátlan)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Újrapróbálkozás hiba esetén. Újrapróbálkozások a parancs időtúllépése után, alapértelmezés 0 (nincs újrapróbálkozás)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migráció. Off: kikapcsolva; ReadOnly: csak ellenőrzés; On: csak létrehozás; Full: módosítás és törlés is"
"Check comments. Table and column comments for migrations, enabled by default": "Megjegyzések ellenőrzése. Tábla- és oszlopmegjegyzések a migrációkhoz, alapértelmezés szerint bekapcsolva"
"Check for dropped indexes. Migration check, enabled by default": "Törölt indexek ellenőrzése. Migrációellenőrzés, alapértelmezés szerint bekapcsolva"
"Check for new indexes. Migration check, enabled by default": "Új indexek ellenőrzése. Migrációellenőrzés, alapértelmezés szerint bekapcsolva"
"Check for duplicate indexes. Enabled by default": "Duplikált indexek ellenőrzése. Alapértelmezés szerint bekapcsolva"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Tábla- és oszlopnevek kis- és nagybetűhasználata. Default: az adatbázis dönt; None: a modell írásmódjának megtartása; Upper: nagybetűk; Lower: kisbetűk; Underline: aláhúzás"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Teljes számlálás küszöbértéke. A sorszámok először indexstatisztikákból becsültek; az e fölötti becslések változatlanul használatosak, ellenkező esetben a count(*) pontos értéket ad. Csökkentse a nagy táblák lassú első elérésének elkerüléséhez, növelje a pontos számláláshoz. Alapértelmezés 10 millió"
"Cache": "Gyorsítótár"
"Data cache. Caches by SQL, default 0 seconds": "Adatgyorsítótár. SQL szerint gyorsítótáraz, alapértelmezés 0 másodperc"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Entitás-gyorsítótár lejárata. A teljes entitáslistát gyorsítótárazza, alapértelmezés 10 másodperc"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Egyedi objektum-gyorsítótár lejárata. Az entitásokat elsődleges kulcs szerint gyorsítótárazza, alapértelmezés 10 másodperc"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Kiterjesztett tulajdonságok lejárata. Az Extends tulajdonságot gyorsítótárazza, alapértelmezés 10 másodperc"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Mező-gyorsítótár lejárata. A kategóriamezők csoportosított értékeit gyorsítótárazza, alapértelmezés 3600 másodperc"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Gyorsítótár-statisztika időszaka. Intervallum másodpercben a gyorsítótár-statisztikák naplózásához, 0 kikapcsolja, alapértelmezés 3600"

