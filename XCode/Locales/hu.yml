# 程序集标题与描述（英文源文 → 匈牙利语）
"XCode Super ORM Middleware": "XCode szuper ORM middleware"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "Nagy teljesítményű .NET adatmiddleware (super ORM), CRUD-ra és hatalmas adatmennyiségre fókuszálva: többszintű gyorsítótár, automatikus migráció, sharding, erősen tipizált lekérdezések és adatbázisok közötti migráció."
"XCode Entity Generator": "XCode entitásgenerátor"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "A XCode hivatalos parancssori eszköze, amely a Model.xml fájlból entitás-adatosztályokat és üzleti osztályokat állít elő, támogatva a gyors modellezést és a folyamatos iterációt."

