"InfluxDB does not support altering columns.": "InfluxDB tidak mendukung perubahan kolom."
"SonnetDB LIMIT/OFFSET currently cannot exceed Int32.MaxValue. See SonnetDB issue #256.": "SonnetDB LIMIT/OFFSET saat ini tidak dapat melebihi Int32.MaxValue. Lihat SonnetDB issue #256."
"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 tidak dapat mempertahankan nilai Decimal ini secara tepat dan menolak penulisan. Lihat SonnetDB issue #235; dukungan parameter decimal yang tepat masih perlu diterapkan dan dirilis."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT menggunakan Int64 bertanda dan hanya mendukung nilai UInt64 hingga Int64.MaxValue."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME hanya dapat mempertahankan presisi milidetik dan menolak waktu di bawah satu milidetik. Lihat SonnetDB issue #236; dukungan presisi waktu penuh masih perlu diterapkan dan dirilis."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "Penghapusan massal terbatas di SonnetDB saat ini memerlukan kunci utama satu kolom; tabel dengan kunci utama gabungan atau tanpa kunci utama tidak dapat beralih ke penghapusan tak terbatas. Lihat SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB belum menyediakan semantik lengkap tingkat isolasi transaksi ini; gunakan ReadCommitted. Lihat SonnetDB issue #225."
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "Hasil SonnetDB tidak mengidentifikasi kolom identitas, sehingga nomor yang dihasilkan tidak dapat diperoleh dengan aman. Tingkatkan ke versi SonnetDB yang menyertakan metadata kolom RETURNING."
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB belum mendukung semantik Replace yaitu menghapus baris yang berkonflik lalu menyisipkan baris baru. Lihat SonnetDB issue #242."
"Bulk write must contain at least one field.": "Penulisan massal harus berisi setidaknya satu bidang."
"SonnetDB Upsert requires a primary key or a complete unique-index conflict target.": "SonnetDB Upsert memerlukan kunci utama atau target konflik indeks unik yang lengkap."
