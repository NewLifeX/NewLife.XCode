# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Pengaturan XCode"
"Logging": "Log"
"Database": "Basis data"
"Schema migration": "Migrasi skema"
"Cache": "Cache"
"Debug mode. Writes database debug logs such as connection, migration and schema diagnostics; enabled by default": "Mode debug. Menulis log diagnostik basis data seperti koneksi, migrasi, dan pemeriksaan skema; aktif secara default"
"SQL logging. Writes executed SQL statements to the log; enabled by default. Turn it off in production when log volume is too high": "Log SQL. Menulis pernyataan SQL yang dijalankan ke log; aktif secara default. Nonaktifkan di produksi jika volume log terlalu besar"
"SQL log directory. Writes SQL logs to a separate directory; empty by default so they go to the current log. In production, use a dedicated SqlLog directory outside the site": "Direktori log SQL. Menulis log SQL ke direktori terpisah; kosong secara default sehingga masuk ke log saat ini. Di produksi, gunakan direktori SqlLog khusus di luar situs"
"Slow SQL threshold (ms). SQL statements slower than this are logged; 0 disables slow SQL logging; default 1000": "Ambang SQL lambat (ms). Pernyataan SQL yang lebih lambat dari ambang ini dicatat; 0 menonaktifkan pencatatan SQL lambat; default 1000"
"Maximum SQL length (chars). SQL longer than this is truncated in logs; 0 disables truncation; default 4096": "Panjang maksimum SQL (karakter). SQL yang lebih panjang dipotong di log; 0 menonaktifkan pemotongan; default 4096"
"Log masking mode. Increasing strictness: Off (no masking, local debugging only), PasswordOnly (passwords only), Partial (passwords fully masked, keep the head and tail of secrets and tokens), Full (all credentials masked, default)": "Mode penyamaran log. Tingkat ketat meningkat: Off (tanpa penyamaran, hanya debug lokal), PasswordOnly (hanya kata sandi), Partial (kata sandi disamarkan sepenuhnya, awal dan akhir rahasia serta token dipertahankan), Full (semua kredensial disamarkan, default)"
"SQL log masking. Masks passwords, secrets and tokens in SQL logs and exceptions according to the masking mode; enabled by default": "Penyamaran log SQL. Menyamarkan kata sandi, rahasia, dan token di log SQL dan pengecualian sesuai mode penyamaran; aktif secara default"
"Parameterized CRUD. Executes insert, update and delete with parameterized SQL to avoid injection risks; disabled by default": "CRUD berparameter. Menjalankan insert, update, dan delete dengan SQL berparameter untuk menghindari risiko injeksi; nonaktif secara default"
"Command timeout (s). Timeout for SQL command execution; 0 means unlimited; default 0": "Timeout perintah (s). Timeout eksekusi perintah SQL; 0 berarti tanpa batas; default 0"
"Failure retry count. Automatic retries after a command timeout; 0 means no retry; default 0": "Jumlah percobaan ulang. Percobaan ulang otomatis setelah timeout perintah; 0 berarti tanpa percobaan ulang; default 0"
"Exact count row limit (rows). Runs count(*) only when the fast row estimate is below this value; each table adapts it from measured duration; 0 disables exact counting; default 1000000. Changing it resets the learned state on next access": "Batas baris hitung tepat (baris). count(*) hanya dijalankan jika perkiraan cepat di bawah nilai ini; setiap tabel menyesuaikan batas berdasarkan durasi terukur; 0 menonaktifkan penghitungan tepat; default 1.000.000. Perubahan nilai mengatur ulang status pembelajaran pada akses berikutnya"
"Batch size (rows). Rows per batch for extract, delete, backup and restore; default 5000": "Jumlah baris per batch. Baris per batch untuk ekstraksi, penghapusan, pencadangan, dan pemulihan; default 5000"
"Batch interval (ms). Pause between batches during bulk operations such as batch delete; default 100": "Interval antar batch (ms). Jeda antar batch pada operasi massal seperti penghapusan batch; default 100"
"Schema migration mode. Off: disabled; ReadOnly: check only; On: create missing tables and columns; Full: also alter and drop; default On": "Mode migrasi skema. Off: nonaktif; ReadOnly: hanya pemeriksaan; On: membuat tabel dan kolom yang hilang; Full: juga mengubah dan menghapus; default On"
"Check comments. Synchronizes table and column comments during migration; enabled by default": "Periksa komentar. Menyinkronkan komentar tabel dan kolom selama migrasi; aktif secara default"
"Check added indexes. Creates indexes added to the model during migration; enabled by default": "Periksa indeks yang ditambahkan. Membuat indeks yang ditambahkan ke model selama migrasi; aktif secara default"
"Check removed indexes. Drops indexes removed from the model during migration; enabled by default": "Periksa indeks yang dihapus. Menghapus indeks yang dihapus dari model selama migrasi; aktif secara default"
"Check duplicate indexes. Removes indexes with the same definition but different names during migration; enabled by default": "Periksa indeks duplikat. Menghapus indeks dengan definisi sama tetapi nama berbeda selama migrasi; aktif secara default"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore-separated": "Huruf besar/kecil nama tabel dan kolom. Default: basis data menentukan; None: pertahankan penulisan model; Upper: huruf besar; Lower: huruf kecil; Underline: dipisahkan garis bawah"
"Query cache expiration (s). Caches query results by SQL; 0 disables caching; default 0": "Kedaluwarsa cache kueri (s). Menyimpan hasil kueri dalam cache berdasarkan SQL; 0 menonaktifkan cache; default 0"
"Entity cache expiration (s). Caches the whole entity list; default 10": "Kedaluwarsa cache entitas (s). Menyimpan seluruh daftar entitas dalam cache; default 10"
"Single object cache expiration (s). Caches entities by primary key; default 10": "Kedaluwarsa cache objek tunggal (s). Menyimpan entitas dalam cache berdasarkan kunci utama; default 10"
"Extended property expiration (s). Caches the Extends property; default 10": "Kedaluwarsa properti tambahan (s). Menyimpan properti Extends dalam cache; default 10"
"Field cache expiration (s). Caches grouped values of category fields; default 3600": "Kedaluwarsa cache bidang (s). Menyimpan nilai yang dikelompokkan dari bidang kategori dalam cache; default 3600"
"Cache statistics period (s). Periodically logs statistics of all caches for performance analysis; 0 disables; default 3600": "Periode statistik cache (s). Secara berkala mencatat statistik semua cache ke log untuk analisis kinerja; 0 menonaktifkan; default 3600"

