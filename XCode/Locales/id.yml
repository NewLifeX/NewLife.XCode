"SonnetDB does not support field type {0}.": "SonnetDB tidak mendukung tipe bidang {0}."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING belum mendukung perubahan batasan panjang. Lihat SonnetDB issue #240; kemampuan ini masih perlu diterapkan dan dirilis."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "Mengubah identitas atau kunci utama pada kolom SonnetDB yang ada memerlukan migrasi terpisah dan tidak dapat dilakukan melalui ALTER COLUMN."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER akan kehilangan presisi eksplisit dan ditolak untuk mempertahankan semantik model. Lihat SonnetDB issue #241; masih perlu diperbaiki dan dirilis."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "SonnetDB tertanam membuat database melalui direktori Data Source; konfigurasikan koneksi terpisah untuk direktori target."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "SonnetDB tertanam tidak mendukung penghapusan direktori database melalui SQL."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB belum mendukung penyimpanan komentar tabel dan kolom secara persisten. Lihat SonnetDB issue #237; kemampuan ini harus diterapkan dan dirilis."
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] Bidang {0}.{1} mendeklarasikan panjang {2}, tetapi STRING saat ini tidak mendukung batasan panjang; tertunda, lihat SonnetDB issue #240."
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] Belum selesai {0}: penyimpanan komentar tabel dan kolom belum didukung; SonnetDB harus menerapkan dan merilisnya, lihat issue #237."
