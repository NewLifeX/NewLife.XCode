# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Pengaturan XCode"
"Debug": "Penelusuran kesalahan"
"Output SQL. Whether to output SQL statements, enabled by default": "Output SQL. Apakah pernyataan SQL dikeluarkan, aktif secara default"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Direktori SQL. Direktori terpisah untuk output SQL; kosong secara default sehingga SQL masuk ke log saat ini. Di produksi, gunakan direktori SqlLog khusus di luar situs"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Waktu eksekusi SQL. SQL yang lebih lambat dari ambang ini dalam milidetik dicatat, default 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Panjang SQL maksimum. SQL yang lebih panjang dipotong di log, default 4096; gunakan 0 untuk menonaktifkan pemotongan"
"Parameterized CRUD. Disabled by default": "CRUD berparameter. Nonaktif secara default"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Ukuran batch. Baris per batch untuk ekstraksi, penghapusan, pencadangan, dan pemulihan, default 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Interval batch. Jeda antar batch dalam milidetik, default 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Batas waktu perintah. Batas waktu kueri dalam detik, default 0 (tak terbatas)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Coba lagi saat gagal. Percobaan ulang setelah batas waktu perintah, default 0 (tanpa percobaan ulang)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migrasi. Off: nonaktif; ReadOnly: hanya periksa; On: hanya buat; Full: juga ubah dan hapus"
"Check comments. Table and column comments for migrations, enabled by default": "Periksa komentar. Komentar tabel dan kolom untuk migrasi, aktif secara default"
"Check for dropped indexes. Migration check, enabled by default": "Periksa indeks yang dihapus. Pemeriksaan migrasi, aktif secara default"
"Check for new indexes. Migration check, enabled by default": "Periksa indeks baru. Pemeriksaan migrasi, aktif secara default"
"Check for duplicate indexes. Enabled by default": "Periksa indeks duplikat. Aktif secara default"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Huruf besar/kecil nama tabel dan kolom. Default: database menentukan; None: pertahankan gaya model; Upper: huruf besar; Lower: huruf kecil; Underline: garis bawah"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Ambang hitung penuh. Jumlah baris diperkirakan lebih dulu dari statistik indeks; perkiraan di atas nilai ini digunakan apa adanya, jika tidak count(*) memberikan nilai tepat. Turunkan untuk menghindari akses pertama yang lambat pada tabel besar, naikkan untuk penghitungan tepat. Default 10 juta"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Cache data. Menyimpan cache berdasarkan SQL, default 0 detik"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Kedaluwarsa cache entitas. Menyimpan cache seluruh daftar entitas, default 10 detik"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Kedaluwarsa cache objek tunggal. Menyimpan entitas dalam cache berdasarkan kunci utama, default 10 detik"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Kedaluwarsa properti diperluas. Menyimpan cache properti Extends, default 10 detik"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Kedaluwarsa cache bidang. Menyimpan nilai yang dikelompokkan dari bidang kategori, default 3600 detik"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Periode statistik cache. Interval dalam detik untuk mencatat statistik cache, 0 menonaktifkan, default 3600"

