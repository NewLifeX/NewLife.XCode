# 程序集标题与描述（英文源文 → 印度尼西亚语）
"XCode Super ORM Middleware": "Middleware ORM XCode"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "Middleware data .NET berperforma tinggi (super ORM) yang berfokus pada CRUD dan data masif, dengan cache bertingkat, migrasi otomatis, sharding, kueri bertipe kuat, dan migrasi antar basis data."
"XCode Entity Generator": "Generator entitas XCode"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "Alat baris perintah resmi XCode yang menghasilkan kelas data entitas dan kelas bisnis dari Model.xml, mendukung pemodelan cepat dan iterasi berkelanjutan."
"XCode Presto Adapter": "Adaptor Presto untuk XCode"
"Provides Presto and Trino database driver integration and SQL dialect support for XCode, with automatic modeling migration, cache cooperation and high-performance data access.": "Menyediakan integrasi driver basis data Presto dan Trino serta dukungan dialek SQL untuk XCode, dengan migrasi model otomatis, kerja sama cache, dan akses data berperforma tinggi."
"XCode TDengine Adapter": "Adaptor TDengine untuk XCode"
"Provides TDengine database driver integration and SQL dialect support for XCode, with automatic modeling migration, cache cooperation and high-performance data access.": "Menyediakan integrasi driver basis data TDengine serta dukungan dialek SQL untuk XCode, dengan migrasi model otomatis, kerja sama cache, dan akses data berperforma tinggi."

