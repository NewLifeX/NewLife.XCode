"XCode Super ORM Middleware": "Middleware ORM di XCode"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "Middleware dati .NET ad alte prestazioni (super ORM) incentrato su CRUD e dati massivi, con cache multilivello, migrazione automatica, sharding, query fortemente tipizzate e migrazione tra database."
"XCode Entity Generator": "Generatore di entità XCode"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "Strumento ufficiale da riga di comando di XCode che genera classi di dati delle entità e classi di business da Model.xml, supportando modellazione rapida e iterazione continua."

