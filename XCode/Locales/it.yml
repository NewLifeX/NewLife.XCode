"InfluxDB does not support creating buckets via SQL. Use HTTP API or CLI.": "InfluxDB non supporta la creazione di bucket tramite SQL. Usare l'API HTTP o la CLI."
"InfluxDB does not support dropping buckets via SQL. Use HTTP API or CLI.": "InfluxDB non supporta l'eliminazione di bucket tramite SQL. Usare l'API HTTP o la CLI."
"InfluxDB does not support altering columns.": "InfluxDB non supporta la modifica delle colonne."
"SonnetDB LIMIT/OFFSET currently cannot exceed Int32.MaxValue. See SonnetDB issue #256.": "SonnetDB LIMIT/OFFSET attualmente non può superare Int32.MaxValue. Vedere SonnetDB issue #256."
"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 non può preservare esattamente questo valore Decimal e ha rifiutato la scrittura. Vedere SonnetDB issue #235; il supporto per parametri decimal precisi deve ancora essere implementato e rilasciato."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT usa Int64 con segno e supporta solo valori UInt64 fino a Int64.MaxValue."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME può preservare solo la precisione al millisecondo e ha rifiutato orari inferiori al millisecondo. Vedere SonnetDB issue #236; il supporto completo della precisione temporale deve ancora essere implementato e rilasciato."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "L'eliminazione massiva limitata in SonnetDB attualmente richiede una chiave primaria a colonna singola; le tabelle con chiave primaria composta o senza chiave primaria non possono ricorrere all'eliminazione illimitata. Vedere SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB non fornisce ancora la semantica completa di questo livello di isolamento delle transazioni; usare ReadCommitted. Vedere SonnetDB issue #225."
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "Il risultato di SonnetDB non identifica le colonne di identità, quindi il numero generato non può essere ottenuto in modo sicuro. Aggiornare a una versione di SonnetDB che includa i metadati delle colonne RETURNING."
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB non supporta ancora la semantica Replace di eliminazione delle righe in conflitto e inserimento di nuove righe. Vedere SonnetDB issue #242."
"Bulk write must contain at least one field.": "La scrittura in blocco deve contenere almeno un campo."
"SonnetDB Upsert requires a primary key or a complete unique-index conflict target.": "SonnetDB Upsert richiede una chiave primaria o una destinazione di conflitto di indice univoco completa."
"SonnetDB field type has not been mapped: {0}": "Il tipo di campo SonnetDB non è stato mappato: {0}"
