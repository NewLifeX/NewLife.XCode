# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Impostazioni XCode"
"Debug": "Modalità debug"
"Output SQL. Whether to output SQL statements, enabled by default": "Output SQL. Indica se generare le istruzioni SQL, attivo per impostazione predefinita"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Directory SQL. Directory separata per l'output SQL; vuota per impostazione predefinita, quindi l'SQL va nel log corrente. In produzione, usare una directory SqlLog dedicata fuori dal sito"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Tempo di esecuzione SQL. L'SQL più lento di questa soglia in millisecondi viene registrato, predefinito 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Lunghezza massima SQL. L'SQL più lungo viene troncato nei log, predefinito 4096; usare 0 per disattivare il troncamento"
"Parameterized CRUD. Disabled by default": "CRUD parametrizzato. Disattivato per impostazione predefinita"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Dimensione batch. Righe per batch per estrazione, eliminazione, backup e ripristino, predefinito 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Intervallo batch. Pausa tra i batch in millisecondi, predefinito 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Timeout comando. Timeout delle query in secondi, predefinito 0 (illimitato)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Ritenta in caso di errore. Numero di tentativi dopo un timeout, predefinito 0 (nessun tentativo)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migrazione. Off: disattivata; ReadOnly: solo verifica; On: solo creazione; Full: anche modifica ed eliminazione"
"Check comments. Table and column comments for migrations, enabled by default": "Verifica commenti. Commenti di tabelle e colonne per le migrazioni, attivo per impostazione predefinita"
"Check for dropped indexes. Migration check, enabled by default": "Verifica indici rimossi. Controllo di migrazione, attivo per impostazione predefinita"
"Check for new indexes. Migration check, enabled by default": "Verifica nuovi indici. Controllo di migrazione, attivo per impostazione predefinita"
"Check for duplicate indexes. Enabled by default": "Verifica indici duplicati. Attivo per impostazione predefinita"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Maiuscole/minuscole di tabelle e colonne. Default: decide il database; None: mantieni il formato del modello; Upper: maiuscole; Lower: minuscole; Underline: trattino basso"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Soglia di conteggio completo. I conteggi delle righe sono stimati prima tramite le statistiche degli indici; le stime superiori a questo valore vengono usate così come sono, altrimenti count(*) restituisce il valore esatto. Ridurla per evitare primi accessi lenti su tabelle grandi, aumentarla per conteggi esatti. Predefinito 10 milioni"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Cache dati. Memorizza in cache per SQL, predefinito 0 secondi"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Scadenza cache entità. Memorizza in cache l'intero elenco di entità, predefinito 10 secondi"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Scadenza cache oggetto singolo. Memorizza in cache le entità per chiave primaria, predefinito 10 secondi"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Scadenza proprietà estese. Memorizza in cache la proprietà Extends, predefinito 10 secondi"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Scadenza cache campi. Memorizza in cache i valori raggruppati dei campi di categoria, predefinito 3600 secondi"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Periodo statistiche cache. Intervallo in secondi per registrare le statistiche della cache, 0 disattiva, predefinito 3600"

