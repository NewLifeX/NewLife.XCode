"SonnetDB view [{0}] field [{1}] did not provide a mappable declared type. See SonnetDB issue #261; view declaration metadata still needs to be completed and released.": "Il campo [{1}] della vista SonnetDB [{0}] non ha fornito un tipo dichiarato mappabile. Vedere SonnetDB issue #261; i metadati della dichiarazione della vista devono ancora essere completati e rilasciati."
"SonnetDB does not support field type {0}.": "SonnetDB non supporta il tipo di campo {0}."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING non supporta ancora la modifica dei vincoli di lunghezza. Vedere SonnetDB issue #240; la funzionalità deve ancora essere implementata e rilasciata."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "La modifica dell'identità o della chiave primaria nelle colonne SonnetDB esistenti richiede una migrazione separata e non può essere eseguita tramite ALTER COLUMN."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER perderebbe la precisione esplicita ed è stato rifiutato per preservare la semantica del modello. Vedere SonnetDB issue #241; deve ancora essere corretto e rilasciato."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "SonnetDB incorporato crea database tramite la directory Data Source; configurare una connessione separata per la directory di destinazione."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "SonnetDB incorporato non supporta l'eliminazione della directory del database tramite SQL."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB non supporta ancora la persistenza dei commenti di tabelle e colonne. Vedere SonnetDB issue #237; la funzionalità deve essere implementata e rilasciata."
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] Il campo {0}.{1} dichiara la lunghezza {2}, ma STRING attualmente non supporta i vincoli di lunghezza; in sospeso, vedere SonnetDB issue #240."
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] Incompleto {0}: la persistenza dei commenti di tabelle e colonne non è ancora supportata; SonnetDB deve implementarla e rilasciarla, vedere issue #237."
