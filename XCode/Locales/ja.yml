# 日本語 词表（ja）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "リレーションキーが設定されていません。"
"No master field is set.": "マスターフィールドが設定されていません。"
"Entity class [{0}] must implement [{1}].": "エンティティクラス [{0}] は [{1}] を実装する必要があります。"
"No model file was found.": "モデルファイルが見つかりませんでした。"
"The specified model file does not exist.": "指定されたモデルファイルが存在しません。"
"[{0}] no connection string is specified!": "[{0}] 接続文字列が指定されていません！"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "ドライバー [{0}] を読み込めません。NuGet からデータベースドライバーパッケージを追加してください。"
"Detected secondary cache version change {0} => {1}; expiring local cache": "セカンダリキャッシュのバージョン変更を検出しました {0} => {1}。ローカルキャッシュを期限切れにします"
"Updating (#{0}), reason: {1}": "更新中（#{0}）、理由: {1}"
"Completed [{0}] (#{1})": "完了 [{0}]（#{1}）"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "キャッシュを強制クリアしました。次回アクセス時は同期更新を待機してブロックします"
"Cache cleared without force; the next access updates asynchronously without blocking": "キャッシュを非強制でクリアしました。次回アクセス時はブロックせず非同期に更新します"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "オブジェクトキャッシュ<{0}>が満杯です。{1:n0}>{2:n0}、[{3:n0}]件を削除しました"
"Clearing single-object cache, reason: {0}, Using = false": "単一オブジェクトキャッシュをクリア中、理由: {0}、Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: [{0}] のキャッシュバージョンを {1} => {2} に増加、理由={3}"
"No string primary key is defined for [{0}].": "[{0}] に文字列型の主キーが定義されていません。"
"Table [{0}] has no unique primary key and cannot be used for caching.": "テーブル[{0}]には一意の主キーがないため、キャッシュに使用できません。"
"Entity queue [{0}/{1}] saving {2:n0}, estimated {3:n0}ms": "エンティティキュー[{0}/{1}] 保存 {2:n0}、推定 {3:n0}ms"
