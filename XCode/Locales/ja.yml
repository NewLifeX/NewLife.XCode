# 程序集标题与描述（英文源文 → 日文）
"XCode Super ORM Middleware": "XCode スーパー ORM ミドルウェア"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "CRUD と大規模データに特化した高性能 .NET データミドルウェア（スーパー ORM）。多層キャッシュ、自動マイグレーション、シャーディング、強い型付けのクエリ、データベース間マイグレーションを備えます。"
"XCode Entity Generator": "XCode エンティティジェネレーター"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "Model.xml からエンティティデータクラスとビジネスクラスを生成する XCode 公式コマンドラインツール。迅速なモデリングと継続的な反復を支援します。"

