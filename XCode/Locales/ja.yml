"Output SQL. Whether to output SQL statements, enabled by default": "SQL 出力。SQL ステートメントを出力するかどうか。既定で有効"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL ディレクトリ。SQL 出力専用のディレクトリ。既定では空で、SQL は現在のログに出力されます。運用環境ではサイト外の専用 SqlLog ディレクトリを使用してください"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL 実行時間。このしきい値（ミリ秒）より遅い SQL をログに出力します。既定値は 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "SQL 最大長。これを超える SQL はログで切り詰められます。既定値は 4096。0 で切り詰めを無効にします"
"Parameterized CRUD. Disabled by default": "パラメーター化 CRUD。既定では無効"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "バッチ サイズ。抽出、削除、バックアップ、復元のバッチあたりの行数。既定値は 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "バッチ間隔。バッチ間の一時停止（ミリ秒）。既定値は 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "コマンド タイムアウト。クエリのタイムアウト（秒）。既定値は 0（無制限）"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "失敗時の再試行。コマンド タイムアウト後の再試行回数。既定値は 0（再試行なし）"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "マイグレーション。Off: 無効、ReadOnly: 確認のみ、On: 作成のみ、Full: 変更と削除も実行"
"Check comments. Table and column comments for migrations, enabled by default": "コメントを確認。マイグレーション時のテーブルと列のコメント。既定で有効"
"Check for dropped indexes. Migration check, enabled by default": "削除されたインデックスを確認。マイグレーション確認。既定で有効"
"Check for new indexes. Migration check, enabled by default": "新しいインデックスを確認。マイグレーション確認。既定で有効"
"Check for duplicate indexes. Enabled by default": "重複インデックスを確認。既定で有効"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "テーブル名と列名の大文字小文字。Default: データベースに任せる、None: モデルの表記を維持、Upper: 大文字、Lower: 小文字、Underline: アンダースコア"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "全件カウントのしきい値。まずインデックス統計から行数を推定し、この値を超える推定値はそのまま使用します。それ以外は count(*) で正確な値を取得します。大きなテーブルで初回アクセスが遅い場合は下げ、正確な件数が必要な場合は上げてください。既定値は 1000 万"
"Cache": "キャッシュ"
"Data cache. Caches by SQL, default 0 seconds": "データ キャッシュ。SQL 単位でキャッシュします。既定値は 0 秒"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "エンティティ キャッシュの有効期限。エンティティ一覧全体をキャッシュします。既定値は 10 秒"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "単一オブジェクト キャッシュの有効期限。主キー単位でエンティティをキャッシュします。既定値は 10 秒"
"Extended property expiration. Caches the Extends property, default 10 seconds": "拡張プロパティの有効期限。Extends プロパティをキャッシュします。既定値は 10 秒"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "フィールド キャッシュの有効期限。分類フィールドのグループ値をキャッシュします。既定値は 3600 秒"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "キャッシュ統計の期間。キャッシュ統計をログに出力する間隔（秒）。0 で無効、既定値は 3600"

