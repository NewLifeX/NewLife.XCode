"Unable to obtain the entity factory: {0}": "엔터티 팩터리를 가져올 수 없습니다: {0}"
"Field [{0}] was not found on entity {1}.": "엔터티 {1}에서 필드 [{0}]을(를) 찾을 수 없습니다."
"Unable to parse expression [{0}].": "식 [{0}]을(를) 구문 분석할 수 없습니다."
"Field [{0}] in expression [{1}] was not recognized; entity class [{2}] does not contain this field.": "식 [{1}]의 필드 [{0}]이(가) 인식되지 않았습니다. 엔터티 클래스 [{2}]에 이 필드가 없습니다."
"The shard policy cannot recognize data [{0}].": "분할 정책이 데이터 [{0}]을(를) 인식할 수 없습니다."
"The time shard policy does not support fields of type [{0}].": "시간 분할 정책은 [{0}] 형식의 필드를 지원하지 않습니다."
"Execution error [{0}].": "실행 오류 [{0}]."
"Parent [{0}] is a descendant of the current node!": "상위 [{0}]이(가) 현재 노드의 하위 항목입니다!"
"Generating Cube area {0} {1}": "Cube 영역 {0} {1} 생성 중"
