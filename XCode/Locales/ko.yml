"InfluxDB does not support altering columns.": "InfluxDB는 열 변경을 지원하지 않습니다."
"SonnetDB LIMIT/OFFSET currently cannot exceed Int32.MaxValue. See SonnetDB issue #256.": "SonnetDB LIMIT/OFFSET은(는) 현재 Int32.MaxValue를 초과할 수 없습니다. SonnetDB issue #256을 참조하세요."
"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0은(는) 이 Decimal 값을 정확하게 보존할 수 없어 쓰기를 거부했습니다. SonnetDB issue #235를 참조하세요. 정확한 decimal 매개 변수 지원은 아직 구현 및 릴리스해야 합니다."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT은(는) 부호 있는 Int64를 사용하며 Int64.MaxValue까지의 UInt64 값만 지원합니다."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME은(는) 밀리초 정밀도만 보존할 수 있어 1밀리초 미만의 시간을 거부했습니다. SonnetDB issue #236을 참조하세요. 전체 시간 정밀도 지원은 아직 구현 및 릴리스해야 합니다."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "SonnetDB의 제한된 대량 삭제는 현재 단일 열 기본 키가 필요합니다. 복합 기본 키가 있거나 기본 키가 없는 테이블은 무제한 삭제로 대체할 수 없습니다. SonnetDB issue #243을 참조하세요."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB는 이 트랜잭션 격리 수준의 전체 의미 체계를 아직 제공하지 않습니다. ReadCommitted를 사용하세요. SonnetDB issue #225를 참조하세요."
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "SonnetDB 결과가 ID 열을 식별하지 않으므로 생성된 번호를 안전하게 가져올 수 없습니다. RETURNING 열 메타데이터가 포함된 SonnetDB 버전으로 업그레이드하세요."
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB는 충돌하는 행을 삭제한 후 새 행을 삽입하는 Replace 의미 체계를 아직 지원하지 않습니다. SonnetDB issue #242를 참조하세요."
"Bulk write must contain at least one field.": "대량 쓰기에는 필드가 하나 이상 포함되어야 합니다."
"SonnetDB Upsert requires a primary key or a complete unique-index conflict target.": "SonnetDB Upsert에는 기본 키 또는 완전한 고유 인덱스 충돌 대상이 필요합니다."
"SonnetDB field type has not been mapped: {0}": "SonnetDB 필드 형식이 매핑되지 않았습니다: {0}"
"SonnetDB view [{0}] did not provide field metadata.": "SonnetDB 뷰 [{0}]이(가) 필드 메타데이터를 제공하지 않았습니다."
"SonnetDB view [{0}] field [{1}] did not provide a mappable declared type. See SonnetDB issue #261; view declaration metadata still needs to be completed and released.": "SonnetDB 뷰 [{0}]의 필드 [{1}]이(가) 매핑 가능한 선언 형식을 제공하지 않았습니다. SonnetDB issue #261을 참조하세요. 뷰 선언 메타데이터는 아직 완성 및 릴리스해야 합니다."
"SonnetDB does not support field type {0}.": "SonnetDB는 필드 형식 {0}을(를) 지원하지 않습니다."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING은(는) 길이 제약 조건 변경을 아직 지원하지 않습니다. SonnetDB issue #240을 참조하세요. 이 기능은 아직 구현 및 릴리스해야 합니다."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "기존 SonnetDB 열의 ID 또는 기본 키를 변경하려면 별도 마이그레이션이 필요하며 ALTER COLUMN으로 수행할 수 없습니다."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER는 명시적 정밀도를 잃게 되므로 모델 의미 체계를 보존하기 위해 거부되었습니다. SonnetDB issue #241을 참조하세요. 아직 수정 및 릴리스해야 합니다."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "포함된 SonnetDB는 Data Source 디렉터리를 통해 데이터베이스를 만듭니다. 대상 디렉터리에 별도 연결을 구성하세요."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "포함된 SonnetDB는 SQL을 통한 데이터베이스 디렉터리 삭제를 지원하지 않습니다."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB는 테이블 및 열 주석 지속성을 아직 지원하지 않습니다. SonnetDB issue #237을 참조하세요. 이 기능은 구현 및 릴리스해야 합니다."
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] 필드 {0}.{1}이(가) 길이 {2}을(를) 선언했지만 STRING은 현재 길이 제약 조건을 지원하지 않습니다. 보류 중, SonnetDB issue #240을 참조하세요."
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] 미완료 {0}: 테이블 및 열 주석 지속성이 아직 지원되지 않습니다. SonnetDB가 이를 구현 및 릴리스해야 합니다. issue #237을 참조하세요."
"The current SQLite driver does not support BackupDatabase: {0}": "현재 SQLite 드라이버는 BackupDatabase를 지원하지 않습니다: {0}"
"The paging algorithm requires a sort column! {0}": "페이징 알고리즘에는 정렬 열이 필요합니다! {0}"
"[{0}]VastBase Search Path(Schema): {1}": "[{0}]VastBase 검색 경로(Schema): {1}"
"Unsupported mode [{0}].": "지원되지 않는 모드 [{0}]."
"The database does not support array types.": "데이터베이스는 배열 형식을 지원하지 않습니다."
"The TopNotIn paging algorithm requires a single primary key column! {0}": "TopNotIn 페이징 알고리즘에는 단일 기본 키 열이 필요합니다! {0}"
"The DoubleTop paging algorithm requires a sort column! {0}": "DoubleTop 페이징 알고리즘에는 정렬 열이 필요합니다! {0}"
"Upsert encountered an identity field with mixed zero and non-zero values and cannot support both Insert and Update.": "Upsert에서 ID 필드에 0 값과 0이 아닌 값이 혼합되어 있어 Insert와 Update를 모두 지원할 수 없습니다."
"InfluxDB does not support transactions.": "InfluxDB는 트랜잭션을 지원하지 않습니다."
"Token is required in connection string.": "연결 문자열에 Token이 필요합니다."
"Organization is required in connection string.": "연결 문자열에 Organization이 필요합니다."
"Bucket is required in connection string.": "연결 문자열에 Bucket이 필요합니다."
"Invalid row position.": "행 위치가 잘못되었습니다."
