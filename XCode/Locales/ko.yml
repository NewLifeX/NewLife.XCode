# 한국어 词表（ko）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "관계 키가 설정되지 않았습니다."
"No master field is set.": "마스터 필드가 설정되지 않았습니다."
"Entity class [{0}] must implement [{1}].": "엔터티 클래스 [{0}]은(는) [{1}]을(를) 구현해야 합니다."
"No model file was found.": "모델 파일을 찾지 못했습니다."
"The specified model file does not exist.": "지정한 모델 파일이 존재하지 않습니다."
"[{0}] no connection string is specified!": "[{0}] 연결 문자열이 지정되지 않았습니다!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "드라이버 [{0}]을(를) 로드할 수 없습니다. NuGet에서 데이터베이스 드라이버 패키지를 추가하세요."
"Detected secondary cache version change {0} => {1}; expiring local cache": "보조 캐시 버전 변경 감지 {0} => {1}; 로컬 캐시를 만료합니다"
"Updating (#{0}), reason: {1}": "업데이트 중 (#{0}), 이유: {1}"
"Completed [{0}] (#{1})": "완료 [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "캐시를 강제로 지웠습니다. 다음 액세스는 동기 업데이트를 기다리며 차단됩니다"
"Cache cleared without force; the next access updates asynchronously without blocking": "캐시를 강제하지 않고 지웠습니다. 다음 액세스는 차단 없이 비동기로 업데이트됩니다"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "개체 캐시 <{0}>이(가) 가득 찼습니다. {1:n0}>{2:n0}, [{3:n0}]개를 제거했습니다"
"Clearing single-object cache, reason: {0}, Using = false": "단일 개체 캐시를 지우는 중, 이유: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: [{0}]의 캐시 버전을 {1} => {2}(으)로 증가, 이유={3}"
"No string primary key is defined for [{0}].": "[{0}]에 문자열 형식의 기본 키가 정의되어 있지 않습니다."
"Table [{0}] has no unique primary key and cannot be used for caching.": "테이블 [{0}]에는 고유 기본 키가 없어 캐싱에 사용할 수 없습니다."
"Entity queue [{0}/{1}] saving {2:n0}, estimated {3:n0}ms": "엔터티 큐 [{0}/{1}] 저장 {2:n0}, 예상 {3:n0}ms"
"Entity queue of [{0}] overflowed; exceeded the maximum of {1:n0}.": "엔터티 큐 [{0}]이(가) 오버플로되었습니다. 최대값 {1:n0}을(를) 초과했습니다."
"Entity queue of [{0}] still has [{1:n0}] items unsaved on dispose.": "엔터티 큐 [{0}]을(를) 삭제할 때 아직 [{1:n0}]개 항목이 저장되지 않았습니다."
"Entity queue [{0}/{1}] saved {2:n0}, elapsed {3:n0}ms, speed {4:n0}tps, period {5:n0}ms": "엔터티 큐 [{0}/{1}] {2:n0}개 저장, 경과 {3:n0}ms, 속도 {4:n0}tps, 주기 {5:n0}ms"
"Set the connection string for [{0}] before using the database.": "데이터베이스를 사용하기 전에 [{0}]의 연결 문자열을 설정하십시오."
"AppDomain.CurrentDomain.FriendlyName is awkward; normalized to: {0}": "AppDomain.CurrentDomain.FriendlyName이(가) 적절하지 않아 정규화했습니다: {0}"
"Failed to initialize data! {0}": "데이터 초기화에 실패했습니다! {0}"
"DDL mode [{0}]; create table [{1}] manually:{2}{3}": "DDL 모드 [{0}]; 테이블 [{1}]을(를) 수동으로 생성하십시오:{2}{3}"
"DDL mode [{0}]; alter table [{1}] manually:{2}{3}": "DDL 모드 [{0}]; 테이블 [{1}]을(를) 수동으로 변경하십시오:{2}{3}"
"Entity class [{0}] does not contain sort field [{1}].": "엔터티 클래스 [{0}]에 정렬 필드 [{1}]이(가) 없습니다."
"[{0}/{1}@{2}] is limited to {3} characters [{4}={5}]": "[{0}/{1}@{2}]은(는) {3}자로 제한됩니다 [{4}={5}]"
"[{0}/{1}@{2}] is limited to {3} characters": "[{0}/{1}@{2}]은(는) {3}자로 제한됩니다"
"Write-only log data [{0}] cannot be modified.": "쓰기 전용 로그 데이터 [{0}]은(는) 수정할 수 없습니다."
"Write-only log data [{0}] cannot be deleted.": "쓰기 전용 로그 데이터 [{0}]은(는) 삭제할 수 없습니다."
"FindByKey requires [{0}] to have a unique key.": "FindByKey를 사용하려면 [{0}]에 고유 키가 있어야 합니다."
"Property [{0}] does not exist on class [{1}].": "클래스 [{1}]에 속성 [{0}]이(가) 없습니다."
"Data connection [{0}] is read-only; {1} is not allowed.": "데이터 연결 [{0}]은(는) 읽기 전용입니다. {1}은(는) 허용되지 않습니다."
"ValueTuple type [{0}] is not supported.": "ValueTuple 형식 [{0}]은(는) 지원되지 않습니다."
"Cannot update the entity because no primary key is marked and no where condition is specified.": "기본 키가 표시되지 않았고 where 조건도 지정되지 않아 엔터티를 업데이트할 수 없습니다."
"Invalid connection name [{0}].": "잘못된 연결 이름 [{0}]입니다."
"The ADO.NET driver for {0} was not found; reference it from NuGet.": "{0}용 ADO.NET 드라이버를 찾을 수 없습니다. NuGet에서 참조하십시오."
"File [{0}] is missing!": "파일 [{0}]이(가) 없습니다!"
