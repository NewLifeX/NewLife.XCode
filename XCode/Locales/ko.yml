# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "XCode 설정"
"Debug": "디버깅"
"Output SQL. Whether to output SQL statements, enabled by default": "SQL 출력. SQL 문을 출력할지 여부이며 기본적으로 사용합니다"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL 디렉터리. SQL 출력용 별도 디렉터리입니다. 기본값은 비어 있어 SQL이 현재 로그에 기록됩니다. 프로덕션에서는 사이트 외부의 전용 SqlLog 디렉터리를 사용하세요"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL 실행 시간. 이 임계값(밀리초)보다 느린 SQL을 기록합니다. 기본값 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "최대 SQL 길이. 더 긴 SQL은 로그에서 잘립니다. 기본값 4096, 0이면 자르지 않습니다"
"Parameterized CRUD. Disabled by default": "매개 변수화된 CRUD. 기본적으로 사용 안 함"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "일괄 처리 크기. 추출, 삭제, 백업, 복원 시 일괄 처리당 행 수입니다. 기본값 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "일괄 처리 간격. 일괄 처리 사이의 일시 중지(밀리초)입니다. 기본값 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "명령 시간 제한. 쿼리 시간 제한(초)입니다. 기본값 0(무제한)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "실패 시 다시 시도. 명령 시간 제한 후 다시 시도 횟수입니다. 기본값 0(다시 시도 안 함)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "마이그레이션. Off: 사용 안 함, ReadOnly: 확인만, On: 만들기만, Full: 변경 및 삭제도 수행"
"Check comments. Table and column comments for migrations, enabled by default": "주석 확인. 마이그레이션 시 테이블 및 열 주석을 확인합니다. 기본적으로 사용"
"Check for dropped indexes. Migration check, enabled by default": "삭제된 인덱스 확인. 마이그레이션 확인이며 기본적으로 사용합니다"
"Check for new indexes. Migration check, enabled by default": "새 인덱스 확인. 마이그레이션 확인이며 기본적으로 사용합니다"
"Check for duplicate indexes. Enabled by default": "중복 인덱스 확인. 기본적으로 사용"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "테이블 및 열 이름의 대/소문자. Default: 데이터베이스가 결정, None: 모델 표기 유지, Upper: 대문자, Lower: 소문자, Underline: 밑줄"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "전체 개수 임계값. 행 수는 먼저 인덱스 통계로 추정하며, 이 값보다 큰 추정치는 그대로 사용하고 그렇지 않으면 count(*)로 정확한 값을 구합니다. 큰 테이블의 느린 첫 액세스를 피하려면 낮추고, 정확한 개수가 필요하면 높이세요. 기본값 1000만"
"Cache": "캐시"
"Data cache. Caches by SQL, default 0 seconds": "데이터 캐시. SQL 기준으로 캐시합니다. 기본값 0초"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "엔터티 캐시 만료. 전체 엔터티 목록을 캐시합니다. 기본값 10초"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "단일 개체 캐시 만료. 기본 키 기준으로 엔터티를 캐시합니다. 기본값 10초"
"Extended property expiration. Caches the Extends property, default 10 seconds": "확장 속성 만료. Extends 속성을 캐시합니다. 기본값 10초"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "필드 캐시 만료. 범주 필드의 그룹화된 값을 캐시합니다. 기본값 3600초"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "캐시 통계 주기. 캐시 통계를 기록하는 간격(초)입니다. 0이면 사용 안 함, 기본값 3600"

