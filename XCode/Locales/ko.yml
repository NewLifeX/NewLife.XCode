# 한국어 词表（ko）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "관계 키가 설정되지 않았습니다."
"No master field is set.": "마스터 필드가 설정되지 않았습니다."
"Entity class [{0}] must implement [{1}].": "엔터티 클래스 [{0}]은(는) [{1}]을(를) 구현해야 합니다."
"No model file was found.": "모델 파일을 찾지 못했습니다."
"The specified model file does not exist.": "지정한 모델 파일이 존재하지 않습니다."
"[{0}] no connection string is specified!": "[{0}] 연결 문자열이 지정되지 않았습니다!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "드라이버 [{0}]을(를) 로드할 수 없습니다. NuGet에서 데이터베이스 드라이버 패키지를 추가하세요."
"Detected secondary cache version change {0} => {1}; expiring local cache": "보조 캐시 버전 변경 감지 {0} => {1}; 로컬 캐시를 만료합니다"
"Updating (#{0}), reason: {1}": "업데이트 중 (#{0}), 이유: {1}"
"Completed [{0}] (#{1})": "완료 [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "캐시를 강제로 지웠습니다. 다음 액세스는 동기 업데이트를 기다리며 차단됩니다"
"Cache cleared without force; the next access updates asynchronously without blocking": "캐시를 강제하지 않고 지웠습니다. 다음 액세스는 차단 없이 비동기로 업데이트됩니다"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "개체 캐시 <{0}>이(가) 가득 찼습니다. {1:n0}>{2:n0}, [{3:n0}]개를 제거했습니다"
"Clearing single-object cache, reason: {0}, Using = false": "단일 개체 캐시를 지우는 중, 이유: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: [{0}]의 캐시 버전을 {1} => {2}(으)로 증가, 이유={3}"
"No string primary key is defined for [{0}].": "[{0}]에 문자열 형식의 기본 키가 정의되어 있지 않습니다."
"Table [{0}] has no unique primary key and cannot be used for caching.": "테이블 [{0}]에는 고유 기본 키가 없어 캐싱에 사용할 수 없습니다."
