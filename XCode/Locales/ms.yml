# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Tetapan XCode"
"Debug": "Penyahpepijatan"
"Output SQL. Whether to output SQL statements, enabled by default": "Output SQL. Sama ada mengeluarkan pernyataan SQL, didayakan secara lalai"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Direktori SQL. Direktori berasingan untuk output SQL; kosong secara lalai supaya SQL ditulis ke log semasa. Dalam pengeluaran, gunakan direktori SqlLog khusus di luar tapak"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Masa pelaksanaan SQL. SQL yang lebih perlahan daripada ambang ini dalam milisaat direkodkan, lalai 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Panjang SQL maksimum. SQL yang lebih panjang dipotong dalam log, lalai 4096; gunakan 0 untuk melumpuhkan pemotongan"
"Parameterized CRUD. Disabled by default": "CRUD berparameter. Dilumpuhkan secara lalai"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Saiz kelompok. Baris setiap kelompok untuk pengekstrakan, pemadaman, sandaran dan pemulihan, lalai 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Selang kelompok. Jeda antara kelompok dalam milisaat, lalai 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Tamat masa arahan. Tamat masa pertanyaan dalam saat, lalai 0 (tanpa had)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Cuba semula apabila gagal. Cubaan semula selepas tamat masa arahan, lalai 0 (tiada cubaan semula)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migrasi. Off: dilumpuhkan; ReadOnly: semak sahaja; On: cipta sahaja; Full: ubah dan padam juga"
"Check comments. Table and column comments for migrations, enabled by default": "Semak komen. Komen jadual dan lajur untuk migrasi, didayakan secara lalai"
"Check for dropped indexes. Migration check, enabled by default": "Semak indeks yang dipadam. Semakan migrasi, didayakan secara lalai"
"Check for new indexes. Migration check, enabled by default": "Semak indeks baharu. Semakan migrasi, didayakan secara lalai"
"Check for duplicate indexes. Enabled by default": "Semak indeks pendua. Didayakan secara lalai"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Huruf besar/kecil nama jadual dan lajur. Default: pangkalan data menentukan; None: kekalkan gaya model; Upper: huruf besar; Lower: huruf kecil; Underline: garis bawah"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Ambang kiraan penuh. Bilangan baris dianggarkan dahulu daripada statistik indeks; anggaran melebihi nilai ini digunakan sebagaimana adanya, jika tidak count(*) memberikan nilai tepat. Turunkan untuk mengelakkan akses pertama yang perlahan pada jadual besar, naikkan untuk kiraan tepat. Lalai 10 juta"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Cache data. Cache mengikut SQL, lalai 0 saat"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Tamat tempoh cache entiti. Cache keseluruhan senarai entiti, lalai 10 saat"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Tamat tempoh cache objek tunggal. Cache entiti mengikut kunci utama, lalai 10 saat"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Tamat tempoh sifat lanjutan. Cache sifat Extends, lalai 10 saat"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Tamat tempoh cache medan. Cache nilai berkumpulan medan kategori, lalai 3600 saat"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Tempoh statistik cache. Selang dalam saat untuk merekod statistik cache, 0 melumpuhkan, lalai 3600"

