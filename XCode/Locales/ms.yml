"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 tidak dapat mengekalkan nilai Decimal ini dengan tepat dan menolak penulisan. Lihat SonnetDB issue #235; sokongan parameter decimal yang tepat masih perlu dilaksanakan dan dikeluarkan."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT menggunakan Int64 bertanda dan hanya menyokong nilai UInt64 sehingga Int64.MaxValue."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME hanya boleh mengekalkan ketepatan milisaat dan menolak masa di bawah satu milisaat. Lihat SonnetDB issue #236; sokongan ketepatan masa penuh masih perlu dilaksanakan dan dikeluarkan."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "Pemadaman pukal terhad dalam SonnetDB pada masa ini memerlukan kunci utama satu lajur; jadual dengan kunci utama komposit atau tanpa kunci utama tidak boleh beralih kepada pemadaman tanpa had. Lihat SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB belum menyediakan semantik penuh tahap pengasingan transaksi ini; gunakan ReadCommitted. Lihat SonnetDB issue #225."
