# Bahasa Melayu 词表（ms）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "Tiada kunci hubungan ditetapkan."
"No master field is set.": "Tiada medan induk ditetapkan."
"Entity class [{0}] must implement [{1}].": "Kelas entiti [{0}] mesti melaksanakan [{1}]."
"No model file was found.": "Tiada fail model ditemui."
"The specified model file does not exist.": "Fail model yang ditentukan tidak wujud."
"[{0}] no connection string is specified!": "[{0}] tiada rentetan sambungan ditentukan!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "Tidak dapat memuatkan pemacu [{0}]; tambah pakej pemacu pangkalan data daripada NuGet."
"Detected secondary cache version change {0} => {1}; expiring local cache": "Perubahan versi cache sekunder dikesan {0} => {1}; cache setempat akan tamat tempoh"
"Updating (#{0}), reason: {1}": "Mengemas kini (#{0}), sebab: {1}"
"Completed [{0}] (#{1})": "Selesai [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "Cache dikosongkan secara paksa; akses seterusnya akan menyekat dan menunggu kemas kini segerak"
"Cache cleared without force; the next access updates asynchronously without blocking": "Cache dikosongkan tanpa paksa; akses seterusnya dikemas kini secara tak segerak tanpa menyekat"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "Cache objek <{0}> penuh, {1:n0}>{2:n0}, [{3:n0}] dialih keluar"
"Clearing single-object cache, reason: {0}, Using = false": "Mengosongkan cache objek tunggal, sebab: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: menambah versi cache bagi [{0}], {1} => {2}, sebab={3}"
"No string primary key is defined for [{0}].": "Tiada kunci primer rentetan ditentukan untuk [{0}]."
"Table [{0}] has no unique primary key and cannot be used for caching.": "Jadual [{0}] tiada kunci primer unik dan tidak boleh digunakan untuk cache."
