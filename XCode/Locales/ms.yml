"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER akan kehilangan ketepatan eksplisit dan ditolak untuk mengekalkan semantik model. Lihat SonnetDB issue #241; masih perlu dibetulkan dan dikeluarkan."
