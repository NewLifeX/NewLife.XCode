"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB belum menyokong semantik Replace iaitu memadam baris bercanggah dan memasukkan baris baharu. Lihat SonnetDB issue #242."
