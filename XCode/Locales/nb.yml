"XCode settings": "XCode-innstillinger"
"Debug": "Feilsøking"
"Output SQL. Whether to output SQL statements, enabled by default": "SQL-utdata. Om SQL-setninger sendes ut, aktivert som standard"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL-mappe. Egen mappe for SQL-utdata; tom som standard slik at SQL går til gjeldende logg. Bruk i produksjon en egen SqlLog-mappe utenfor nettstedet"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL-kjøretid. SQL som er tregere enn denne terskelen i millisekunder logges, standard 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Maksimal SQL-lengde. Lengre SQL avkortes i logger, standard 4096; bruk 0 for å deaktivere avkorting"
"Parameterized CRUD. Disabled by default": "Parametrisert CRUD. Deaktivert som standard"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Partistørrelse. Rader per parti for uttrekk, sletting, sikkerhetskopi og gjenoppretting, standard 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Partiintervall. Pause mellom partier i millisekunder, standard 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Kommandotidsavbrudd. Spørringstidsavbrudd i sekunder, standard 0 (ubegrenset)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Prøv på nytt ved feil. Nye forsøk etter et kommandotidsavbrudd, standard 0 (ingen nye forsøk)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migrering. Off: deaktivert; ReadOnly: bare kontroller; On: bare opprett; Full: også endre og slett"
"Check comments. Table and column comments for migrations, enabled by default": "Kontroller kommentarer. Tabell- og kolonnekkommentarer for migreringer, aktivert som standard"
"Check for dropped indexes. Migration check, enabled by default": "Kontroller slettede indekser. Migreringskontroll, aktivert som standard"
"Check for new indexes. Migration check, enabled by default": "Kontroller nye indekser. Migreringskontroll, aktivert som standard"
"Check for duplicate indexes. Enabled by default": "Kontroller dupliserte indekser. Aktivert som standard"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Store/små bokstaver i tabell- og kolonnenavn. Default: databasen bestemmer; None: behold modellens skrivemåte; Upper: store bokstaver; Lower: små bokstaver; Underline: understrek"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Terskel for full telling. Radantall estimeres først via indeksstatistikk; estimater over denne verdien brukes som de er, ellers kjører count(*) for en nøyaktig verdi. Senk den for å unngå trege første besøk på store tabeller, hev den for nøyaktige tellinger. Standard 10 millioner"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Datacache. Bufrer etter SQL, standard 0 sekunder"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Utløp for entitetscache. Bufrer hele entitetslisten, standard 10 sekunder"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Utløp for enkeltobjektcache. Bufrer entiteter etter primærnøkkel, standard 10 sekunder"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Utløp for utvidede egenskaper. Bufrer egenskapen Extends, standard 10 sekunder"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Utløp for feltcache. Bufrer grupperte verdier av kategorifelt, standard 3600 sekunder"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Periode for cachestatistikk. Intervall i sekunder for logging av cachestatistikk, 0 deaktiverer, standard 3600"
