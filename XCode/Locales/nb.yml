"SonnetDB LIMIT/OFFSET currently cannot exceed Int32.MaxValue. See SonnetDB issue #256.": "SonnetDB LIMIT/OFFSET kan for øyeblikket ikke overstige Int32.MaxValue. Se SonnetDB issue #256."
"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 kan ikke bevare denne Decimal-verdien nøyaktig og avviste skrivingen. Se SonnetDB issue #235; støtte for nøyaktige decimal-parametere må fortsatt implementeres og utgis."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT bruker signert Int64 og støtter bare UInt64-verdier opp til Int64.MaxValue."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME kan bare bevare millisekundpresisjon og avviste tider under ett millisekund. Se SonnetDB issue #236; full tidspresisjon må fortsatt implementeres og utgis."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "Begrenset massesletting i SonnetDB krever for øyeblikket en enkeltkolonne primærnøkkel; tabeller med sammensatt eller ingen primærnøkkel kan ikke falle tilbake til ubegrenset sletting. Se SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB gir ennå ikke den fulle semantikken for dette transaksjonsisolasjonsnivået; bruk ReadCommitted. Se SonnetDB issue #225."
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "SonnetDB-resultatet identifiserer ikke identitetskolonner, så det genererte nummeret kan ikke hentes trygt. Oppgrader til en SonnetDB-versjon som inkluderer RETURNING-kolonnenmetadata."
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB støtter ennå ikke Replace-semantikken med å slette motstridende rader og sette inn nye rader. Se SonnetDB issue #242."
"Bulk write must contain at least one field.": "Masseskriving må inneholde minst ett felt."
