"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING støtter ennå ikke endring av lengdebegrensninger. Se SonnetDB issue #240; funksjonen må fortsatt implementeres og utgis."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "Endring av identitet eller primærnøkkel på eksisterende SonnetDB-kolonner krever en separat migrering og kan ikke gjøres via ALTER COLUMN."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER ville miste eksplisitt presisjon og ble avvist for å bevare modellsemantikken. Se SonnetDB issue #241; det må fortsatt rettes og utgis."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "Innebygd SonnetDB oppretter databaser via Data Source-katalogen; konfigurer en separat tilkobling for målkatalogen."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "Innebygd SonnetDB støtter ikke sletting av databasekatalogen via SQL."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB støtter ennå ikke lagring av tabell- og kolonnekommentarer. Se SonnetDB issue #237; funksjonen må implementeres og utgis."
