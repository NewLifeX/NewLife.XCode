# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "XCode-instellingen"
"Debug": "Foutopsporing"
"Output SQL. Whether to output SQL statements, enabled by default": "SQL-uitvoer. Of SQL-instructies worden uitgevoerd, standaard ingeschakeld"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL-map. Aparte map voor SQL-uitvoer; standaard leeg zodat SQL naar het huidige logboek gaat. Gebruik in productie een aparte SqlLog-map buiten de site"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL-uitvoeringstijd. SQL die langzamer is dan deze drempel in milliseconden wordt gelogd, standaard 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Maximale SQL-lengte. Langere SQL wordt in logboeken afgekapt, standaard 4096; gebruik 0 om afkappen uit te schakelen"
"Parameterized CRUD. Disabled by default": "Geparameteriseerde CRUD. Standaard uitgeschakeld"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Batchgrootte. Rijen per batch voor extraheren, verwijderen, back-uppen en herstellen, standaard 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Batch-interval. Pauze tussen batches in milliseconden, standaard 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Opdrachttime-out. Querytime-out in seconden, standaard 0 (onbeperkt)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Opnieuw proberen bij fouten. Nieuwe pogingen na een time-out, standaard 0 (niet opnieuw proberen)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migratie. Off: uitgeschakeld; ReadOnly: alleen controleren; On: alleen aanmaken; Full: ook wijzigen en verwijderen"
"Check comments. Table and column comments for migrations, enabled by default": "Opmerkingen controleren. Tabel- en kolomopmerkingen voor migraties, standaard ingeschakeld"
"Check for dropped indexes. Migration check, enabled by default": "Verwijderde indexen controleren. Migratiecontrole, standaard ingeschakeld"
"Check for new indexes. Migration check, enabled by default": "Nieuwe indexen controleren. Migratiecontrole, standaard ingeschakeld"
"Check for duplicate indexes. Enabled by default": "Dubbele indexen controleren. Standaard ingeschakeld"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Hoofdlettergebruik van tabel- en kolomnamen. Default: database beslist; None: modelnotatie behouden; Upper: hoofdletters; Lower: kleine letters; Underline: onderstrepingsteken"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Drempel voor volledige telling. Rijenaantallen worden eerst geschat via indexstatistieken; schattingen boven deze waarde worden overgenomen, anders geeft count(*) een exacte waarde. Verlaag de waarde om trage eerste bezoeken op grote tabellen te voorkomen, verhoog haar voor exacte tellingen. Standaard 10 miljoen"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Gegevenscache. Cachet op SQL, standaard 0 seconden"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Verloop van entiteitscache. Cachet de volledige entiteitslijst, standaard 10 seconden"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Verloop van cache voor één object. Cachet entiteiten op primaire sleutel, standaard 10 seconden"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Verloop van uitgebreide eigenschappen. Cachet de eigenschap Extends, standaard 10 seconden"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Verloop van veldcache. Cachet gegroepeerde waarden van categorievelden, standaard 3600 seconden"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Periode voor cachestatistieken. Interval in seconden voor het loggen van cachestatistieken, 0 schakelt uit, standaard 3600"

