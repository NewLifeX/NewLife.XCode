# 程序集标题与描述（英文源文 → 荷兰文）
"XCode Super ORM Middleware": "XCode super-ORM-middleware"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "Krachtige .NET-datamiddleware (super ORM) gericht op CRUD en enorme datavolumes, met cache op meerdere niveaus, automatische migratie, sharding, sterk getypeerde query's en migratie tussen databases."
"XCode Entity Generator": "XCode-entiteitsgenerator"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "Officieel opdrachtregelprogramma van XCode dat entiteitsgegevensklassen en bedrijfsklassen genereert uit Model.xml, ter ondersteuning van snel modelleren en continue iteratie."

