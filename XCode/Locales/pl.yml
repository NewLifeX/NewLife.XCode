# Polski 词表（pl）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "Nie ustawiono klucza relacji."
"No master field is set.": "Nie ustawiono pola głównego."
"Entity class [{0}] must implement [{1}].": "Klasa encji [{0}] musi implementować [{1}]."
"No model file was found.": "Nie znaleziono pliku modelu."
"The specified model file does not exist.": "Podany plik modelu nie istnieje."
"[{0}] no connection string is specified!": "[{0}] nie określono parametrów połączenia!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "Nie można załadować sterownika [{0}]; dodaj pakiet sterownika bazy danych z NuGet."
"Detected secondary cache version change {0} => {1}; expiring local cache": "Wykryto zmianę wersji pamięci podręcznej pomocniczej {0} => {1}; lokalna pamięć podręczna wygaśnie"
"Updating (#{0}), reason: {1}": "Aktualizowanie (#{0}), powód: {1}"
"Completed [{0}] (#{1})": "Ukończono [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "Pamięć podręczna została wymuszenie wyczyszczona; następny dostęp zablokuje się i będzie czekał na synchronizację"
"Cache cleared without force; the next access updates asynchronously without blocking": "Pamięć podręczna została wyczyszczona bez wymuszania; następny dostęp zaktualizuje się asynchronicznie bez blokowania"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "Pamięć podręczna obiektów <{0}> jest pełna, {1:n0}>{2:n0}, usunięto [{3:n0}]"
"Clearing single-object cache, reason: {0}, Using = false": "Czyszczenie pamięci podręcznej pojedynczego obiektu, powód: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: zwiększanie wersji pamięci podręcznej [{0}], {1} => {2}, powód={3}"
"No string primary key is defined for [{0}].": "Dla [{0}] nie zdefiniowano klucza głównego typu string."
"Table [{0}] has no unique primary key and cannot be used for caching.": "Tabela [{0}] nie ma unikalnego klucza głównego i nie może być używana do buforowania."
"Entity queue [{0}/{1}] saving {2:n0}, estimated {3:n0}ms": "Kolejka encji [{0}/{1}] zapisuje {2:n0}, szacowano {3:n0}ms"
"Entity queue of [{0}] overflowed; exceeded the maximum of {1:n0}.": "Kolejka encji [{0}] przepełniła się; przekroczono maksimum {1:n0}."
"Entity queue of [{0}] still has [{1:n0}] items unsaved on dispose.": "Kolejka encji [{0}] podczas zwalniania nadal zawiera [{1:n0}] niezapisanych elementów."
"Entity queue [{0}/{1}] saved {2:n0}, elapsed {3:n0}ms, speed {4:n0}tps, period {5:n0}ms": "Kolejka encji [{0}/{1}] zapisała {2:n0}, upłynęło {3:n0}ms, prędkość {4:n0}tps, okres {5:n0}ms"
"Set the connection string for [{0}] before using the database.": "Przed użyciem bazy danych ustaw parametry połączenia dla [{0}]."
"AppDomain.CurrentDomain.FriendlyName is awkward; normalized to: {0}": "AppDomain.CurrentDomain.FriendlyName jest nieodpowiednia; znormalizowano do: {0}"
"Failed to initialize data! {0}": "Nie udało się zainicjować danych! {0}"
"DDL mode [{0}]; create table [{1}] manually:{2}{3}": "Tryb DDL [{0}]; utwórz tabelę [{1}] ręcznie:{2}{3}"
"DDL mode [{0}]; alter table [{1}] manually:{2}{3}": "Tryb DDL [{0}]; zmodyfikuj tabelę [{1}] ręcznie:{2}{3}"
"Entity class [{0}] does not contain sort field [{1}].": "Klasa encji [{0}] nie zawiera pola sortowania [{1}]."
"[{0}/{1}@{2}] is limited to {3} characters [{4}={5}]": "[{0}/{1}@{2}] jest ograniczone do {3} znaków [{4}={5}]"
"[{0}/{1}@{2}] is limited to {3} characters": "[{0}/{1}@{2}] jest ograniczone do {3} znaków"
"Write-only log data [{0}] cannot be modified.": "Dane dziennika tylko do zapisu [{0}] nie mogą być modyfikowane."
"Write-only log data [{0}] cannot be deleted.": "Dane dziennika tylko do zapisu [{0}] nie mogą być usuwane."
"FindByKey requires [{0}] to have a unique key.": "FindByKey wymaga, aby [{0}] miał unikalny klucz."
"Property [{0}] does not exist on class [{1}].": "Właściwość [{0}] nie istnieje w klasie [{1}]."
