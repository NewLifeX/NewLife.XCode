"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] Incompleto {0}: a persistência de comentários de tabelas e colunas ainda não é suportada; o SonnetDB precisa implementá-la e lançá-la, consulte issue #237."
