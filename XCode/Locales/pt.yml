"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "O SonnetDB ainda não oferece suporte à semântica Replace de excluir linhas conflitantes e inserir novas linhas. Consulte SonnetDB issue #242."
