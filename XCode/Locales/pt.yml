"SonnetDB does not support field type {0}.": "O SonnetDB não oferece suporte ao tipo de campo {0}."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "O SonnetDB STRING ainda não oferece suporte à alteração de restrições de comprimento. Consulte SonnetDB issue #240; o recurso ainda precisa ser implementado e lançado."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "Alterar a identidade ou a chave primária em colunas existentes do SonnetDB exige uma migração separada e não pode ser feito por ALTER COLUMN."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "O SonnetDB 4.0.0 DECIMAL ADD/ALTER perderia a precisão explícita e foi rejeitado para preservar a semântica do modelo. Consulte SonnetDB issue #241; ainda precisa ser corrigido e lançado."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "O SonnetDB incorporado cria bancos de dados por meio do diretório Data Source; configure uma conexão separada para o diretório de destino."
