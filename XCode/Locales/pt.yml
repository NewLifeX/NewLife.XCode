"SonnetDB LIMIT/OFFSET currently cannot exceed Int32.MaxValue. See SonnetDB issue #256.": "O LIMIT/OFFSET do SonnetDB atualmente não pode exceder Int32.MaxValue. Consulte SonnetDB issue #256."
"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "O SonnetDB 4.0.0 não consegue preservar exatamente este valor Decimal e rejeitou a gravação. Consulte SonnetDB issue #235; o suporte a parâmetros decimal precisos ainda precisa ser implementado e lançado."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "O SonnetDB INT usa Int64 com sinal e oferece suporte apenas a valores UInt64 até Int64.MaxValue."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "O SonnetDB 4.0.0 DATETIME só consegue preservar precisão de milissegundos e rejeitou tempos abaixo de um milissegundo. Consulte SonnetDB issue #236; o suporte completo à precisão temporal ainda precisa ser implementado e lançado."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "A exclusão em massa limitada no SonnetDB atualmente exige uma chave primária de coluna única; tabelas com chave primária composta ou sem chave primária não podem recorrer à exclusão ilimitada. Consulte SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "O SonnetDB ainda não fornece a semântica completa deste nível de isolamento de transação; use ReadCommitted. Consulte SonnetDB issue #225."
