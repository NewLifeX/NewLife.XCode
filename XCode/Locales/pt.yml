# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Configurações do XCode"
"Debug": "Depuração"
"Output SQL. Whether to output SQL statements, enabled by default": "Saída SQL. Indica se as instruções SQL são geradas, ativado por padrão"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Diretório SQL. Diretório separado para a saída SQL; vazio por padrão, o SQL vai para o log atual. Em produção, use um diretório SqlLog dedicado fora do site"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Tempo de execução SQL. O SQL mais lento que este limite em milissegundos é registrado, padrão 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Comprimento máximo do SQL. O SQL mais longo é truncado nos logs, padrão 4096; use 0 para desativar o truncamento"
"Parameterized CRUD. Disabled by default": "CRUD parametrizado. Desativado por padrão"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Tamanho do lote. Linhas por lote para extrair, excluir, fazer backup e restaurar, padrão 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Intervalo entre lotes. Pausa entre lotes em milissegundos, padrão 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Tempo limite de comando. Tempo limite de consulta em segundos, padrão 0 (ilimitado)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Nova tentativa em caso de falha. Novas tentativas após um tempo limite, padrão 0 (sem nova tentativa)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migração. Off: desativada; ReadOnly: apenas verificar; On: apenas criar; Full: também alterar e eliminar"
"Check comments. Table and column comments for migrations, enabled by default": "Verificar comentários. Comentários de tabelas e colunas para migrações, ativado por padrão"
"Check for dropped indexes. Migration check, enabled by default": "Verificar índices removidos. Verificação de migração, ativada por padrão"
"Check for new indexes. Migration check, enabled by default": "Verificar novos índices. Verificação de migração, ativada por padrão"
"Check for duplicate indexes. Enabled by default": "Verificar índices duplicados. Ativado por padrão"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Caixa de nomes de tabelas e colunas. Default: o banco decide; None: manter o padrão do modelo; Upper: maiúsculas; Lower: minúsculas; Underline: sublinhado"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Limite de contagem completa. As contagens de linhas são estimadas primeiro pelas estatísticas de índice; estimativas acima deste valor são usadas como estão, caso contrário count(*) obtém o valor exato. Reduza para evitar primeiras visitas lentas em tabelas grandes, aumente para contagens exatas. Padrão 10 milhões"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Cache de dados. Armazena em cache por SQL, padrão 0 segundos"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Expiração do cache de entidades. Armazena em cache toda a lista de entidades, padrão 10 segundos"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Expiração do cache de objeto único. Armazena entidades por chave primária, padrão 10 segundos"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Expiração de propriedades estendidas. Armazena em cache a propriedade Extends, padrão 10 segundos"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Expiração do cache de campos. Armazena os valores agrupados dos campos de categoria, padrão 3600 segundos"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Período de estatísticas de cache. Intervalo em segundos para registrar estatísticas de cache, 0 desativa, padrão 3600"

