"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "O SonnetDB ainda não oferece suporte à persistência de comentários de tabelas e colunas. Consulte SonnetDB issue #237; o recurso precisa ser implementado e lançado."
