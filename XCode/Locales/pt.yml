# 程序集标题与描述（英文源文 → 葡萄牙语）
"XCode Super ORM Middleware": "Middleware ORM do XCode"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "Middleware de dados .NET de alto desempenho (super ORM) focado em CRUD e dados massivos, com cache multinível, migração automática, fragmentação, consultas fortemente tipadas e migração entre bancos de dados."
"XCode Entity Generator": "Gerador de entidades do XCode"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "Ferramenta oficial de linha de comando do XCode que gera classes de dados de entidade e classes de negócio a partir de Model.xml, apoiando modelagem rápida e iteração contínua."

