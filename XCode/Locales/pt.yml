# Português 词表（pt）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "Nenhuma chave de relação foi definida."
"No master field is set.": "Nenhum campo mestre foi definido."
"Entity class [{0}] must implement [{1}].": "A classe de entidade [{0}] deve implementar [{1}]."
"No model file was found.": "Nenhum arquivo de modelo foi encontrado."
"The specified model file does not exist.": "O arquivo de modelo especificado não existe."
"[{0}] no connection string is specified!": "[{0}] nenhuma cadeia de conexão foi especificada!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "Não foi possível carregar o driver [{0}]; adicione o pacote de driver de banco de dados do NuGet."
"Detected secondary cache version change {0} => {1}; expiring local cache": "Alteração da versão do cache secundário detectada {0} => {1}; expirando o cache local"
"Updating (#{0}), reason: {1}": "Atualizando (#{0}), motivo: {1}"
"Completed [{0}] (#{1})": "Concluído [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "Cache limpo à força; o próximo acesso bloqueia e aguarda uma atualização síncrona"
"Cache cleared without force; the next access updates asynchronously without blocking": "Cache limpo sem força; o próximo acesso atualiza de forma assíncrona sem bloquear"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "O cache de objetos <{0}> está cheio, {1:n0}>{2:n0}, [{3:n0}] removidos"
"Clearing single-object cache, reason: {0}, Using = false": "Limpando o cache de objeto único, motivo: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: incrementando a versão do cache de [{0}], {1} => {2}, motivo={3}"
"No string primary key is defined for [{0}].": "Nenhuma chave primária de string está definida para [{0}]."
"Table [{0}] has no unique primary key and cannot be used for caching.": "A tabela [{0}] não tem uma chave primária exclusiva e não pode ser usada para cache."
