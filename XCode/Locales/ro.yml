"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME poate păstra numai precizia la milisecunde și a respins timpii sub o milisecundă. Consultați SonnetDB issue #236; suportul complet pentru precizia timpului trebuie încă implementat și lansat."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "Ștergerea în bloc limitată în SonnetDB necesită momentan o cheie primară cu o singură coloană; tabelele cu cheie primară compusă sau fără cheie primară nu pot recurge la ștergere nelimitată. Consultați SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB nu oferă încă semantica completă a acestui nivel de izolare a tranzacțiilor; utilizați ReadCommitted. Consultați SonnetDB issue #225."
