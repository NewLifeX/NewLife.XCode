"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER ar pierde precizia explicită și a fost respins pentru a păstra semantica modelului. Consultați SonnetDB issue #241; trebuie încă corectat și lansat."
