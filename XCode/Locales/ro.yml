"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 nu poate păstra exact această valoare Decimal și a respins scrierea. Consultați SonnetDB issue #235; suportul pentru parametri decimal precisi trebuie încă implementat și lansat."
