"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB nu acceptă încă semantica Replace de ștergere a rândurilor conflictuale și inserare a rândurilor noi. Consultați SonnetDB issue #242."
