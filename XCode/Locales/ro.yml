# Română 词表（ro）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "Nu a fost setată nicio cheie de relație."
"No master field is set.": "Nu a fost setat niciun câmp principal."
"Entity class [{0}] must implement [{1}].": "Clasa de entitate [{0}] trebuie să implementeze [{1}]."
"No model file was found.": "Nu a fost găsit niciun fișier de model."
"The specified model file does not exist.": "Fișierul de model specificat nu există."
"[{0}] no connection string is specified!": "[{0}] nu a fost specificat niciun șir de conexiune!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "Nu se poate încărca driverul [{0}]; adăugați pachetul de driver pentru baza de date din NuGet."
"Detected secondary cache version change {0} => {1}; expiring local cache": "S-a detectat o modificare a versiunii cache-ului secundar {0} => {1}; cache-ul local va expira"
"Updating (#{0}), reason: {1}": "Se actualizează (#{0}), motiv: {1}"
"Completed [{0}] (#{1})": "Finalizat [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "Cache-ul a fost golit forțat; următorul acces se blochează și așteaptă o actualizare sincronă"
"Cache cleared without force; the next access updates asynchronously without blocking": "Cache-ul a fost golit fără forțare; următorul acces se actualizează asincron fără blocare"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "Cache-ul de obiecte <{0}> este plin, {1:n0}>{2:n0}, s-au eliminat [{3:n0}]"
"Clearing single-object cache, reason: {0}, Using = false": "Se golește cache-ul pentru obiecte individuale, motiv: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: se incrementează versiunea cache-ului pentru [{0}], {1} => {2}, motiv={3}"
"No string primary key is defined for [{0}].": "Nu este definită nicio cheie primară de tip șir pentru [{0}]."
"Table [{0}] has no unique primary key and cannot be used for caching.": "Tabelul [{0}] nu are o cheie primară unică și nu poate fi folosit pentru cache."
"Entity queue [{0}/{1}] saving {2:n0}, estimated {3:n0}ms": "Coada de entități [{0}/{1}] salvează {2:n0}, estimat {3:n0}ms"
