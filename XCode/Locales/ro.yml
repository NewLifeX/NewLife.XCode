# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Setări XCode"
"Debug": "Depanare"
"Output SQL. Whether to output SQL statements, enabled by default": "Ieșire SQL. Dacă se generează instrucțiuni SQL, activat implicit"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Director SQL. Director separat pentru ieșirea SQL; gol implicit, astfel încât SQL ajunge în jurnalul curent. În producție, folosiți un director SqlLog dedicat în afara site-ului"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Timp de execuție SQL. SQL mai lent decât acest prag în milisecunde este înregistrat, implicit 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Lungimea maximă SQL. SQL mai lung este trunchiat în jurnale, implicit 4096; folosiți 0 pentru a dezactiva trunchierea"
"Parameterized CRUD. Disabled by default": "CRUD parametrizat. Dezactivat implicit"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Dimensiunea lotului. Rânduri pe lot pentru extragere, ștergere, copiere de siguranță și restaurare, implicit 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Intervalul loturilor. Pauză între loturi în milisecunde, implicit 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Timeout comandă. Timeout interogare în secunde, implicit 0 (nelimitat)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Reîncercare la eroare. Reîncercări după un timeout de comandă, implicit 0 (fără reîncercare)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migrare. Off: dezactivată; ReadOnly: doar verificare; On: doar creare; Full: și modificare și ștergere"
"Check comments. Table and column comments for migrations, enabled by default": "Verifică comentariile. Comentarii de tabele și coloane pentru migrări, activate implicit"
"Check for dropped indexes. Migration check, enabled by default": "Verifică indexurile eliminate. Verificare de migrare, activată implicit"
"Check for new indexes. Migration check, enabled by default": "Verifică indexurile noi. Verificare de migrare, activată implicit"
"Check for duplicate indexes. Enabled by default": "Verifică indexurile duplicate. Activat implicit"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Majuscule/minuscule pentru numele tabelelor și coloanelor. Default: decide baza de date; None: păstrează scrierea modelului; Upper: majuscule; Lower: minuscule; Underline: subliniere"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Prag pentru numărarea completă. Numărul de rânduri este estimat mai întâi din statisticile indexurilor; estimările peste această valoare sunt folosite ca atare, altfel count(*) oferă valoarea exactă. Reduceți-l pentru a evita primele accesări lente la tabele mari, măriți-l pentru numărări exacte. Implicit 10 milioane"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Cache de date. Memorează în cache după SQL, implicit 0 secunde"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Expirarea cache-ului de entități. Memorează în cache întreaga listă de entități, implicit 10 secunde"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Expirarea cache-ului de obiect unic. Memorează entitățile în cache după cheia primară, implicit 10 secunde"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Expirarea proprietăților extinse. Memorează în cache proprietatea Extends, implicit 10 secunde"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Expirarea cache-ului de câmpuri. Memorează valorile grupate ale câmpurilor de categorie, implicit 3600 secunde"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Perioada statisticilor de cache. Interval în secunde pentru înregistrarea statisticilor de cache, 0 dezactivează, implicit 3600"

