"Detected secondary cache version change {0} => {1}; expiring local cache": "Обнаружено изменение версии вторичного кэша {0} => {1}; локальный кэш будет сброшен"
"Updating (#{0}), reason: {1}": "Обновление (#{0}), причина: {1}"
