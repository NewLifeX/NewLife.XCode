"Output SQL. Whether to output SQL statements, enabled by default": "Вывод SQL. Выводить ли инструкции SQL, включено по умолчанию"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Каталог SQL. Отдельный каталог для вывода SQL; по умолчанию пуст, и SQL пишется в текущий журнал. В рабочей среде используйте отдельный каталог SqlLog вне сайта"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Время выполнения SQL. SQL медленнее этого порога в миллисекундах записывается в журнал, по умолчанию 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Максимальная длина SQL. Более длинный SQL усекается в журналах, по умолчанию 4096; 0 отключает усечение"
"Parameterized CRUD. Disabled by default": "Параметризованный CRUD. Отключён по умолчанию"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Размер пакета. Строк на пакет при извлечении, удалении, резервном копировании и восстановлении, по умолчанию 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Интервал пакетов. Пауза между пакетами в миллисекундах, по умолчанию 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Тайм-аут команды. Тайм-аут запроса в секундах, по умолчанию 0 (без ограничений)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Повтор при сбое. Повторные попытки после тайм-аута команды, по умолчанию 0 (без повторов)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Миграция. Off: отключена; ReadOnly: только проверка; On: только создание; Full: также изменение и удаление"
"Check comments. Table and column comments for migrations, enabled by default": "Проверять комментарии. Комментарии таблиц и столбцов для миграций, включено по умолчанию"
"Check for dropped indexes. Migration check, enabled by default": "Проверять удалённые индексы. Проверка миграции, включена по умолчанию"
"Check for new indexes. Migration check, enabled by default": "Проверять новые индексы. Проверка миграции, включена по умолчанию"
"Check for duplicate indexes. Enabled by default": "Проверять дублирующиеся индексы. Включено по умолчанию"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Регистр имён таблиц и столбцов. Default: решает база данных; None: сохранять регистр модели; Upper: верхний регистр; Lower: нижний регистр; Underline: подчёркивание"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Порог полного подсчёта. Число строк сначала оценивается по статистике индексов; оценки выше этого значения используются как есть, иначе count(*) даёт точное значение. Уменьшите порог, чтобы избежать медленных первых обращений к большим таблицам, увеличьте для точных подсчётов. По умолчанию 10 миллионов"
"Cache": "Кэш"
"Data cache. Caches by SQL, default 0 seconds": "Кэш данных. Кэширует по SQL, по умолчанию 0 секунд"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Срок жизни кэша сущностей. Кэширует весь список сущностей, по умолчанию 10 секунд"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Срок жизни кэша отдельного объекта. Кэширует сущности по первичному ключу, по умолчанию 10 секунд"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Срок жизни расширенных свойств. Кэширует свойство Extends, по умолчанию 10 секунд"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Срок жизни кэша полей. Кэширует сгруппированные значения полей категорий, по умолчанию 3600 секунд"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Период статистики кэша. Интервал в секундах для записи статистики кэша в журнал, 0 отключает, по умолчанию 3600"

