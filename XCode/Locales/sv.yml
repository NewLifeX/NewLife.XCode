# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "XCode-inställningar"
"Debug": "Felsökning"
"Output SQL. Whether to output SQL statements, enabled by default": "SQL-utdata. Om SQL-satser skickas ut, aktiverat som standard"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL-katalog. Separat katalog för SQL-utdata; tom som standard så att SQL går till aktuell logg. Använd i produktion en dedikerad SqlLog-katalog utanför webbplatsen"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL-körtid. SQL som är långsammare än denna tröskel i millisekunder loggas, standard 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Maximal SQL-längd. Längre SQL trunkeras i loggar, standard 4096; använd 0 för att inaktivera trunkering"
"Parameterized CRUD. Disabled by default": "Parametriserad CRUD. Inaktiverad som standard"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Batchstorlek. Rader per batch för uttag, borttagning, säkerhetskopiering och återställning, standard 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Batchintervall. Paus mellan batchar i millisekunder, standard 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Kommandotimeout. Timeout för frågor i sekunder, standard 0 (obegränsat)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Försök igen vid fel. Nya försök efter en kommandotimeout, standard 0 (inga nya försök)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Migrering. Off: inaktiverad; ReadOnly: endast kontroll; On: endast skapa; Full: även ändra och ta bort"
"Check comments. Table and column comments for migrations, enabled by default": "Kontrollera kommentarer. Tabell- och kolumnkommentarer för migreringar, aktiverat som standard"
"Check for dropped indexes. Migration check, enabled by default": "Kontrollera borttagna index. Migreringskontroll, aktiverad som standard"
"Check for new indexes. Migration check, enabled by default": "Kontrollera nya index. Migreringskontroll, aktiverad som standard"
"Check for duplicate indexes. Enabled by default": "Kontrollera dubblerade index. Aktiverat som standard"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Skiftläge för tabell- och kolumnnamn. Default: databasen bestämmer; None: behåll modellens skiftläge; Upper: versaler; Lower: gemener; Underline: understreck"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Tröskel för fullständig räkning. Radantal uppskattas först via indexstatistik; uppskattningar över detta värde används direkt, annars kör count(*) för ett exakt värde. Sänk den för att undvika långsamma första besök på stora tabeller, höj den för exakta räkningar. Standard 10 miljoner"
"Cache": "Cache"
"Data cache. Caches by SQL, default 0 seconds": "Datacache. Cachar efter SQL, standard 0 sekunder"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Utgång för entitetscache. Cachar hela entitetslistan, standard 10 sekunder"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Utgång för cache för enskilt objekt. Cachar entiteter efter primärnyckel, standard 10 sekunder"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Utgång för utökade egenskaper. Cachar egenskapen Extends, standard 10 sekunder"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Utgång för fältcache. Cachar grupperade värden för kategorifält, standard 3600 sekunder"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Period för cachestatistik. Intervall i sekunder för loggning av cachestatistik, 0 inaktiverar, standard 3600"

