"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB stöder ännu inte Replace-semantiken att ta bort motstridiga rader och infoga nya rader. Se SonnetDB issue #242."
"Bulk write must contain at least one field.": "Masskrivning måste innehålla minst ett fält."
"SonnetDB Upsert requires a primary key or a complete unique-index conflict target.": "SonnetDB Upsert kräver en primärnyckel eller ett fullständigt unikt indexkonfliktmål."
