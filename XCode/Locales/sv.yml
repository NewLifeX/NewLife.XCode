"SonnetDB does not support field type {0}.": "SonnetDB stöder inte fälttypen {0}."
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING stöder ännu inte ändring av längdbegränsningar. Se SonnetDB issue #240; funktionen måste fortfarande implementeras och släppas."
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "Ändring av identitet eller primärnyckel på befintliga SonnetDB-kolumner kräver en separat migrering och kan inte göras via ALTER COLUMN."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER skulle förlora explicit precision och avvisades för att bevara modellsemantiken. Se SonnetDB issue #241; det måste fortfarande åtgärdas och släppas."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "Inbäddad SonnetDB skapar databaser via Data Source-katalogen; konfigurera en separat anslutning för målkatalogen."
"Embedded SonnetDB does not support deleting the database directory via SQL.": "Inbäddad SonnetDB stöder inte borttagning av databaskatalogen via SQL."
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB stöder ännu inte beständiga tabell- och kolumnkommentarer. Se SonnetDB issue #237; funktionen måste implementeras och släppas."
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] Fältet {0}.{1} deklarerar längden {2}, men STRING stöder för närvarande inte längdbegränsningar; väntar, se SonnetDB issue #240."
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] Ofullständig {0}: beständiga tabell- och kolumnkommentarer stöds ännu inte; SonnetDB måste implementera och släppa det, se issue #237."
