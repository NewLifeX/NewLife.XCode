# Svenska 词表（sv）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "Ingen relationsnyckel är angiven."
"No master field is set.": "Inget huvudfält är angivet."
"Entity class [{0}] must implement [{1}].": "Entitetsklassen [{0}] måste implementera [{1}]."
"No model file was found.": "Ingen modellfil hittades."
"The specified model file does not exist.": "Den angivna modellfilen finns inte."
"[{0}] no connection string is specified!": "[{0}] ingen anslutningssträng är angiven!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "Det gick inte att läsa in drivrutinen [{0}]; lägg till databasdrivrutinspaketet från NuGet."
"Detected secondary cache version change {0} => {1}; expiring local cache": "Ändring av sekundär cacheversion upptäckt {0} => {1}; den lokala cachen upphör att gälla"
"Updating (#{0}), reason: {1}": "Uppdaterar (#{0}), orsak: {1}"
"Completed [{0}] (#{1})": "Slutfört [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "Cachen rensades med tvång; nästa åtkomst blockeras och väntar på en synkron uppdatering"
"Cache cleared without force; the next access updates asynchronously without blocking": "Cachen rensades utan tvång; nästa åtkomst uppdateras asynkront utan att blockera"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "Objektcachen <{0}> är full, {1:n0}>{2:n0}, tog bort [{3:n0}]"
"Clearing single-object cache, reason: {0}, Using = false": "Rensar cache för enskilda objekt, orsak: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: ökar cacheversionen för [{0}], {1} => {2}, orsak={3}"
"No string primary key is defined for [{0}].": "Det finns ingen strängprimärnyckel definierad för [{0}]."
"Table [{0}] has no unique primary key and cannot be used for caching.": "Tabellen [{0}] har ingen unik primärnyckel och kan inte användas för cachelagring."
