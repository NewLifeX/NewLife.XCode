"SonnetDB LIMIT/OFFSET currently cannot exceed Int32.MaxValue. See SonnetDB issue #256.": "SonnetDB LIMIT/OFFSET kan för närvarande inte överskrida Int32.MaxValue. Se SonnetDB issue #256."
"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 kan inte bevara detta Decimal-värde exakt och avvisade skrivningen. Se SonnetDB issue #235; stöd för exakta decimal-parametrar måste fortfarande implementeras och släppas."
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT använder signerat Int64 och stöder endast UInt64-värden upp till Int64.MaxValue."
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME kan endast bevara millisekundprecision och avvisade tider under en millisekund. Se SonnetDB issue #236; full tidsprecision måste fortfarande implementeras och släppas."
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "Begränsad massborttagning i SonnetDB kräver för närvarande en primärnyckel med en kolumn; tabeller med sammansatt eller ingen primärnyckel kan inte falla tillbaka till obegränsad borttagning. Se SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB tillhandahåller ännu inte den fullständiga semantiken för denna transaktionsisoleringsnivå; använd ReadCommitted. Se SonnetDB issue #225."
