"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 kan inte bevara detta Decimal-värde exakt och avvisade skrivningen. Se SonnetDB issue #235; stöd för exakta decimal-parametrar måste fortfarande implementeras och släppas."
