"Field [{0}] in expression [{1}] was not recognized; entity class [{2}] does not contain this field.": "ไม่รู้จักฟิลด์ [{0}] ในนิพจน์ [{1}]; คลาสเอนทิตี [{2}] ไม่มีฟิลด์นี้"
"The shard policy cannot recognize data [{0}].": "นโยบายการแบ่งชาร์ดไม่สามารถจดจำข้อมูล [{0}] ได้"
"The time shard policy does not support fields of type [{0}].": "นโยบายการแบ่งชาร์ดตามเวลาไม่รองรับฟิลด์ชนิด [{0}]"
