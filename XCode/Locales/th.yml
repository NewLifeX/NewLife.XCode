"No incremental snapshot was found for entity field [{0}]; ensure the entity was loaded from the database.": "ไม่พบสแนปช็อตแบบเพิ่มทีละส่วนสำหรับฟิลด์เอนทิตี [{0}]; ตรวจสอบให้แน่ใจว่าโหลดเอนทิตีจากฐานข้อมูลแล้ว"
"Field [{0}/{1}] does not exist in DbTable.": "ไม่มีฟิลด์ [{0}/{1}] ใน DbTable"
"retry {0}, delay {1}": "ลองใหม่ {0} หน่วงเวลา {1}"
"Transaction [{0}] cannot be restarted.": "ไม่สามารถรีสตาร์ททรานแซกชัน [{0}] ได้"
"Transaction [{0}] has not started or has already ended.": "ทรานแซกชัน [{0}] ยังไม่เริ่มหรือสิ้นสุดแล้ว"
"[{2}]GetSchema({0}) failed; retrying! {1}": "[{2}]GetSchema({0}) ล้มเหลว กำลังลองใหม่! {1}"
"IDataTable is not registered.": "ยังไม่ได้ลงทะเบียน IDataTable"
"InfluxDB does not support creating buckets via SQL. Use HTTP API or CLI.": "InfluxDB ไม่รองรับการสร้างบัคเก็ตผ่าน SQL ใช้ HTTP API หรือ CLI"
"InfluxDB does not support dropping buckets via SQL. Use HTTP API or CLI.": "InfluxDB ไม่รองรับการลบบัคเก็ตผ่าน SQL ใช้ HTTP API หรือ CLI"
"InfluxDB does not support altering columns.": "InfluxDB ไม่รองรับการแก้ไขคอลัมน์"
"SonnetDB LIMIT/OFFSET currently cannot exceed Int32.MaxValue. See SonnetDB issue #256.": "SonnetDB LIMIT/OFFSET ในปัจจุบันต้องไม่เกิน Int32.MaxValue ดู SonnetDB issue #256"
"SonnetDB 4.0.0 cannot preserve this Decimal value exactly and rejected the write. See SonnetDB issue #235; precise decimal parameter support still needs to be implemented and released.": "SonnetDB 4.0.0 ไม่สามารถรักษาค่า Decimal นี้ได้อย่างแม่นยำและปฏิเสธการเขียน ดู SonnetDB issue #235; ยังต้องนำการรองรับพารามิเตอร์ decimal ที่แม่นยำไปใช้และเผยแพร่"
"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB INT ใช้ Int64 ที่มีเครื่องหมายและรองรับเฉพาะค่า UInt64 จนถึง Int64.MaxValue"
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 DATETIME สามารถรักษาความแม่นยำระดับมิลลิวินาทีเท่านั้นและปฏิเสธเวลาที่ต่ำกว่าหนึ่งมิลลิวินาที ดู SonnetDB issue #236; ยังต้องนำการรองรับความแม่นยำของเวลาแบบเต็มไปใช้และเผยแพร่"
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "การลบแบบกลุ่มที่มีขอบเขตใน SonnetDB ในปัจจุบันต้องใช้คีย์หลักคอลัมน์เดียว ตารางที่มีคีย์หลักแบบผสมหรือไม่มีคีย์หลักไม่สามารถเปลี่ยนไปใช้การลบแบบไม่มีขอบเขตได้ ดู SonnetDB issue #243"
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB ยังไม่มีความหมาย کاملของระดับการแยกทรานแซกชันนี้ ใช้ ReadCommitted ดู SonnetDB issue #225"
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "ผลลัพธ์ของ SonnetDB ไม่ระบุคอลัมน์ข้อมูลประจำตัว จึงไม่สามารถรับหมายเลขที่สร้างขึ้นได้อย่างปลอดภัย อัปเกรดเป็นเวอร์ชัน SonnetDB ที่มีข้อมูลเมตาคอลัมน์ RETURNING"
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB ยังไม่รองรับความหมายของ Replace ที่ลบแถวที่ขัดแย้งแล้วแทรกแถวใหม่ ดู SonnetDB issue #242"
"Bulk write must contain at least one field.": "การเขียนแบบกลุ่มต้องมีอย่างน้อยหนึ่งฟิลด์"
"SonnetDB Upsert requires a primary key or a complete unique-index conflict target.": "SonnetDB Upsert ต้องใช้คีย์หลักหรือเป้าหมายความขัดแย้งของดัชนีเฉพาะที่สมบูรณ์"
"SonnetDB field type has not been mapped: {0}": "ยังไม่ได้แมปชนิดฟิลด์ SonnetDB: {0}"
"SonnetDB view [{0}] did not provide field metadata.": "มุมมอง SonnetDB [{0}] ไม่ได้ให้ข้อมูลเมตาของฟิลด์"
"SonnetDB view [{0}] field [{1}] did not provide a mappable declared type. See SonnetDB issue #261; view declaration metadata still needs to be completed and released.": "ฟิลด์ [{1}] ของมุมมอง SonnetDB [{0}] ไม่ได้ให้ชนิดที่ประกาศซึ่งแมปได้ ดู SonnetDB issue #261; ยังต้องทำให้ข้อมูลเมตาการประกาศมุมมองสมบูรณ์และเผยแพร่"
"SonnetDB does not support field type {0}.": "SonnetDB ไม่รองรับชนิดฟิลด์ {0}"
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB STRING ยังไม่รองรับการเปลี่ยนข้อจำกัดความยาว ดู SonnetDB issue #240; ยังต้องนำความสามารถไปใช้และเผยแพร่"
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "การเปลี่ยนข้อมูลประจำตัวหรือคีย์หลักของคอลัมน์ SonnetDB ที่มีอยู่ต้องใช้การย้ายข้อมูลแยกต่างหากและไม่สามารถทำผ่าน ALTER COLUMN ได้"
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER จะสูญเสียความแม่นยำที่ระบุไว้และถูกปฏิเสธเพื่อรักษาความหมายของโมเดล ดู SonnetDB issue #241; ยังต้องแก้ไขและเผยแพร่"
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "SonnetDB แบบฝังสร้างฐานข้อมูลผ่านไดเรกทอรี Data Source; กำหนดค่าการเชื่อมต่อแยกต่างหากสำหรับไดเรกทอรีเป้าหมาย"
"Embedded SonnetDB does not support deleting the database directory via SQL.": "SonnetDB แบบฝังไม่รองรับการลบไดเรกทอรีฐานข้อมูลผ่าน SQL"
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB ยังไม่รองรับการเก็บความคิดเห็นของตารางและคอลัมน์อย่างถาวร ดู SonnetDB issue #237; ต้องนำความสามารถไปใช้และเผยแพร่"
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] ฟิลด์ {0}.{1} ประกาศความยาว {2} แต่ STRING ในปัจจุบันไม่รองรับข้อจำกัดความยาว; รอดำเนินการ ดู SonnetDB issue #240"
"[SonnetDB] Unfinished {0}: table and column comment persistence is not yet supported; SonnetDB must implement and release it, see issue #237.": "[SonnetDB] ยังไม่เสร็จสิ้น {0}: ยังไม่รองรับการเก็บความคิดเห็นของตารางและคอลัมน์อย่างถาวร; SonnetDB ต้องนำไปใช้และเผยแพร่ ดู issue #237"
"The current SQLite driver does not support BackupDatabase: {0}": "ไดรเวอร์ SQLite ปัจจุบันไม่รองรับ BackupDatabase: {0}"
"The paging algorithm requires a sort column! {0}": "อัลกอริทึมการแบ่งหน้าต้องใช้คอลัมน์การเรียงลำดับ! {0}"
