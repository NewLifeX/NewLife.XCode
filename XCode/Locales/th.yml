# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "การตั้งค่า XCode"
"Debug": "การดีบัก"
"Output SQL. Whether to output SQL statements, enabled by default": "เอาต์พุต SQL. จะส่งออกคำสั่ง SQL หรือไม่ เปิดใช้งานโดยค่าเริ่มต้น"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "ไดเรกทอรี SQL. ไดเรกทอรีแยกสำหรับเอาต์พุต SQL ว่างเปล่าโดยค่าเริ่มต้น จึงเขียน SQL ลงบันทึกปัจจุบัน ในระบบโปรดักชันให้ใช้ไดเรกทอรี SqlLog แยกต่างหากนอกเว็บไซต์"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "เวลาเรียกใช้ SQL. SQL ที่ช้ากว่าค่านี้เป็นมิลลิวินาทีจะถูกบันทึก ค่าเริ่มต้น 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "ความยาว SQL สูงสุด. SQL ที่ยาวกว่านี้จะถูกตัดในบันทึก ค่าเริ่มต้น 4096 ใช้ 0 เพื่อปิดการตัด"
"Parameterized CRUD. Disabled by default": "CRUD แบบมีพารามิเตอร์. ปิดใช้งานโดยค่าเริ่มต้น"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "ขนาดแบตช์. จำนวนแถวต่อแบตช์สำหรับการดึง การลบ การสำรองข้อมูล และการกู้คืน ค่าเริ่มต้น 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "ช่วงแบตช์. หยุดระหว่างแบตช์เป็นมิลลิวินาที ค่าเริ่มต้น 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "หมดเวลาคำสั่ง. หมดเวลาคิวรีเป็นวินาที ค่าเริ่มต้น 0 (ไม่จำกัด)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "ลองใหม่เมื่อล้มเหลว. จำนวนครั้งที่ลองใหม่หลังหมดเวลาคำสั่ง ค่าเริ่มต้น 0 (ไม่ลองใหม่)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "การย้ายข้อมูล. Off: ปิดใช้งาน; ReadOnly: ตรวจสอบเท่านั้น; On: สร้างเท่านั้น; Full: แก้ไขและลบด้วย"
"Check comments. Table and column comments for migrations, enabled by default": "ตรวจสอบความคิดเห็น. ความคิดเห็นของตารางและคอลัมน์สำหรับการย้ายข้อมูล เปิดใช้งานโดยค่าเริ่มต้น"
"Check for dropped indexes. Migration check, enabled by default": "ตรวจสอบดัชนีที่ถูกลบ. การตรวจสอบการย้ายข้อมูล เปิดใช้งานโดยค่าเริ่มต้น"
"Check for new indexes. Migration check, enabled by default": "ตรวจสอบดัชนีใหม่. การตรวจสอบการย้ายข้อมูล เปิดใช้งานโดยค่าเริ่มต้น"
"Check for duplicate indexes. Enabled by default": "ตรวจสอบดัชนีซ้ำ. เปิดใช้งานโดยค่าเริ่มต้น"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "ตัวพิมพ์ของชื่อตารางและคอลัมน์. Default: ฐานข้อมูลเป็นผู้ตัดสิน; None: คงรูปแบบของโมเดล; Upper: ตัวพิมพ์ใหญ่; Lower: ตัวพิมพ์เล็ก; Underline: ขีดล่าง"
