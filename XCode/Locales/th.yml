"[{0}] does not support field type {1}; only DateTime/String fields are supported. Use the Between(Int64/Double) overload for integer or decimal fields.": "[{0}] ไม่รองรับชนิดฟิลด์ {1}; รองรับเฉพาะฟิลด์ DateTime/String เท่านั้น สำหรับฟิลด์จำนวนเต็มหรือทศนิยม ให้ใช้โอเวอร์โหลด Between(Int64/Double)"
"[{0}] supports only Int16/Int32/Int64 fields; the current type is {1}.": "[{0}] รองรับเฉพาะฟิลด์ Int16/Int32/Int64; ชนิดปัจจุบันคือ {1}"
"[{0}] supports only Single/Double/Decimal fields; the current type is {1}.": "[{0}] รองรับเฉพาะฟิลด์ Single/Double/Decimal; ชนิดปัจจุบันคือ {1}"
"[{0}] supports only Int64 fields.": "[{0}] รองรับเฉพาะฟิลด์ Int64"
