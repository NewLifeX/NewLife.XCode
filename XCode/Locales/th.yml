"The DoubleTop paging algorithm requires a sort column! {0}": "อัลกอริทึมการแบ่งหน้า DoubleTop ต้องใช้คอลัมน์การเรียงลำดับ! {0}"
"Upsert encountered an identity field with mixed zero and non-zero values and cannot support both Insert and Update.": "Upsert พบฟิลด์ข้อมูลประจำตัวที่มีค่าศูนย์และไม่ใช่ศูนย์ผสมกันและไม่สามารถรองรับทั้ง Insert และ Update"
