"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "SonnetDB'de sınırlı toplu silme şu anda tek sütunlu bir birincil anahtar gerektirir; bileşik birincil anahtara sahip veya birincil anahtarı olmayan tablolar sınırsız silmeye geri dönemez. SonnetDB issue #243 konusuna bakın."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB bu işlem yalıtım düzeyinin tam semantiğini henüz sağlamıyor; ReadCommitted kullanın. SonnetDB issue #225 konusuna bakın."
