"Extended property expiration. Caches the Extends property, default 10 seconds": "Genişletilmiş özellik süresi. Extends özelliğini önbelleğe alır, varsayılan 10 saniye"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Alan önbelleği süresi. Kategori alanlarının gruplanmış değerlerini önbelleğe alır, varsayılan 3600 saniye"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Önbellek istatistikleri dönemi. Önbellek istatistiklerini günlüğe yazma aralığı (saniye), 0 devre dışı bırakır, varsayılan 3600"

