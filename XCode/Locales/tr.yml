"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "Mevcut SonnetDB sütunlarında kimlik veya birincil anahtarı değiştirmek ayrı bir geçiş gerektirir ve ALTER COLUMN ile yapılamaz."
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 DECIMAL ADD/ALTER açık hassasiyeti kaybeder ve model semantiğini korumak için reddedildi. SonnetDB issue #241 konusuna bakın; hâlâ düzeltilmesi ve yayımlanması gerekiyor."
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "Katıştırılmış SonnetDB, veritabanlarını Data Source dizini aracılığıyla oluşturur; hedef dizin için ayrı bir bağlantı yapılandırın."
