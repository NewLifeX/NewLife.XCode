"XCode settings": "XCode ayarları"
"Debug": "Hata ayıklama"
"Output SQL. Whether to output SQL statements, enabled by default": "SQL çıktısı. SQL deyimlerinin çıktılanıp çıktılanmayacağı, varsayılan olarak etkin"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL dizini. SQL çıktısı için ayrı dizin; varsayılan olarak boş, böylece SQL geçerli günlüğe yazılır. Üretimde site dışında ayrı bir SqlLog dizini kullanın"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL yürütme süresi. Bu eşikten yavaş SQL (milisaniye) günlüğe yazılır, varsayılan 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Maksimum SQL uzunluğu. Daha uzun SQL günlüklerde kısaltılır, varsayılan 4096; kısaltmayı devre dışı bırakmak için 0 kullanın"
"Parameterized CRUD. Disabled by default": "Parametreli CRUD. Varsayılan olarak devre dışı"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Toplu iş boyutu. Ayıklama, silme, yedekleme ve geri yükleme için toplu iş başına satır, varsayılan 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Toplu iş aralığı. Toplu işler arasında milisaniye cinsinden duraklama, varsayılan 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Komut zaman aşımı. Saniye cinsinden sorgu zaman aşımı, varsayılan 0 (sınırsız)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Hata durumunda yeniden dene. Komut zaman aşımından sonra yeniden deneme sayısı, varsayılan 0 (yeniden deneme yok)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Geçiş. Off: devre dışı; ReadOnly: yalnızca denetle; On: yalnızca oluştur; Full: değiştir ve sil de"
"Check comments. Table and column comments for migrations, enabled by default": "Açıklamaları denetle. Geçişler için tablo ve sütun açıklamaları, varsayılan olarak etkin"
"Check for dropped indexes. Migration check, enabled by default": "Silinen dizinleri denetle. Geçiş denetimi, varsayılan olarak etkin"
"Check for new indexes. Migration check, enabled by default": "Yeni dizinleri denetle. Geçiş denetimi, varsayılan olarak etkin"
"Check for duplicate indexes. Enabled by default": "Yinelenen dizinleri denetle. Varsayılan olarak etkin"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Tablo ve sütun adlarında büyük/küçük harf. Default: veritabanı karar verir; None: model yazımını koru; Upper: büyük harf; Lower: küçük harf; Underline: alt çizgi"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Tam sayım eşiği. Satır sayıları önce dizin istatistiklerinden tahmin edilir; bu değerin üzerindeki tahminler olduğu gibi kullanılır, aksi halde count(*) kesin değer verir. Büyük tablolarda yavaş ilk erişimleri önlemek için düşürün, kesin sayımlar için yükseltin. Varsayılan 10 milyon"
