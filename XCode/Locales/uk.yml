"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "Обмежене масове видалення в SonnetDB наразі потребує одностовпцевого первинного ключа; таблиці зі складеним первинним ключем або без нього не можуть перейти до необмеженого видалення. Див. SonnetDB issue #243."
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB поки не забезпечує повну семантику цього рівня ізоляції транзакцій; використовуйте ReadCommitted. Див. SonnetDB issue #225."
