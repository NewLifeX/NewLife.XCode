# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Параметри XCode"
"Debug": "Налагодження"
"Output SQL. Whether to output SQL statements, enabled by default": "Вивід SQL. Чи виводити інструкції SQL, увімкнено за замовчуванням"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Каталог SQL. Окремий каталог для виводу SQL; за замовчуванням порожній, тому SQL записується до поточного журналу. У виробництві використовуйте окремий каталог SqlLog поза сайтом"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Час виконання SQL. SQL, повільніший за цей поріг у мілісекундах, записується в журнал, за замовчуванням 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Максимальна довжина SQL. Довший SQL обрізається в журналах, за замовчуванням 4096; 0 вимикає обрізання"
"Parameterized CRUD. Disabled by default": "Параметризований CRUD. Вимкнено за замовчуванням"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Розмір пакета. Рядків на пакет для вилучення, видалення, резервного копіювання та відновлення, за замовчуванням 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Інтервал пакетів. Пауза між пакетами в мілісекундах, за замовчуванням 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Час очікування команди. Час очікування запиту в секундах, за замовчуванням 0 (без обмежень)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Повтор при збої. Повторні спроби після часу очікування команди, за замовчуванням 0 (без повторів)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Міграція. Off: вимкнено; ReadOnly: лише перевірка; On: лише створення; Full: також зміна та видалення"
"Check comments. Table and column comments for migrations, enabled by default": "Перевіряти коментарі. Коментарі таблиць і стовпців для міграцій, увімкнено за замовчуванням"
"Check for dropped indexes. Migration check, enabled by default": "Перевіряти видалені індекси. Перевірка міграції, увімкнена за замовчуванням"
"Check for new indexes. Migration check, enabled by default": "Перевіряти нові індекси. Перевірка міграції, увімкнена за замовчуванням"
"Check for duplicate indexes. Enabled by default": "Перевіряти дублікати індексів. Увімкнено за замовчуванням"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Регістр назв таблиць і стовпців. Default: вирішує база даних; None: зберігати регістр моделі; Upper: верхній регістр; Lower: нижній регістр; Underline: підкреслення"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Поріг повного підрахунку. Кількість рядків спочатку оцінюється за статистикою індексів; оцінки, більші за це значення, використовуються як є, інакше count(*) дає точне значення. Зменште поріг, щоб уникнути повільних перших звернень до великих таблиць, збільште для точних підрахунків. За замовчуванням 10 мільйонів"
"Cache": "Кеш"
"Data cache. Caches by SQL, default 0 seconds": "Кеш даних. Кешує за SQL, за замовчуванням 0 секунд"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Термін дії кешу сутностей. Кешує весь список сутностей, за замовчуванням 10 секунд"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Термін дії кешу окремого об'єкта. Кешує сутності за первинним ключем, за замовчуванням 10 секунд"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Термін дії розширених властивостей. Кешує властивість Extends, за замовчуванням 10 секунд"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Термін дії кешу полів. Кешує згруповані значення полів категорій, за замовчуванням 3600 секунд"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Період статистики кешу. Інтервал у секундах для запису статистики кешу в журнал, 0 вимикає, за замовчуванням 3600"

