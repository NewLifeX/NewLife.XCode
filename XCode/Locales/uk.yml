# 程序集标题与描述（英文源文 → 乌克兰语）
"XCode Super ORM Middleware": "Проміжне програмне забезпечення ORM XCode"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "Високопродуктивне проміжне програмне забезпечення даних для .NET (super ORM) з акцентом на CRUD і великі обсяги даних: багаторівневий кеш, автоматична міграція, шардування, строго типізовані запити та міграція між базами даних."
"XCode Entity Generator": "Генератор сутностей XCode"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "Офіційний інструмент командного рядка XCode, що створює класи даних сутностей і бізнес-класи з Model.xml, підтримуючи швидке моделювання та безперервні ітерації."

