# Tiếng Việt 词表（vi）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"No relation key is set.": "Chưa đặt khóa quan hệ."
"No master field is set.": "Chưa đặt trường chính."
"Entity class [{0}] must implement [{1}].": "Lớp thực thể [{0}] phải triển khai [{1}]."
"No model file was found.": "Không tìm thấy tệp mô hình."
"The specified model file does not exist.": "Tệp mô hình được chỉ định không tồn tại."
"[{0}] no connection string is specified!": "[{0}] chưa chỉ định chuỗi kết nối!"
"Unable to load driver [{0}]; add the database driver package from NuGet.": "Không thể tải trình điều khiển [{0}]; hãy thêm gói trình điều khiển cơ sở dữ liệu từ NuGet."
"Detected secondary cache version change {0} => {1}; expiring local cache": "Phát hiện thay đổi phiên bản bộ đệm thứ cấp {0} => {1}; bộ đệm cục bộ sẽ hết hạn"
"Updating (#{0}), reason: {1}": "Đang cập nhật (#{0}), lý do: {1}"
"Completed [{0}] (#{1})": "Đã hoàn thành [{0}] (#{1})"
"Cache forcibly cleared; the next access blocks and waits for a synchronous update": "Bộ đệm đã bị xóa cưỡng bức; lần truy cập tiếp theo sẽ chặn và chờ cập nhật đồng bộ"
"Cache cleared without force; the next access updates asynchronously without blocking": "Bộ đệm đã bị xóa không cưỡng bức; lần truy cập tiếp theo sẽ cập nhật không đồng bộ mà không chặn"
"Object cache <{0}> is full, {1:n0}>{2:n0}, removed [{3:n0}]": "Bộ đệm đối tượng <{0}> đã đầy, {1:n0}>{2:n0}, đã xóa [{3:n0}]"
"Clearing single-object cache, reason: {0}, Using = false": "Đang xóa bộ đệm đối tượng đơn, lý do: {0}, Using = false"
"CacheInvalidator: incrementing cache version of [{0}], {1} => {2}, reason={3}": "CacheInvalidator: đang tăng phiên bản bộ đệm của [{0}], {1} => {2}, lý do={3}"
"No string primary key is defined for [{0}].": "Chưa định nghĩa khóa chính kiểu chuỗi cho [{0}]."
"Table [{0}] has no unique primary key and cannot be used for caching.": "Bảng [{0}] không có khóa chính duy nhất và không thể dùng để lưu vào bộ đệm."
"Entity queue [{0}/{1}] saving {2:n0}, estimated {3:n0}ms": "Hàng đợi thực thể [{0}/{1}] đang lưu {2:n0}, ước tính {3:n0}ms"
"Entity queue of [{0}] overflowed; exceeded the maximum of {1:n0}.": "Hàng đợi thực thể [{0}] bị tràn; đã vượt quá mức tối đa {1:n0}."
"Entity queue of [{0}] still has [{1:n0}] items unsaved on dispose.": "Hàng đợi thực thể [{0}] vẫn còn [{1:n0}] mục chưa được lưu khi hủy."
"Entity queue [{0}/{1}] saved {2:n0}, elapsed {3:n0}ms, speed {4:n0}tps, period {5:n0}ms": "Hàng đợi thực thể [{0}/{1}] đã lưu {2:n0}, thời gian {3:n0}ms, tốc độ {4:n0}tps, chu kỳ {5:n0}ms"
"Set the connection string for [{0}] before using the database.": "Đặt chuỗi kết nối cho [{0}] trước khi sử dụng cơ sở dữ liệu."
"AppDomain.CurrentDomain.FriendlyName is awkward; normalized to: {0}": "AppDomain.CurrentDomain.FriendlyName không phù hợp; đã chuẩn hóa thành: {0}"
"Failed to initialize data! {0}": "Khởi tạo dữ liệu thất bại! {0}"
"DDL mode [{0}]; create table [{1}] manually:{2}{3}": "Chế độ DDL [{0}]; hãy tạo bảng [{1}] thủ công:{2}{3}"
"DDL mode [{0}]; alter table [{1}] manually:{2}{3}": "Chế độ DDL [{0}]; hãy sửa bảng [{1}] thủ công:{2}{3}"
