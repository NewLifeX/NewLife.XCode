# 设置页字段（英文源文，31 种语言完整译文）
"XCode settings": "Cài đặt XCode"
"Debug": "Gỡ lỗi"
"Output SQL. Whether to output SQL statements, enabled by default": "Đầu ra SQL. Có xuất câu lệnh SQL hay không, mặc định bật"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "Thư mục SQL. Thư mục riêng cho đầu ra SQL; mặc định trống nên SQL được ghi vào nhật ký hiện tại. Trong môi trường sản xuất, dùng thư mục SqlLog riêng bên ngoài trang web"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "Thời gian thực thi SQL. SQL chậm hơn ngưỡng này tính bằng mili giây sẽ được ghi nhật ký, mặc định 1000"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "Độ dài SQL tối đa. SQL dài hơn sẽ bị cắt trong nhật ký, mặc định 4096; dùng 0 để tắt cắt"
"Parameterized CRUD. Disabled by default": "CRUD có tham số. Mặc định tắt"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "Kích thước lô. Số dòng mỗi lô cho trích xuất, xóa, sao lưu và khôi phục, mặc định 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "Khoảng cách lô. Tạm dừng giữa các lô tính bằng mili giây, mặc định 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "Thời gian chờ lệnh. Thời gian chờ truy vấn tính bằng giây, mặc định 0 (không giới hạn)"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "Thử lại khi thất bại. Số lần thử lại sau khi hết thời gian chờ lệnh, mặc định 0 (không thử lại)"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "Di chuyển. Off: tắt; ReadOnly: chỉ kiểm tra; On: chỉ tạo; Full: cả sửa và xóa"
"Check comments. Table and column comments for migrations, enabled by default": "Kiểm tra chú thích. Chú thích bảng và cột cho di chuyển, mặc định bật"
"Check for dropped indexes. Migration check, enabled by default": "Kiểm tra chỉ mục đã xóa. Kiểm tra di chuyển, mặc định bật"
"Check for new indexes. Migration check, enabled by default": "Kiểm tra chỉ mục mới. Kiểm tra di chuyển, mặc định bật"
"Check for duplicate indexes. Enabled by default": "Kiểm tra chỉ mục trùng. Mặc định bật"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "Chữ hoa/chữ thường của tên bảng và cột. Default: cơ sở dữ liệu quyết định; None: giữ nguyên kiểu mô hình; Upper: chữ hoa; Lower: chữ thường; Underline: gạch dưới"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "Ngưỡng đếm đầy đủ. Số dòng được ước tính trước từ thống kê chỉ mục; ước tính lớn hơn giá trị này được dùng nguyên, nếu không count(*) sẽ cho giá trị chính xác. Giảm ngưỡng để tránh lần truy cập đầu chậm trên bảng lớn, tăng để đếm chính xác. Mặc định 10 triệu"
"Cache": "Bộ đệm"
"Data cache. Caches by SQL, default 0 seconds": "Bộ đệm dữ liệu. Lưu đệm theo SQL, mặc định 0 giây"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "Hết hạn bộ đệm thực thể. Lưu đệm toàn bộ danh sách thực thể, mặc định 10 giây"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "Hết hạn bộ đệm một đối tượng. Lưu đệm thực thể theo khóa chính, mặc định 10 giây"
"Extended property expiration. Caches the Extends property, default 10 seconds": "Hết hạn thuộc tính mở rộng. Lưu đệm thuộc tính Extends, mặc định 10 giây"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "Hết hạn bộ đệm trường. Lưu đệm giá trị nhóm của các trường danh mục, mặc định 3600 giây"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "Chu kỳ thống kê bộ đệm. Khoảng thời gian tính bằng giây để ghi thống kê bộ đệm, 0 tắt, mặc định 3600"

