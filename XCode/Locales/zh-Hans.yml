# 设置页字段（英文源文，31 种语言完整译文）
"Debug": "调试"
"Output SQL. Whether to output SQL statements, enabled by default": "输出SQL。是否输出SQL语句，默认启用"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL目录。设置SQL输出的单独目录，默认为空，SQL输出到当前日志中。生产环境建议输出到站点外单独的SqlLog目录"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL执行时间。跟踪SQL执行时间，大于该阀值将输出日志，默认1000毫秒"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "SQL最大长度。输出日志时的SQL最大长度，超长截断，默认4096，不截断用0"
"Parameterized CRUD. Disabled by default": "参数化添删改查。默认关闭"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "批大小。用于批量操作数据，抽取、删除、备份、恢复，默认5000"
"Batch interval. Pause between batches in milliseconds, default 100": "批操作间隙。用于批量删除数据时的暂停间隙，单位毫秒，默认100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "命令超时。查询执行超时时间，默认0秒不限制"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "失败重试。执行命令超时后的重试次数，默认0不重试"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "反向工程。Off 关闭；ReadOnly 只读不执行；On 打开，仅新建；Full 完全，修改删除"
"Check comments. Table and column comments for migrations, enabled by default": "检查注释。表注释或字段注释，反向工程，默认打开"
"Check for dropped indexes. Migration check, enabled by default": "检查删除索引。反向工程，默认打开"
"Check for new indexes. Migration check, enabled by default": "检查添加索引。反向工程，默认打开"
"Check for duplicate indexes. Enabled by default": "检查索引重复。默认打开"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "表名称、字段名大小写格式。Default 默认(由数据库决定);None 与模型保持一致;Upper 全大写;Lower 全小写;Underline下划线"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "全表查行数下限。在获取数据表行数时，先根据索引表进行快速统计。如果快速统计的结果大于该值，则使用快速统计的结果。反之则进行 count(*) 操作获取精确统计。调小该值可避免大表页面首次访问太慢，调大该值可获得精确行数。默认1000万"
"Cache": "缓存"
"Data cache. Caches by SQL, default 0 seconds": "数据层缓存。根据sql做缓存，默认0秒"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "实体缓存过期。整表缓存实体列表，默认10秒"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "单对象缓存过期。按主键缓存实体，默认10秒"
"Extended property expiration. Caches the Extends property, default 10 seconds": "扩展属性过期。扩展属性Extends缓存，默认10秒"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "字段缓存过期。缓存表中分类型字段的分组数据，默认3600秒"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "缓存统计周期。在日志中定期输出各个缓存的统计数据，用于分析性能问题，单位秒，0表示不输出，默认3600秒"
"XCode settings": "XCode设置"

# 程序集标题与描述（英文源文 → 简体中文）
"XCode Super ORM Middleware": "XCode超级ORM中间件"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "高性能 .NET 数据中间件（超级ORM），聚焦添删改查与海量数据，内置多级缓存、自动迁移、分表分库、强类型查询与跨库迁移。"
"XCode Entity Generator": "XCode实体生成工具"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "XCode 官方命令行工具，基于 Model.xml 生成实体数据类与业务类，支持快速建模与持续迭代。"
