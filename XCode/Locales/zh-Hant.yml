"SonnetDB does not support field type {0}.": "SonnetDB 不支援欄位型別{0}。"
"SonnetDB STRING does not yet support changing length constraints. See SonnetDB issue #240; the capability still needs to be implemented and released.": "SonnetDB 的 STRING 尚不支援修改長度限制。參見 SonnetDB issue #240；該能力仍需實作並發行。"
"Changing identity or primary key on existing SonnetDB columns requires a separate migration and cannot be done through ALTER COLUMN.": "修改現有 SonnetDB 資料行的自增識別或主鍵需要個別遷移，不能透過 ALTER COLUMN 完成。"
"SonnetDB 4.0.0 DECIMAL ADD/ALTER would lose explicit precision and was rejected to preserve model semantics. See SonnetDB issue #241; it still needs to be fixed and released.": "SonnetDB 4.0.0 的 DECIMAL ADD/ALTER 會遺失明確精度，為保持模型語意已拒絕執行。參見 SonnetDB issue #241；仍需修正並發行。"
"Embedded SonnetDB creates databases through the Data Source directory; configure a separate connection for the target directory.": "內嵌 SonnetDB 透過 Data Source 目錄建立資料庫；請為目標目錄設定個別連線。"
"Embedded SonnetDB does not support deleting the database directory via SQL.": "內嵌 SonnetDB 不支援透過 SQL 刪除資料庫目錄。"
"SonnetDB does not yet support persisting table and column comments. See SonnetDB issue #237; the capability must be implemented and released.": "SonnetDB 尚不支援持久化資料表和欄位註解。參見 SonnetDB issue #237；該能力必須實作並發行。"
"[SonnetDB] Field {0}.{1} declares length {2}, but STRING does not currently support length constraints; pending, see SonnetDB issue #240.": "[SonnetDB] 欄位{0}.{1}宣告長度為{2}，但 STRING 目前不支援長度限制；待處理，參見 SonnetDB issue #240。"
