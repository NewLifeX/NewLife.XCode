# 程序集标题与描述（英文源文 → 繁體中文）
"XCode Super ORM Middleware": "XCode超級ORM中介層"
"High-performance .NET data middleware (super ORM) focused on CRUD and massive data, with multi-level caching, automatic migration, sharding, strongly-typed queries and cross-database migration.": "高效能 .NET 資料中介層（超級ORM），聚焦添刪改查與海量資料，內建多層快取、自動移轉、分表分庫、強型別查詢與跨庫移轉。"
"XCode Entity Generator": "XCode實體產生工具"
"Official XCode command-line tool that generates entity data classes and business classes from Model.xml, supporting rapid modeling and continuous iteration.": "XCode 官方命令列工具，基於 Model.xml 產生實體資料類別與業務類別，支援快速建模與持續迭代。"

