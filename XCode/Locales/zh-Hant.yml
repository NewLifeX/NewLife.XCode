"SonnetDB INT uses signed Int64 and supports only UInt64 values up to Int64.MaxValue.": "SonnetDB 的 INT 使用有號 Int64，僅支援不超過 Int64.MaxValue 的 UInt64 值。"
"SonnetDB 4.0.0 DATETIME can preserve only millisecond precision and rejected sub-millisecond times. See SonnetDB issue #236; full time precision support still needs to be implemented and released.": "SonnetDB 4.0.0 的 DATETIME 只能保留毫秒精度，已拒絕次毫秒時間。參見 SonnetDB issue #236；完整時間精度支援仍需實作並發行。"
"Bounded bulk delete in SonnetDB currently requires a single-column primary key; tables with composite or no primary keys cannot fall back to unbounded delete. See SonnetDB issue #243.": "SonnetDB 的有界批次刪除目前要求單欄主鍵；複合主鍵或無主鍵的資料表無法回退為無界刪除。參見 SonnetDB issue #243。"
"SonnetDB does not yet provide the full semantics of this transaction isolation level; use ReadCommitted. See SonnetDB issue #225.": "SonnetDB 尚未完整支援該交易隔離級別的語意，請使用 ReadCommitted。參見 SonnetDB issue #225。"
"The SonnetDB result does not identify identity columns, so the generated number cannot be obtained safely. Upgrade to a SonnetDB version that includes RETURNING column metadata.": "SonnetDB 結果未標識自增欄位，無法安全取得產生的編號。請升級到包含 RETURNING 欄位中繼資料的 SonnetDB 版本。"
"SonnetDB does not yet support the Replace semantics of deleting conflicting rows and then inserting new rows. See SonnetDB issue #242.": "SonnetDB 尚不支援先刪除衝突資料列再插入新資料列的 Replace 語意。參見 SonnetDB issue #242。"
