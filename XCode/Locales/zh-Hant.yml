# 设置页字段（英文源文，31 种语言完整译文）
"Debug": "偵錯"
"Output SQL. Whether to output SQL statements, enabled by default": "輸出 SQL。是否輸出 SQL 陳述式，預設啟用"
"SQL directory. Separate directory for SQL output; empty by default so SQL goes to the current log. In production, use a dedicated SqlLog directory outside the site": "SQL 目錄。設定 SQL 輸出的單獨目錄，預設為空，SQL 輸出到目前記錄中。生產環境建議輸出到站點外單獨的 SqlLog 目錄"
"SQL execution time. SQL slower than this threshold in milliseconds is logged, default 1000": "SQL 執行時間。追蹤 SQL 執行時間，大於該閾值將輸出記錄，預設 1000 毫秒"
"Maximum SQL length. SQL longer than this is truncated in logs, default 4096; use 0 to disable truncation": "SQL 最大長度。輸出記錄時的 SQL 最大長度，超長截斷，預設 4096，不截斷用 0"
"Parameterized CRUD. Disabled by default": "參數化增刪改查。預設關閉"
"Batch size. Rows per batch for extract, delete, backup and restore, default 5000": "批次大小。用於批次操作資料，抽取、刪除、備份、還原，預設 5000"
"Batch interval. Pause between batches in milliseconds, default 100": "批次操作間隙。用於批次刪除資料時的暫停間隙，單位毫秒，預設 100"
"Command timeout. Query timeout in seconds, default 0 (unlimited)": "命令逾時。查詢執行逾時時間，預設 0 秒不限制"
"Retry on failure. Retries after a command timeout, default 0 (no retry)": "失敗重試。執行命令逾時後的重試次數，預設 0 不重試"
"Migration. Off: disabled; ReadOnly: check only; On: create only; Full: alter and drop as well": "反向工程。Off 關閉；ReadOnly 唯讀不執行；On 開啟，僅新建；Full 完整，修改刪除"
"Check comments. Table and column comments for migrations, enabled by default": "檢查註解。資料表註解或欄位註解，反向工程，預設開啟"
"Check for dropped indexes. Migration check, enabled by default": "檢查刪除索引。反向工程，預設開啟"
"Check for new indexes. Migration check, enabled by default": "檢查新增索引。反向工程，預設開啟"
"Check for duplicate indexes. Enabled by default": "檢查索引重複。預設開啟"
"Table and column name case. Default: database decides; None: keep model casing; Upper: uppercase; Lower: lowercase; Underline: underscore": "資料表名稱、欄位名大小寫格式。Default 預設（由資料庫決定）；None 與模型保持一致；Upper 全大寫；Lower 全小寫；Underline 底線"
"Full count threshold. Row counts are estimated from index statistics first; estimates above this value are used as-is, otherwise count(*) runs for an exact value. Lower it to avoid slow first visits on large tables, raise it for exact counts. Default 10 million": "全表查列數下限。取得資料表列數時，先依索引表快速統計。若快速統計結果大於該值，則採用快速統計結果，反之執行 count(*) 取得精確統計。調小可避免大表頁面首次存取過慢，調大可取得精確列數。預設 1000 萬"
"Cache": "快取"
"Data cache. Caches by SQL, default 0 seconds": "資料層快取。依 SQL 做快取，預設 0 秒"
"Entity cache expiration. Caches the whole entity list, default 10 seconds": "實體快取過期。整表快取實體清單，預設 10 秒"
"Single object cache expiration. Caches entities by primary key, default 10 seconds": "單物件快取過期。依主鍵快取實體，預設 10 秒"
"Extended property expiration. Caches the Extends property, default 10 seconds": "擴充屬性過期。擴充屬性 Extends 快取，預設 10 秒"
"Field cache expiration. Caches grouped values of category fields, default 3600 seconds": "欄位快取過期。快取資料表中分類型欄位的分組資料，預設 3600 秒"
"Cache statistics period. Interval in seconds for logging cache statistics, 0 disables, default 3600": "快取統計週期。在記錄中定期輸出各快取的統計資料，用於分析效能問題，單位秒，0 表示不輸出，預設 3600 秒"
"XCode settings": "XCode 設定"

